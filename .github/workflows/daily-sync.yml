# 楽天の商品同期（5日に1回）と、サイトの作り直し（Cloudflare Pages）
# 必要な Secrets（GitHub の Settings → Secrets and variables → Actions に登録する）：
#   NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY … 商品を書き込む Supabase
#   RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_AFFILIATE_ID … 楽天の API
#   CF_PAGES_DEPLOY_HOOK … Cloudflare Pages の「デプロイフック」の URL（呼ぶとサイトを作り直す）
name: daily-sync

on:
  schedule:
    # 5日に1回。UTC の毎月1・6・11・16・21・26・31日 19:00＝日本時間の翌日 4:00
    - cron: '0 19 */5 * *'
  workflow_dispatch:
    inputs:
      task:
        description: '実行する作業（sync：楽天の同期と作り直し／rebuild：作り直しだけ／gardens・events：データの反映と作り直し）'
        required: true
        default: sync
        type: choice
        options: [sync, rebuild, gardens, events]

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: ${{ github.event_name == 'schedule' || inputs.task != 'rebuild' }}
      - name: 楽天の商品を同期する
        if: ${{ github.event_name == 'schedule' || inputs.task == 'sync' }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "楽天・Supabase の Secrets が未登録のため、同期を省きます"; exit 0; fi
          npm run sync:rakuten
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      - name: 盆栽園・イベントのデータを反映する
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'gardens' || inputs.task == 'events') }}
        run: npm run apply:data -- ${{ inputs.task }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: サイトを作り直す（Cloudflare Pages のデプロイフック）
        id: hook
        run: |
          if [ -z "$HOOK" ]; then echo "CF_PAGES_DEPLOY_HOOK が未登録のため、作り直しを省きます"; exit 0; fi
          # 作り直す前の公開中のサイトの作成時刻（公開されたかを確かめるため）
          before=$(curl -fsS "$SITE/build-info.json?t=$(date +%s)" | jq -r .builtAt 2>/dev/null || echo none)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$HOOK" > /dev/null && echo "作り直しを依頼しました（いま公開中：$before）"
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
          SITE: https://www.bonsai-collection.com
      - name: 公開されたかを確かめる（最大60分待つ。公開されなければ失敗にする）
        if: ${{ steps.hook.outputs.before != '' }}
        run: |
          for i in $(seq 1 120); do
            now=$(curl -fsS "$SITE/build-info.json?t=$(date +%s)" | jq -r .builtAt 2>/dev/null || echo none)
            if [ "$now" != "$BEFORE" ] && [ "$now" != "none" ]; then echo "公開されました：$now"; exit 0; fi
            sleep 30
          done
          echo "::error::60分たっても新しいサイトが公開されませんでした。Cloudflare Pages のデプロイ一覧を確認してください"
          exit 1
        env:
          SITE: https://www.bonsai-collection.com
          BEFORE: ${{ steps.hook.outputs.before }}
