# 日付で切り替わる表示（今月が見頃・いまの時期の贈り物など）が、その日のうちに変わるようにサイトを作り直す
# 楽天の同期（daily-sync.yml、5日に1回）は行わず、Cloudflare Pages のデプロイフックを呼ぶだけ
# 切り替わる日（日本時間）：毎月1日と、src/lib/gift-seasons.ts の show・end の翌日・late.from の日
# あわせて、盆栽園の方が管理画面（/owner）で園の情報や商品を変えた日も作り直す（翌朝までに反映）
name: switch-rebuild

on:
  schedule:
    # 毎日 UTC 15:05＝日本時間 0:05。切り替わる日でなければ何もしない
    - cron: '5 15 * * *'

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: 今日が切り替わる日かを確かめる
        id: day
        run: |
          today=$(TZ=Asia/Tokyo date +%m-%d)
          SWITCH_DAYS="01-08 02-15 05-15 06-22 08-15 09-24 10-15 11-10 12-11 12-15 12-21 12-25"
          if [ "${today#*-}" = "01" ] || echo " $SWITCH_DAYS " | grep -q " $today "; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "$today：切り替わる日なので作り直します"
          else
            echo "$today：切り替わる日ではありません"
          fi
      - name: 盆栽園の方の変更が、いまのサイトのあとにあったかを確かめる
        id: owner
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$KEY" ]; then echo "Supabase の設定がないため確かめません"; exit 0; fi
          changed=$(curl -fsS "$SUPABASE_URL/rest/v1/owner_content_version?select=updated_at&id=eq.1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | jq -r '.[0].updated_at // empty' 2>/dev/null || true)
          built=$(curl -fsS "$SITE/build-info.json?t=$(date +%s)" | jq -r .builtAt 2>/dev/null || true)
          echo "園の方の最後の変更：${changed:-なし}／いまのサイト：${built:-不明}"
          if [ -n "$changed" ] && [ -n "$built" ] && [ "$(date -d "$changed" +%s)" -gt "$(date -d "$built" +%s)" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "変更があるので作り直します"
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE: https://www.bonsai-collection.com
      - name: サイトを作り直す（Cloudflare Pages のデプロイフック）
        id: hook
        if: ${{ steps.day.outputs.run == 'yes' || steps.owner.outputs.run == 'yes' }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_PAGES_DEPLOY_HOOK が未登録のため、作り直しを省きます"; exit 0; fi
          before=$(curl -fsS "$SITE/build-info.json?t=$(date +%s)" | jq -r .builtAt 2>/dev/null || echo none)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$HOOK" > /dev/null && echo "作り直しを依頼しました（いま公開中：$before）"
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
          SITE: https://www.bonsai-collection.com
      - name: 公開されたかを確かめる（最大60分待つ）
        if: ${{ steps.hook.outputs.before != '' }}
        run: |
          for i in $(seq 1 120); do
            now=$(curl -fsS "$SITE/build-info.json?t=$(date +%s)" | jq -r .builtAt 2>/dev/null || echo none)
            if [ "$now" != "$BEFORE" ] && [ "$now" != "none" ]; then echo "公開されました：$now"; exit 0; fi
            sleep 30
          done
          echo "::error::60分たっても新しいサイトが公開されませんでした。Cloudflare Pages のデプロイ一覧を確認してください"
          exit 1
        env:
          SITE: https://www.bonsai-collection.com
          BEFORE: ${{ steps.hook.outputs.before }}
