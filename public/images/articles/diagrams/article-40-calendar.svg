  <rect x="180.0" y="287" width="86.4" height="28" rx="6" fill="#1a365d"/>
  <text x="34" y="366" font-size="24" font-weight="700" fill="#22201c">植え替え</text>
  <rect x="281.7" y="343" width="40.7" height="28" rx="6" fill="#8b6b4a"/>
  <text x="34" y="422" font-size="24" font-weight="700" fill="#22201c">肥料</text>
  <rect x="398.6" y="399" width="50.8" height="28" rx="6" fill="#b8935a"/>
