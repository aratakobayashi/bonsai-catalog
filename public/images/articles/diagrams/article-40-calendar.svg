  <text x="34" y="534" font-size="24" font-weight="700" fill="#22201c">水切れ注意</text>
  <rect x="434.2" y="511" width="177.9" height="28" rx="6" fill="#8aa0bf"/>
  <text x="20" y="596" font-size="22" fill="#6b655b">薄い色：伸びたつるをその都度切る期間</text>
