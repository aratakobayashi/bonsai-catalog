<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>苗木から盆栽を作る最初の作業の流れ</title>
  <rect width="800" height="400" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">最初の作業：5つの手順</text>
  <g font-size="20">
    <rect x="22" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="92" cy="114" r="20" fill="#5b7f4a"/><text x="92" y="122" text-anchor="middle" font-weight="700" fill="#fff">1</text>
    <path d="M92 150 v60" stroke="#7a5236" stroke-width="8" stroke-linecap="round"/><ellipse cx="92" cy="150" rx="30" ry="16" fill="#6f9558"/><path d="M60 226 l14 -10 M124 226 l-14 -10" stroke="#b8935a" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">正面を</text><text x="92" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">決める</text>
    <path d="M164 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M168 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="178" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="248" cy="114" r="20" fill="#5b7f4a"/><text x="248" y="122" text-anchor="middle" font-weight="700" fill="#fff">2</text>
    <path d="M248 214 v-66" stroke="#7a5236" stroke-width="7" stroke-linecap="round"/><path d="M248 190 l-30 -16 M248 170 l28 -14" stroke="#7a5236" stroke-width="5" stroke-linecap="round"/><path d="M248 200 l24 2" stroke="#c9b9a2" stroke-width="5" stroke-dasharray="4 4"/><path d="M276 196 l10 10 M286 196 l-10 10" stroke="#c45c4a" stroke-width="3"/>
    <text x="248" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">枝を</text><text x="248" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">整理する</text>
    <path d="M320 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M324 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="334" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="404" cy="114" r="20" fill="#5b7f4a"/><text x="404" y="122" text-anchor="middle" font-weight="700" fill="#fff">3</text>
    <ellipse cx="404" cy="184" rx="40" ry="26" fill="#8a6a4a"/><path d="M370 196 q-14 14 -18 22 M438 196 q14 14 18 22" stroke="#7a5236" stroke-width="3" fill="none"/><path d="M350 220 l10 -6 M458 220 l-10 -6" stroke="#c45c4a" stroke-width="3"/>
    <text x="404" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">根を</text><text x="404" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">整える</text>
    <path d="M476 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M480 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="490" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="560" cy="114" r="20" fill="#5b7f4a"/><text x="560" y="122" text-anchor="middle" font-weight="700" fill="#fff">4</text>
    <path d="M516 200 h88 l-8 28 h-72 z" fill="#3a3731"/><path d="M560 200 v-46" stroke="#7a5236" stroke-width="7" stroke-linecap="round"/><ellipse cx="560" cy="152" rx="30" ry="16" fill="#6f9558"/>
    <text x="560" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">鉢に植えて</text><text x="560" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">固定する</text>
    <path d="M632 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M636 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="646" y="78" width="132" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="712" cy="114" r="20" fill="#5b7f4a"/><text x="712" y="122" text-anchor="middle" font-weight="700" fill="#fff">5</text>
    <path d="M676 200 h72 l-8 26 h-56 z" fill="#3a3731"/><path d="M712 200 v-40" stroke="#7a5236" stroke-width="6" stroke-linecap="round"/><ellipse cx="712" cy="158" rx="24" ry="13" fill="#6f9558"/><path d="M682 150 q-8 10 -2 20 M672 164 q-6 8 0 16" stroke="#4f86b5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="712" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">水をやって</text><text x="712" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">休ませる</text>
  </g>
  <rect x="22" y="292" width="756" height="78" rx="14" fill="#f3ebdd"/>
  <text x="40" y="324" font-size="20" font-weight="700" fill="#2c2a26">根を切るのは全体の3分の1ほどまで。</text>
  <text x="40" y="354" font-size="19" fill="#2c2a26">針金かけは、植え付けた樹の根が落ち着いてから少しずつ</text>
  <text x="776" y="390" text-anchor="end" font-size="15" fill="#b8935a" letter-spacing="2">盆栽コレクション</text>
</svg>
