  <text x="34" y="142" font-size="24" font-weight="700" fill="#22201c">芽吹き</text>
  <rect x="356.0" y="119" width="51.7" height="28" rx="6" fill="#5b7f4a" fill-opacity="0.5"/>
  <text x="34" y="198" font-size="24" font-weight="700" fill="#22201c">開花</text>
  <rect x="480.0" y="175" width="144.7" height="28" rx="6" fill="#c46a9a"/>
  <text x="34" y="254" font-size="24" font-weight="700" fill="#22201c">花がら切り</text>
