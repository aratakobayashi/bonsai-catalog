  <text x="34" y="310" font-size="24" font-weight="700" fill="#22201c">剪定</text>
  <rect x="221.7" y="287" width="103.3" height="28" rx="6" fill="#1a365d"/>
  <rect x="170.0" y="287" width="51.7" height="28" rx="6" fill="#1a365d" fill-opacity="0.35"/>
  <rect x="738.3" y="287" width="51.7" height="28" rx="6" fill="#1a365d" fill-opacity="0.35"/>
  <text x="34" y="366" font-size="24" font-weight="700" fill="#22201c">植え替え</text>
  <rect x="325.0" y="343" width="51.7" height="28" rx="6" fill="#8b6b4a"/>
  <text x="34" y="422" font-size="24" font-weight="700" fill="#22201c">肥料</text>
  <rect x="376.7" y="399" width="82.7" height="28" rx="6" fill="#b8935a"/>
  <rect x="609.2" y="399" width="51.7" height="28" rx="6" fill="#b8935a"/>
  <text x="34" y="478" font-size="24" font-weight="700" fill="#22201c">凍結に注意</text>
  <rect x="738.3" y="455" width="51.7" height="28" rx="6" fill="#8aa0bf"/>
  <rect x="170.0" y="455" width="82.7" height="28" rx="6" fill="#8aa0bf"/>
  <text x="20" y="534" font-size="22" fill="#6b655b">剪定は落葉後〜3月（濃い色の2〜3月が適期）</text>
  <text x="20" y="566" font-size="22" fill="#6b655b">芽吹きは5月ごろと遅め。枯れたと早合点しない</text>
