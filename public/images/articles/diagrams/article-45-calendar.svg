  <rect x="20" y="164" width="770" height="50" rx="8" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="220" width="770" height="50" rx="8" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
