<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>受け皿に水をためたままの鉢と、流れた水を捨てた鉢の比較</title>
  <rect width="800" height="460" fill="#faf9f6"/>
  <rect x="20" y="20" width="370" height="420" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <g stroke="#8b6b4a" stroke-width="5" stroke-linecap="round"><line x1="40" y1="46" x2="72" y2="78"/><line x1="72" y1="46" x2="40" y2="78"/></g>
  <text x="88" y="72" font-size="28" font-weight="700" fill="#22201c">水がたまったまま</text>
  <path d="M80 300 h250 l-12 30 h-226 z" fill="#e3d2b4" stroke="#8b6b4a" stroke-width="3"/>
  <rect x="96" y="304" width="218" height="18" fill="#1a365d" fill-opacity="0.75"/>
  <path d="M100.0 150 h210 l-21.0 150 h-168.0 z" fill="#8b6b4a"/>
  <path d="M114 160 h182 l-16 128 h-150 z" fill="#5e4630"/>
  <path d="M134 250 h142 l-5 38 h-132 z" fill="#1a365d" fill-opacity="0.55"/>
  <path d="M205 152 q-4.5 -30.0 3.0 -60.0" stroke="#6f5439" stroke-width="6.75" fill="none" stroke-linecap="round"/>
  <g fill="#5b7f4a"><ellipse cx="206.5" cy="83.0" rx="34.5" ry="19.5"/><ellipse cx="176.5" cy="105.5" rx="25.5" ry="13.5"/><ellipse cx="236.5" cy="108.5" rx="24.0" ry="12.75"/></g>
  <text x="205" y="380" font-size="24" fill="#22201c" text-anchor="middle">鉢底がずっと湿る</text>
  <text x="205" y="414" font-size="24" fill="#22201c" text-anchor="middle">根が傷みやすい</text>
  <rect x="410" y="20" width="370" height="420" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="446" cy="62" r="17" fill="none" stroke="#5b7f4a" stroke-width="5"/>
  <text x="478" y="72" font-size="28" font-weight="700" fill="#22201c">流れた水は捨てる</text>
  <path d="M470 300 h250 l-12 30 h-226 z" fill="#e3d2b4" stroke="#8b6b4a" stroke-width="3"/>
  <path d="M490.0 150 h210 l-21.0 150 h-168.0 z" fill="#8b6b4a"/>
  <path d="M504 160 h182 l-16 128 h-150 z" fill="#5e4630"/>
  <path d="M595 152 q-4.5 -30.0 3.0 -60.0" stroke="#6f5439" stroke-width="6.75" fill="none" stroke-linecap="round"/>
  <g fill="#5b7f4a"><ellipse cx="596.5" cy="83.0" rx="34.5" ry="19.5"/><ellipse cx="566.5" cy="105.5" rx="25.5" ry="13.5"/><ellipse cx="626.5" cy="108.5" rx="24.0" ry="12.75"/></g>
  <path d="M705 318 q40 -6 52 -50" stroke="#1a365d" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M746 276 l12 -10 l4 16" stroke="#1a365d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="595" y="380" font-size="24" fill="#22201c" text-anchor="middle">鉢の中に空気が入る</text>
  <text x="595" y="414" font-size="24" fill="#22201c" text-anchor="middle">根が育ちやすい</text>

</svg>
