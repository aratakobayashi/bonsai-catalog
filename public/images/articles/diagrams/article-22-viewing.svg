<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 492" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>展示の盆栽を見る順番。正面から全体の形、根張り、幹の立ち上がりと肌、枝の配りと葉の色、鉢や卓との釣り合い</title>
  <rect width="800" height="492" fill="#faf9f6"/>
  <text x="400" y="48" font-size="30" font-weight="700" fill="#1a365d" text-anchor="middle">1鉢を見る順番</text>
  <rect x="20" y="72" width="420" height="400" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <path d="M230 360 q-30 -60 10 -120 q30 -50 -10 -100" stroke="#6f5439" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M196 362 q20 -14 34 -6 q18 -10 40 6" stroke="#6f5439" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g fill="#5b7f4a"><ellipse cx="226" cy="132" rx="80" ry="34"/><ellipse cx="130" cy="210" rx="64" ry="24"/><ellipse cx="320" cy="196" rx="70" ry="26"/></g>
  <path d="M100.0 362 h260 l-26.0 70 h-208.0 z" fill="#8b6b4a"/>
  <circle cx="370" cy="108" r="20" fill="#1a365d"/>  <text x="370" y="116" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">1</text>
  <circle cx="306" cy="338" r="20" fill="#1a365d"/>  <text x="306" y="346" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">2</text>
  <circle cx="188" cy="290" r="20" fill="#1a365d"/>  <text x="188" y="298" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">3</text>
  <circle cx="78" cy="168" r="20" fill="#1a365d"/>  <text x="78" y="176" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">4</text>
  <circle cx="100" cy="420" r="20" fill="#1a365d"/>  <text x="100" y="428" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">5</text>
  <circle cx="480" cy="112" r="20" fill="#1a365d"/>  <text x="480" y="120" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">1</text>
  <text x="512" y="120" font-size="24" font-weight="700" fill="#22201c">正面から全体の形</text>
  <circle cx="480" cy="184" r="20" fill="#1a365d"/>  <text x="480" y="192" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">2</text>
  <text x="512" y="192" font-size="24" font-weight="700" fill="#22201c">根張り</text>
  <circle cx="480" cy="256" r="20" fill="#1a365d"/>  <text x="480" y="264" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">3</text>
  <text x="512" y="264" font-size="24" font-weight="700" fill="#22201c">幹の立ち上がり・肌</text>
  <circle cx="480" cy="328" r="20" fill="#1a365d"/>  <text x="480" y="336" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">4</text>
  <text x="512" y="336" font-size="24" font-weight="700" fill="#22201c">枝の配りと葉の色</text>
  <circle cx="480" cy="400" r="20" fill="#1a365d"/>  <text x="480" y="408" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">5</text>
  <text x="512" y="408" font-size="24" font-weight="700" fill="#22201c">鉢・卓との釣り合い</text>

</svg>
