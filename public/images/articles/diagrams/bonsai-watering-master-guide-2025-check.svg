<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>土が乾いたかを見る4つの方法</title>
  <rect width="800" height="450" fill="#faf9f6"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">乾いたかを見る4つの方法</text>

  <!-- 1 土の色 -->
  <rect x="20" y="72" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="72" cy="150" r="34" fill="#8b6b4a"/>
  <circle cx="146" cy="150" r="34" fill="#e3d2b4" stroke="#c9b48f" stroke-width="2"/>
  <text x="72" y="220" text-anchor="middle" font-size="22" fill="#22201c">湿</text>
  <text x="146" y="220" text-anchor="middle" font-size="22" fill="#22201c">乾</text>
  <text x="109" y="280" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">土の色</text>
  <text x="109" y="318" text-anchor="middle" font-size="22" fill="#5b7f4a">白っぽい</text>

  <!-- 2 指 -->
  <rect x="214" y="72" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="238" y="160" width="130" height="70" fill="#e3d2b4"/>
  <line x1="238" y1="160" x2="368" y2="160" stroke="#8b6b4a" stroke-width="3"/>
  <path d="M286 92 h32 v86 a16 16 0 0 1 -32 0 z" fill="#f3e3d0" stroke="#22201c" stroke-width="2.5"/>
  <path d="M290 100 h24 v14 h-24 z" fill="#faf9f6" stroke="#22201c" stroke-width="1.5"/>
  <line x1="336" y1="160" x2="336" y2="192" stroke="#1a365d" stroke-width="2.5"/>
  <line x1="330" y1="160" x2="342" y2="160" stroke="#1a365d" stroke-width="2.5"/>
  <line x1="330" y1="192" x2="342" y2="192" stroke="#1a365d" stroke-width="2.5"/>
  <text x="346" y="184" font-size="22" font-weight="700" fill="#1a365d">1cm</text>
  <text x="303" y="280" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">指で触る</text>
  <text x="303" y="318" text-anchor="middle" font-size="22" fill="#5b7f4a">さらさら</text>

  <!-- 3 鉢の重さ -->
  <rect x="408" y="72" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <path d="M447 158 h116 l-14 62 h-88 z" fill="#8b6b4a"/>
  <rect x="447" y="152" width="116" height="10" rx="3" fill="#6f5439"/>
  <rect x="455" y="146" width="100" height="8" fill="#e3d2b4"/>
  <path d="M505 138 v-40" stroke="#b8935a" stroke-width="6" stroke-linecap="round"/>
  <path d="M489 112 l16 -18 l16 18" fill="none" stroke="#b8935a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="497" y="280" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">鉢の重さ</text>
  <text x="497" y="318" text-anchor="middle" font-size="22" fill="#5b7f4a">軽い</text>

  <!-- 4 竹串 -->
  <rect x="602" y="72" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="626" y="150" width="130" height="80" fill="#e3d2b4"/>
  <line x1="626" y1="150" x2="756" y2="150" stroke="#8b6b4a" stroke-width="3"/>
  <rect x="686" y="88" width="10" height="132" rx="3" fill="#b8935a" stroke="#8b6b4a" stroke-width="1.5"/>
  <text x="691" y="280" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">竹串</text>
  <text x="691" y="318" text-anchor="middle" font-size="22" fill="#5b7f4a">土が付かない</text>

  <!-- まとめ -->
  <rect x="20" y="364" width="760" height="66" rx="14" fill="#1a365d"/>
  <text x="400" y="407" text-anchor="middle" font-size="27" font-weight="700" fill="#faf9f6">乾いていたら → 鉢底から流れるまで</text>
</svg>
