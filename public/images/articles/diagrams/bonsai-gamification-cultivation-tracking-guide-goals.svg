<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>季節ごとの小さな目標の例</title>
  <rect width="800" height="460" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">季節ごとの小さな目標の例</text>
  <rect x="22" y="80" width="180" height="270" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="112" cy="140" r="38" fill="#5b7f4a"/>
  <text x="112" y="152" text-anchor="middle" font-size="32" font-weight="700" fill="#faf7f0">春</text>
  <text x="112" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">芽吹きを</text>
  <text x="112" y="266" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">同じ角度で撮る</text>
  <rect x="92" y="296" width="40" height="40" rx="6" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <path d="M100 316 l9 9 l17 -19" fill="none" stroke="#5b7f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="214" y="80" width="180" height="270" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="304" cy="140" r="38" fill="#b8935a"/>
  <text x="304" y="152" text-anchor="middle" font-size="32" font-weight="700" fill="#faf7f0">夏</text>
  <text x="304" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">水やりを</text>
  <text x="304" y="266" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">毎日チェック</text>
  <rect x="284" y="296" width="40" height="40" rx="6" fill="none" stroke="#b8935a" stroke-width="4"/>
  <path d="M292 316 l9 9 l17 -19" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="406" y="80" width="180" height="270" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="496" cy="140" r="38" fill="#8b6b4a"/>
  <text x="496" y="152" text-anchor="middle" font-size="32" font-weight="700" fill="#faf7f0">秋</text>
  <text x="496" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">紅葉や実を</text>
  <text x="496" y="266" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">撮って比べる</text>
  <rect x="476" y="296" width="40" height="40" rx="6" fill="none" stroke="#8b6b4a" stroke-width="4"/>
  <path d="M484 316 l9 9 l17 -19" fill="none" stroke="#8b6b4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="598" y="80" width="180" height="270" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="688" cy="140" r="38" fill="#b8935a"/>
  <text x="688" y="152" text-anchor="middle" font-size="32" font-weight="700" fill="#faf7f0">冬</text>
  <text x="688" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">1年分の写真を</text>
  <text x="688" y="266" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">並べて振り返る</text>
  <rect x="668" y="296" width="40" height="40" rx="6" fill="none" stroke="#b8935a" stroke-width="4"/>
  <path d="M676 316 l9 9 l17 -19" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="398" text-anchor="middle" font-size="22" fill="#6b655b">季節ごとに小さな目標を1つ決めて、できたら印をつける</text>
<text x="776" y="444" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
