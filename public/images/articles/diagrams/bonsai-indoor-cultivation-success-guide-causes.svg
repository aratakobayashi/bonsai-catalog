<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>室内でうまく育たない4つの理由</title>
  <rect width="800" height="450" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">うまく育たない4つの理由</text>
  <rect x="24" y="80" width="370" height="144" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="24" y="80" width="10" height="144" rx="4" fill="#b8935a"/>
  <text x="54" y="134" font-size="26" font-weight="700" fill="#2c2a26">光が足りない</text>
  <text x="54" y="184" font-size="22" fill="#2c2a26">枝が間延びし、葉の色が薄い</text>
  <rect x="406" y="80" width="370" height="144" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="406" y="80" width="10" height="144" rx="4" fill="#4f86b5"/>
  <text x="436" y="134" font-size="26" font-weight="700" fill="#2c2a26">風が通らない</text>
  <text x="436" y="184" font-size="22" fill="#2c2a26">蒸れて病気や虫が出やすい</text>
  <rect x="24" y="240" width="370" height="144" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="24" y="240" width="10" height="144" rx="4" fill="#8b6b4a"/>
  <text x="54" y="294" font-size="26" font-weight="700" fill="#2c2a26">乾き方が変わる</text>
  <text x="54" y="344" font-size="22" fill="#2c2a26">冷暖房で乾く／日が弱く乾かない</text>
  <rect x="406" y="240" width="370" height="144" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="406" y="240" width="10" height="144" rx="4" fill="#5b7f4a"/>
  <text x="436" y="294" font-size="26" font-weight="700" fill="#2c2a26">冬の寒さがない</text>
  <text x="436" y="344" font-size="22" fill="#2c2a26">落葉樹は春の芽吹きが乱れる</text>
<text x="776" y="434" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
