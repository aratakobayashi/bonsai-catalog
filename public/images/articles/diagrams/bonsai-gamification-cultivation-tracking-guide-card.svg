<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の栽培記録の1回分の例。日付と天気、作業、水やり、肥料、気づき、写真</title>
  <rect width="800" height="540" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">1回分の記録の例</text>
  <rect x="60" y="76" width="680" height="404" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="60" y="76" width="680" height="56" rx="14" fill="#a07a42"/><rect x="60" y="110" width="680" height="22" fill="#a07a42"/>
  <text x="90" y="114" font-size="24" font-weight="700" fill="#faf7f0">黒松（1号）</text>
  <text x="710" y="114" text-anchor="end" font-size="22" fill="#faf7f0">4月12日　晴れ</text>
  <line x1="84" y1="202" x2="716" y2="202" stroke="#d9d1c3" stroke-width="2"/>
  <text x="90" y="188" font-size="22" font-weight="700" fill="#5b7f4a">作業</text>
  <text x="210" y="188" font-size="22" fill="#2c2a26">芽切りの前の確認・下枝を少し剪定</text>
  <line x1="84" y1="266" x2="716" y2="266" stroke="#d9d1c3" stroke-width="2"/>
  <text x="90" y="252" font-size="22" font-weight="700" fill="#5b7f4a">水やり</text>
  <text x="210" y="252" font-size="22" fill="#2c2a26">朝1回　表面が白く乾いてから</text>
  <line x1="84" y1="330" x2="716" y2="330" stroke="#d9d1c3" stroke-width="2"/>
  <text x="90" y="316" font-size="22" font-weight="700" fill="#5b7f4a">肥料</text>
  <text x="210" y="316" font-size="22" fill="#2c2a26">置き肥を2個追加</text>
  <line x1="84" y1="394" x2="716" y2="394" stroke="#d9d1c3" stroke-width="2"/>
  <text x="90" y="380" font-size="22" font-weight="700" fill="#5b7f4a">気づき</text>
  <text x="210" y="380" font-size="22" fill="#2c2a26">南側の芽の伸びが強い</text>
  <line x1="84" y1="458" x2="716" y2="458" stroke="#d9d1c3" stroke-width="2"/>
  <text x="90" y="444" font-size="22" font-weight="700" fill="#5b7f4a">写真</text>
  <text x="210" y="444" font-size="22" fill="#2c2a26">正面・右横の2枚</text>
<text x="776" y="524" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
