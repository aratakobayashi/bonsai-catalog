<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>苗木を選ぶときに見る4つのところ</title>
  <rect width="800" height="480" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">盆栽に向く苗木の見どころ</text>
  <rect x="22" y="72" width="330" height="378" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <!-- pot -->
  <path d="M96 380 h188 l-14 46 h-160 z" fill="#3a3731"/>
  <!-- roots -->
  <path d="M190 378 q-40 2 -66 6 M190 378 q40 2 66 6 M190 378 q-20 4 -36 8 M190 378 q20 4 36 8" fill="none" stroke="#7a5236" stroke-width="7" stroke-linecap="round"/>
  <!-- trunk -->
  <path d="M168 380 q-6 -60 10 -110 q14 -46 4 -100 l14 0 q12 54 -2 100 q-12 46 18 110 z" fill="#7a5236"/>
  <!-- branches -->
  <path d="M176 300 q-40 -6 -70 -26" stroke="#7a5236" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M196 252 q40 -6 70 -28" stroke="#7a5236" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M186 200 q-30 -12 -50 -34" stroke="#7a5236" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="96" cy="266" rx="44" ry="22" fill="#5b7f4a"/>
  <ellipse cx="276" cy="216" rx="46" ry="24" fill="#6f9558"/>
  <ellipse cx="130" cy="160" rx="38" ry="20" fill="#5b7f4a"/>
  <ellipse cx="192" cy="124" rx="52" ry="30" fill="#6f9558"/>
  <!-- callouts -->
  <g font-size="19" font-weight="700" fill="#fff">
    <circle cx="300" cy="384" r="18" fill="#b8935a"/><text x="300" y="391" text-anchor="middle">1</text>
    <circle cx="226" cy="330" r="18" fill="#b8935a"/><text x="226" y="337" text-anchor="middle">2</text>
    <circle cx="66" cy="300" r="18" fill="#b8935a"/><text x="66" y="307" text-anchor="middle">3</text>
    <circle cx="250" cy="120" r="18" fill="#b8935a"/><text x="250" y="127" text-anchor="middle">4</text>
  </g>
  <g font-size="21">
    <circle cx="390" cy="112" r="18" fill="#b8935a"/><text x="390" y="119" text-anchor="middle" font-weight="700" fill="#fff">1</text>
    <text x="420" y="110" font-weight="700" fill="#2c2a26">根張り</text>
    <text x="420" y="140" font-size="18" fill="#6b655b">根が四方に広がり、地面をつかむ</text>
    <circle cx="390" cy="200" r="18" fill="#b8935a"/><text x="390" y="207" text-anchor="middle" font-weight="700" fill="#fff">2</text>
    <text x="420" y="198" font-weight="700" fill="#2c2a26">幹の太り方</text>
    <text x="420" y="228" font-size="18" fill="#6b655b">根元が太く、上に向かって細くなる</text>
    <circle cx="390" cy="288" r="18" fill="#b8935a"/><text x="390" y="295" text-anchor="middle" font-weight="700" fill="#fff">3</text>
    <text x="420" y="286" font-weight="700" fill="#2c2a26">下のほうの枝</text>
    <text x="420" y="316" font-size="18" fill="#6b655b">低い位置にも枝があると形を作りやすい</text>
    <circle cx="390" cy="376" r="18" fill="#b8935a"/><text x="390" y="383" text-anchor="middle" font-weight="700" fill="#fff">4</text>
    <text x="420" y="374" font-weight="700" fill="#2c2a26">元気さ</text>
    <text x="420" y="404" font-size="18" fill="#6b655b">葉が詰まり、色つやがよい</text>
  </g>
  <text x="776" y="470" text-anchor="end" font-size="15" fill="#b8935a" letter-spacing="2">盆栽コレクション</text>
</svg>
