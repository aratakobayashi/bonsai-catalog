  <line x1="604" y1="120" x2="604" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="626" y1="120" x2="626" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="648" y1="120" x2="648" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="670" y1="120" x2="670" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="692" y1="120" x2="692" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="714" y1="120" x2="714" y2="200" stroke="#b8935a" stroke-width="3"/>
