  <line x1="428" y1="120" x2="428" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="450" y1="120" x2="450" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="472" y1="120" x2="472" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="494" y1="120" x2="494" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="516" y1="120" x2="516" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="538" y1="120" x2="538" y2="200" stroke="#b8935a" stroke-width="3"/>
  <line x1="560" y1="120" x2="560" y2="200" stroke="#b8935a" stroke-width="3"/>
