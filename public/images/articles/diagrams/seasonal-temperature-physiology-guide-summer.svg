<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>夏に鉢を熱くしない工夫。コンクリートの床に直置きすると照り返しで鉢と根が熱くなる。棚に上げて床から離し、すだれで午後の日差しを和らげ、鉢の間をあける</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">夏に鉢を熱くしない工夫</text>
  <rect x="20" y="420" width="760" height="40" fill="#c9c2b5"/>
  <text x="400" y="449" font-size="22" text-anchor="middle" fill="#22201c">コンクリートの床</text>
  <rect x="76" y="370" width="128" height="9" rx="3" fill="#6f5439"/>
  <path d="M80 378 h120 l-10 36 h-100 z" fill="#8b6b4a"/>
  <path d="M66 416 q8 -14 0 -28 q-8 -14 0 -28" stroke="#b4573a" stroke-width="3.5" fill="none"/>
  <path d="M214 416 q8 -14 0 -28 q-8 -14 0 -28" stroke="#b4573a" stroke-width="3.5" fill="none"/>
  <text x="140" y="110" font-size="25" text-anchor="middle" font-weight="700" fill="#22201c">床に直置き</text>
  <text x="140" y="146" font-size="22" text-anchor="middle" fill="#8b6b4a">照り返しで</text>
  <text x="140" y="178" font-size="22" text-anchor="middle" fill="#8b6b4a">鉢と根が熱くなる</text>
