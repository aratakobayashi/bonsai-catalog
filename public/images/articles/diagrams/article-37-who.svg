<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 293" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>相手の経験で選び方を変える</title>
<defs>
  <g id="tree"><path d="M-40 0 h80 l-9 26 h-62 z" fill="#8b6b4a"/><path d="M0 0 q-6 -30 4 -56" stroke="#6f5439" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="2" cy="-62" rx="34" ry="20" fill="#5b7f4a"/><ellipse cx="-24" cy="-40" rx="20" ry="12" fill="#5b7f4a"/><ellipse cx="28" cy="-38" rx="20" ry="12" fill="#5b7f4a"/></g>
  <g id="ok"><circle r="15" fill="none" stroke="#5b7f4a" stroke-width="5"/></g>
  <g id="ng"><g stroke="#8b6b4a" stroke-width="5" stroke-linecap="round"><line x1="-13" y1="-13" x2="13" y2="13"/><line x1="13" y1="-13" x2="-13" y2="13"/></g></g>
  <g id="tri"><path d="M0 -15 L15 12 H-15 Z" fill="none" stroke="#b8935a" stroke-width="5" stroke-linejoin="round"/></g>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b655b"/></marker>
</defs>
  <rect width="800" height="293" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">相手の経験で選び方を変える</text>
  <rect x="20" y="68" width="242.667" height="205" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="141.333" y="124" font-size="25" text-anchor="middle" font-weight="700" fill="#22201c">はじめて育てる</text>
  <text x="141.333" y="166" font-size="22" text-anchor="middle" fill="#6b655b">丈夫な樹と</text>
  <text x="141.333" y="197" font-size="22" text-anchor="middle" fill="#6b655b">育て方のメモ</text>
  <text x="141.333" y="228" font-size="22" text-anchor="middle" fill="#6b655b">を一緒に</text>
  <rect x="278.667" y="68" width="242.667" height="205" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="400" y="124" font-size="25" text-anchor="middle" font-weight="700" fill="#22201c">すでに育てている</text>
  <text x="400" y="166" font-size="22" text-anchor="middle" fill="#6b655b">持っていない</text>
  <text x="400" y="197" font-size="22" text-anchor="middle" fill="#6b655b">樹種や鉢を</text>
  <text x="400" y="228" font-size="22" text-anchor="middle" fill="#6b655b">好みを聞いて</text>
  <rect x="537.333" y="68" width="242.667" height="205" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="658.667" y="124" font-size="25" text-anchor="middle" font-weight="700" fill="#22201c">忙しい・留守がち</text>
  <text x="658.667" y="166" font-size="22" text-anchor="middle" fill="#6b655b">乾きにくい</text>
  <text x="658.667" y="197" font-size="22" text-anchor="middle" fill="#6b655b">少し大きめの</text>
  <text x="658.667" y="228" font-size="22" text-anchor="middle" fill="#6b655b">鉢を選ぶ</text>
</svg>
