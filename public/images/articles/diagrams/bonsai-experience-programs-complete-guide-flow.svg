<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>体験教室の当日の流れと、持ち帰ったあとの管理</title>
  <rect width="800" height="480" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">当日の流れと持ち帰り後</text>
  <rect x="22" y="86" width="138" height="120" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="91" cy="126" r="20" fill="#5b7f4a"/>
  <text x="91" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#faf7f0">1</text>
  <text x="91" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">説明を聞く</text>
  <path d="M162 146 h12" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M166 137 l9 9 l-9 9" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="176" y="86" width="138" height="120" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="245" cy="126" r="20" fill="#5b7f4a"/>
  <text x="245" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#faf7f0">2</text>
  <text x="245" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">素材を選ぶ</text>
  <path d="M316 146 h12" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M320 137 l9 9 l-9 9" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="330" y="86" width="138" height="120" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="399" cy="126" r="20" fill="#5b7f4a"/>
  <text x="399" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#faf7f0">3</text>
  <text x="399" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">植え付け</text>
  <path d="M470 146 h12" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M474 137 l9 9 l-9 9" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="484" y="86" width="138" height="120" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="553" cy="126" r="20" fill="#5b7f4a"/>
  <text x="553" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#faf7f0">4</text>
  <text x="553" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">苔・仕上げ</text>
  <path d="M624 146 h12" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M628 137 l9 9 l-9 9" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="638" y="86" width="138" height="120" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="707" cy="126" r="20" fill="#5b7f4a"/>
  <text x="707" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#faf7f0">5</text>
  <text x="707" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">持ち帰り</text>
  <text x="400" y="262" text-anchor="middle" font-size="26" font-weight="700" fill="#2c2a26">家に帰ってから</text>
  <rect x="22" y="284" width="370" height="130" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="408" y="284" width="370" height="130" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="207" y="336" text-anchor="middle" font-size="24" font-weight="700" fill="#2c2a26">数日は半日陰で</text>
  <text x="207" y="376" text-anchor="middle" font-size="22" fill="#2c2a26">風の弱い場所に置く</text>
  <text x="593" y="336" text-anchor="middle" font-size="24" font-weight="700" fill="#2c2a26">土が乾いたら</text>
  <text x="593" y="376" text-anchor="middle" font-size="22" fill="#2c2a26">鉢底から流れるまで水</text>
<text x="776" y="464" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
