<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>水やりの時間帯の向き不向き</title>
  <rect width="800" height="450" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">水やりの時間帯</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="70" width="180" height="360" rx="14"/>
    <rect x="210" y="70" width="180" height="360" rx="14"/>
    <rect x="410" y="70" width="180" height="360" rx="14"/>
    <rect x="600" y="70" width="180" height="360" rx="14"/>
  </g>
  <g font-size="26" font-weight="700" fill="#22201c" text-anchor="middle">
    <text x="110" y="112">朝</text><text x="300" y="112">真夏の日中</text><text x="500" y="112">夕方</text><text x="690" y="112">夜</text>
  </g>
  <!-- marks -->
  <circle cx="110" cy="180" r="38" fill="none" stroke="#5b7f4a" stroke-width="8"/>
  <circle cx="110" cy="180" r="22" fill="none" stroke="#5b7f4a" stroke-width="6"/>
  <path d="M300 144 l40 70 h-80 z" fill="none" stroke="#b8935a" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="500" cy="180" r="36" fill="none" stroke="#1a365d" stroke-width="7"/>
  <path d="M690 144 l40 70 h-80 z" fill="none" stroke="#b8935a" stroke-width="7" stroke-linejoin="round"/>
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="110" y="270">一年を通して</text><text x="110" y="304">基本の時間</text>
    <text x="300" y="270">水が温まり</text><text x="300" y="304">根に負担</text>
    <text x="500" y="270">夏の2回目に</text><text x="500" y="304">乾いていれば</text>
    <text x="690" y="270">朝まで湿り</text><text x="690" y="304">蒸れやすい</text>
  </g>
  <g font-size="22" fill="#6b655b" text-anchor="middle">
    <text x="110" y="380">冬は晴れた午前</text>
    <text x="300" y="380">しおれた時は可</text>
    <text x="500" y="380">冬は避ける</text>
    <text x="690" y="380">忘れた日だけ</text>
  </g>
</svg>
