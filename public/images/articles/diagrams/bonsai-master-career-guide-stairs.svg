<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 546" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>修業で任される仕事の段階。掃除と水やりから始まり、植え替えの手伝い、針金かけと樹づくり、展示の準備と接客へと進む</title>
  <rect width="800" height="546" fill="#faf7f0"/>
  <text x="24" y="44" font-size="30" font-weight="700" fill="#2c2a26">任される仕事の段階</text>
  <rect x="20" y="330" width="180" height="130" rx="10" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="20" y="330" width="180" height="10" rx="5" fill="#b8935a"/>
  <text x="110" y="376" font-size="24" font-weight="700" text-anchor="middle" fill="#2c2a26">掃除・水やり</text>
  <text x="110" y="416" font-size="22" text-anchor="middle" fill="#5b7f4a">鉢と棚の世話</text>
  <rect x="212" y="256" width="180" height="204" rx="10" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="212" y="256" width="180" height="10" rx="5" fill="#b8935a"/>
  <text x="302" y="302" font-size="24" font-weight="700" text-anchor="middle" fill="#2c2a26">植え替えの</text>
  <text x="302" y="334" font-size="24" font-weight="700" text-anchor="middle" fill="#2c2a26">手伝い</text>
  <text x="302" y="374" font-size="22" text-anchor="middle" fill="#5b7f4a">用土づくり</text>
  <text x="302" y="404" font-size="22" text-anchor="middle" fill="#5b7f4a">下枝の剪定</text>
  <rect x="404" y="182" width="180" height="278" rx="10" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="404" y="182" width="180" height="10" rx="5" fill="#b8935a"/>
  <text x="494" y="228" font-size="24" font-weight="700" text-anchor="middle" fill="#2c2a26">針金かけ</text>
  <text x="494" y="260" font-size="24" font-weight="700" text-anchor="middle" fill="#2c2a26">樹づくり</text>
  <text x="494" y="300" font-size="22" text-anchor="middle" fill="#5b7f4a">任される樹が</text>
  <text x="494" y="330" font-size="22" text-anchor="middle" fill="#5b7f4a">増えていく</text>
  <rect x="596" y="108" width="180" height="352" rx="10" fill="#fff" stroke="#b8935a" stroke-width="3"/>
  <rect x="596" y="108" width="180" height="10" rx="5" fill="#b8935a"/>
  <text x="686" y="154" font-size="24" font-weight="700" text-anchor="middle" fill="#2c2a26">展示の準備</text>
  <text x="686" y="186" font-size="24" font-weight="700" text-anchor="middle" fill="#2c2a26">接客</text>
  <text x="686" y="226" font-size="22" text-anchor="middle" fill="#5b7f4a">預かった樹の</text>
  <text x="686" y="256" font-size="22" text-anchor="middle" fill="#5b7f4a">管理も</text>
  <path d="M40 488 H760" stroke="#6b655b" stroke-width="3"/><path d="M760 488 l-14 -9 v18 z" fill="#6b655b"/>
  <text x="400" y="478" font-size="22" text-anchor="middle" fill="#6b655b">修業の年数とともに</text>
<text x="776" y="530" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
