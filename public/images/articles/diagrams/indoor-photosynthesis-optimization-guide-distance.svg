<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>窓からの距離と明るさ</title>
  <rect width="800" height="460" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">窓から離れると急に暗くなる</text>

  <!-- 窓 -->
  <rect x="20" y="80" width="56" height="230" fill="#dfe8f0" stroke="#1a365d" stroke-width="3"/>
  <line x1="48" y1="80" x2="48" y2="310" stroke="#1a365d" stroke-width="2"/>
  <text x="48" y="344" text-anchor="middle" font-size="22" fill="#1a365d">窓</text>

  <!-- 明るさの段（棒の高さで表す） -->
  <g>
    <rect x="100" y="90" width="120" height="220" fill="#b8935a"/>
    <rect x="236" y="190" width="120" height="120" fill="#b8935a" fill-opacity="0.7"/>
    <rect x="372" y="250" width="120" height="60" fill="#b8935a" fill-opacity="0.5"/>
    <rect x="508" y="278" width="120" height="32" fill="#b8935a" fill-opacity="0.35"/>
    <rect x="644" y="292" width="120" height="18" fill="#b8935a" fill-opacity="0.25"/>
  </g>
  <line x1="90" y1="310" x2="780" y2="310" stroke="#22201c" stroke-width="2"/>
  <text x="100" y="76" font-size="22" fill="#6b655b">明るさ（イメージ）</text>

  <!-- 距離の区分 -->
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="160" y="344">窓辺</text>
    <text x="296" y="344">約1m</text>
    <text x="568" y="344">部屋の奥</text>
  </g>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="100" y="364" width="256" height="76" rx="10"/>
    <rect x="372" y="364" width="392" height="76" rx="10"/>
  </g>
  <circle cx="126" cy="402" r="12" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <text x="148" y="410" font-size="23" font-weight="700" fill="#5b7f4a">育てる場所</text>
  <g stroke="#b4573a" stroke-width="4" stroke-linecap="round"><line x1="390" y1="392" x2="410" y2="412"/><line x1="410" y1="392" x2="390" y2="412"/></g>
  <text x="424" y="410" font-size="23" font-weight="700" fill="#8b6b4a">飾るのは数日だけ</text>
</svg>
