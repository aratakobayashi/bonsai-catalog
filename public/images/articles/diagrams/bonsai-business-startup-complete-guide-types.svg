<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽を仕事にする主な形</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">盆栽を仕事にする主な形</text>
  <g>
    <rect x="20" y="72" width="375" height="170" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="20" y="72" width="12" height="170" rx="4" fill="#5b7f4a"/>
    <text x="52" y="118" font-size="27" font-weight="700" fill="#22201c">育てて売る</text>
    <text x="52" y="160" font-size="22" fill="#22201c">店舗・通販・即売会</text>
    <text x="52" y="198" font-size="22" fill="#6b655b">必要：棚と水場、仕入れ</text>
    <text x="52" y="226" font-size="22" fill="#6b655b">夏も休めない管理</text>
  </g>
  <g>
    <rect x="405" y="72" width="375" height="170" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="405" y="72" width="12" height="170" rx="4" fill="#1a365d"/>
    <text x="437" y="118" font-size="27" font-weight="700" fill="#22201c">教える</text>
    <text x="437" y="160" font-size="22" fill="#22201c">教室・ワークショップ</text>
    <text x="437" y="198" font-size="22" fill="#6b655b">必要：会場、教材の樹</text>
    <text x="437" y="226" font-size="22" fill="#6b655b">人に伝える経験</text>
  </g>
  <g>
    <rect x="20" y="256" width="375" height="170" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="20" y="256" width="12" height="170" rx="4" fill="#b8935a"/>
    <text x="52" y="302" font-size="27" font-weight="700" fill="#22201c">手入れを請け負う</text>
    <text x="52" y="344" font-size="22" fill="#22201c">剪定・植え替え・預かり</text>
    <text x="52" y="382" font-size="22" fill="#6b655b">必要：確かな技術と信用</text>
    <text x="52" y="410" font-size="22" fill="#6b655b">預かる樹の置き場所</text>
  </g>
  <g>
    <rect x="405" y="256" width="375" height="170" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="405" y="256" width="12" height="170" rx="4" fill="#8b6b4a"/>
    <text x="437" y="302" font-size="27" font-weight="700" fill="#22201c">道具・鉢を作る</text>
    <text x="437" y="344" font-size="22" fill="#22201c">鉢、棚、苔玉の素材など</text>
    <text x="437" y="382" font-size="22" fill="#6b655b">必要：制作の設備と技術</text>
    <text x="437" y="410" font-size="22" fill="#6b655b">販路づくり</text>
  </g>
  <text x="400" y="456" text-anchor="middle" font-size="22" fill="#6b655b">多くの人は、いくつかを組み合わせている</text>
</svg>
