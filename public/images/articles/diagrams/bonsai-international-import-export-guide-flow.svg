<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽を海外へ送るときの手続きの流れ</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">海外へ送るときの流れ</text>
  <rect x="20" y="70" width="760" height="56" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="56" cy="98.0" r="19" fill="#1a365d"/>
  <text x="56" y="106.0" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="92" y="107.0" font-size="24" font-weight="700" fill="#22201c">相手国の条件を調べる</text>
  <text x="764" y="106.0" font-size="22" text-anchor="end" fill="#5b7f4a">樹種・土・書類</text>
  <rect x="20" y="136" width="760" height="56" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="56" cy="164.0" r="19" fill="#1a365d"/>
  <text x="56" y="172.0" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="92" y="173.0" font-size="24" font-weight="700" fill="#22201c">植物防疫所に相談する</text>
  <text x="764" y="172.0" font-size="22" text-anchor="end" fill="#5b7f4a">日程に余裕を</text>
  <rect x="20" y="202" width="760" height="56" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="56" cy="230.0" r="19" fill="#1a365d"/>
  <text x="56" y="238.0" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="92" y="239.0" font-size="24" font-weight="700" fill="#22201c">土を落として根を洗う</text>
  <text x="764" y="238.0" font-size="22" text-anchor="end" fill="#5b7f4a">虫や病気も除く</text>
  <rect x="20" y="268" width="760" height="56" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="56" cy="296.0" r="19" fill="#1a365d"/>
  <text x="56" y="304.0" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">4</text>
  <text x="92" y="305.0" font-size="24" font-weight="700" fill="#22201c">輸出検査を受ける</text>
  <text x="764" y="304.0" font-size="22" text-anchor="end" fill="#5b7f4a">合格で証明書</text>
  <rect x="20" y="334" width="760" height="56" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="56" cy="362.0" r="19" fill="#1a365d"/>
  <text x="56" y="370.0" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">5</text>
  <text x="92" y="371.0" font-size="24" font-weight="700" fill="#22201c">梱包して送る</text>
  <text x="764" y="370.0" font-size="22" text-anchor="end" fill="#5b7f4a">証明書を添える</text>
  <rect x="20" y="400" width="760" height="56" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="56" cy="428.0" r="19" fill="#1a365d"/>
  <text x="56" y="436.0" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">6</text>
  <text x="92" y="437.0" font-size="24" font-weight="700" fill="#22201c">相手国で輸入検査</text>
  <text x="764" y="436.0" font-size="22" text-anchor="end" fill="#5b7f4a">合えば受け取り</text>
</svg>
