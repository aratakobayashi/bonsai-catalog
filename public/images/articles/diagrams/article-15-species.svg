<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>樹種による夏の日差しの当て方</title>
  <rect width="800" height="470" fill="#faf7f0"/>
  <text x="24" y="46" font-size="30" font-weight="700" fill="#2c2a26">樹種による夏の日差しの当て方</text>
  <g fill="#fff" stroke="#d9d1c3" stroke-width="2">
    <rect x="20" y="70" width="240" height="340" rx="14"/>
    <rect x="280" y="70" width="240" height="340" rx="14"/>
    <rect x="540" y="70" width="240" height="340" rx="14"/>
  </g>
  <!-- sun icons -->
  <circle cx="140" cy="140" r="34" fill="#b8935a"/>
  <circle cx="400" cy="140" r="34" fill="#b8935a"/>
  <path d="M400 106 a34 34 0 0 1 0 68 z" fill="#6b655b"/>
  <circle cx="660" cy="140" r="34" fill="#b8935a" fill-opacity="0.35"/>
  <rect x="610" y="100" width="100" height="10" fill="#6b655b"/>
  <g font-size="25" font-weight="700" fill="#2c2a26" text-anchor="middle">
    <text x="140" y="222">日なたのまま</text>
    <text x="400" y="222">午後は日陰</text>
    <text x="660" y="222">遮光の下</text>
  </g>
  <g font-size="22" fill="#2c2a26" text-anchor="middle">
    <text x="140" y="270">黒松・真柏</text>
    <text x="140" y="304">杜松</text>
    <text x="400" y="270">もみじ・欅</text>
    <text x="400" y="304">梅・さつき</text>
    <text x="400" y="338">五葉松</text>
    <text x="660" y="270">ミニ盆栽</text>
    <text x="660" y="304">植え替え直後</text>
  </g>
  <g font-size="22" fill="#6b655b" text-anchor="middle">
    <text x="140" y="370">照り返しに注意</text>
    <text x="400" y="370">西日を避ける</text>
    <text x="660" y="370">弱った樹も</text>
  </g>
<text x="776" y="454" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
