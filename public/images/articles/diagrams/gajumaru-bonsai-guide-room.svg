<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>室内でのガジュマルの置き場所</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">室内の置き場所</text>

  <!-- 部屋 -->
  <rect x="20" y="70" width="760" height="330" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <line x1="20" y1="400" x2="780" y2="400" stroke="#8b6b4a" stroke-width="4"/>

  <!-- 窓とレースカーテン -->
  <rect x="34" y="96" width="70" height="250" fill="#dfe8f0" stroke="#1a365d" stroke-width="3"/>
  <path d="M104 96 q12 30 0 60 q-12 30 0 60 q12 30 0 60 q-12 30 0 60 q12 5 0 10" fill="none" stroke="#b8935a" stroke-width="3"/>
  <!-- 光 -->
  <g stroke="#b8935a" stroke-width="3" stroke-dasharray="8 8" fill="none">
    <line x1="112" y1="130" x2="210" y2="210"/>
    <line x1="112" y1="190" x2="210" y2="260"/>
  </g>

  <!-- よい：窓辺の樹 -->
  <rect x="160" y="330" width="120" height="70" fill="#ebe7df"/>
  <path d="M184 300 h72 l-8 30 h-56 z" fill="#8b6b4a"/>
  <path d="M210 300 q-2 -30 10 -46 q12 16 10 46 z" fill="#6f5439"/>
  <ellipse cx="220" cy="244" rx="70" ry="38" fill="#5b7f4a"/>
  <circle cx="220" cy="140" r="22" fill="none" stroke="#5b7f4a" stroke-width="6"/>
  <text x="220" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#5b7f4a">窓辺</text>

  <!-- エアコン -->
  <rect x="470" y="88" width="160" height="46" rx="8" fill="#f3f0ea" stroke="#22201c" stroke-width="2"/>
  <g stroke="#8b6b4a" stroke-width="3" fill="none">
    <path d="M490 146 q20 18 0 36"/><path d="M550 146 q20 18 0 36"/><path d="M610 146 q20 18 0 36"/>
  </g>
  <g stroke="#b4573a" stroke-width="6" stroke-linecap="round"><line x1="650" y1="94" x2="678" y2="122"/><line x1="678" y1="94" x2="650" y2="122"/></g>
  <text x="550" y="226" text-anchor="middle" font-size="24" font-weight="700" fill="#22201c">エアコンの風</text>

  <!-- 部屋の奥 -->
  <rect x="640" y="250" width="130" height="150" fill="#ebe7df"/>
  <g stroke="#b4573a" stroke-width="6" stroke-linecap="round"><line x1="690" y1="272" x2="718" y2="300"/><line x1="718" y1="272" x2="690" y2="300"/></g>
  <text x="705" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#22201c">部屋の奥</text>
  <text x="705" y="372" text-anchor="middle" font-size="22" fill="#8b6b4a">暗い</text>

  <!-- 冬の夜 -->
  <path d="M300 300 h120" stroke="#1a365d" stroke-width="4" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a365d"/></marker></defs>
  <text x="300" y="350" font-size="22" fill="#1a365d">冬の夜は窓から離す</text>

  <text x="20" y="444" font-size="22" fill="#22201c">○ レースカーテン越しの明るい窓辺</text>
  <text x="20" y="480" font-size="22" fill="#22201c">× 冷暖房の風が当たる場所・暗い部屋の奥</text>
</svg>
