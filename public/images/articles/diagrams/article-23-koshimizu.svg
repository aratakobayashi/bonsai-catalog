<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>腰水のしかた。水を張った容器に鉢の下3分の1ほどを浸し、日陰に置く。留守の間だけにして、帰ったら水を捨てる</title>
  <rect width="800" height="540" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">腰水のしかた</text>
  <rect x="20" y="72" width="760" height="330" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <path d="M150 260 h500 v100 h-500 z" fill="none" stroke="#8b6b4a" stroke-width="4"/>
  <rect x="152" y="292" width="496" height="66" fill="#a07a42" fill-opacity="0.35"/>
  <path d="M270.0 200 h260 l-26.0 158 h-208.0 z" fill="#8b6b4a"/>
  <path d="M282 210 h236 l-18 136 h-200 z" fill="#5e4630"/>
  <path d="M400 202 q-4.800000000000001 -32.0 3.2 -64.0" stroke="#6f5439" stroke-width="7.2" fill="none" stroke-linecap="round"/>
  <g fill="#5b7f4a"><ellipse cx="401.6" cy="128.39999999999998" rx="36.800000000000004" ry="20.8"/><ellipse cx="369.6" cy="152.4" rx="27.200000000000003" ry="14.4"/><ellipse cx="433.6" cy="155.6" rx="25.6" ry="13.600000000000001"/></g>
  <g stroke="#b8935a" stroke-width="3"><line x1="680" y1="292" x2="680" y2="358"/><line x1="670" y1="292" x2="690" y2="292"/><line x1="670" y1="358" x2="690" y2="358"/></g>
  <text x="560" y="140" font-size="24" font-weight="700" fill="#2c2a26">鉢の高さの</text>
  <text x="560" y="172" font-size="24" font-weight="700" fill="#2c2a26">下3分の1ほど</text>
  <path d="M640 182 q30 40 36 104" stroke="#2c2a26" stroke-width="2" fill="none"/>
  <text x="60" y="140" font-size="24" font-weight="700" fill="#2c2a26">日陰に置く</text>
  <text x="60" y="172" font-size="24" font-weight="700" fill="#8b6b4a">留守の間だけ</text>
  <rect x="20" y="418" width="760" height="62" rx="14" fill="#a07a42"/>
  <text x="400" y="458.36" font-size="26" font-weight="700" fill="#faf7f0" text-anchor="middle">帰ったら水を捨て、ふだんの水やりに戻す</text>

<text x="776" y="524" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
