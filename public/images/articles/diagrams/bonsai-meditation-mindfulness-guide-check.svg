<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>眺めるときに見るところ。葉の色とつや、芽のふくらみ、土の乾き、幹と枝の虫や傷</title>
  <rect width="800" height="384" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">眺めるときに見るところ</text>
  <rect x="20" y="70" width="370" height="134" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="70" width="12" height="134" rx="6" fill="#5b7f4a"/>
  <text x="56" y="146" font-size="30" font-weight="700" fill="#22201c">葉</text>
  <text x="210" y="126" font-size="24" fill="#6b655b">色・つや</text>
  <text x="210" y="166" font-size="24" fill="#6b655b">縁の傷み</text>
  <rect x="410" y="70" width="370" height="134" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="410" y="70" width="12" height="134" rx="6" fill="#5b7f4a"/>
  <text x="446" y="146" font-size="30" font-weight="700" fill="#22201c">芽</text>
  <text x="600" y="126" font-size="24" fill="#6b655b">ふくらみ</text>
  <text x="600" y="166" font-size="24" fill="#6b655b">伸びる向き</text>
  <rect x="20" y="220" width="370" height="134" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="220" width="12" height="134" rx="6" fill="#5b7f4a"/>
  <text x="56" y="296" font-size="30" font-weight="700" fill="#22201c">土</text>
  <text x="210" y="276" font-size="24" fill="#6b655b">色・乾き</text>
  <text x="210" y="316" font-size="24" fill="#6b655b">苔の様子</text>
  <rect x="410" y="220" width="370" height="134" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="410" y="220" width="12" height="134" rx="6" fill="#5b7f4a"/>
  <text x="446" y="296" font-size="30" font-weight="700" fill="#22201c">幹と枝</text>
  <text x="600" y="276" font-size="24" fill="#6b655b">虫・白い粉</text>
  <text x="600" y="316" font-size="24" fill="#6b655b">傷・枯れ</text>
</svg>
