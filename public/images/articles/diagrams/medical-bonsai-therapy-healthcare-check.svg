<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>施設で盆栽を始める前に決めておくこと</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">始める前に決めること</text>
  <rect x="20" y="70" width="760" height="66" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="40" y="87" width="32" height="32" rx="6" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <path d="M47 103 l8 8 l14 -16" stroke="#5b7f4a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="112" font-size="26" font-weight="700" fill="#22201c">置き場所</text>
  <text x="250" y="112" font-size="24" fill="#6b655b">屋外の棚。許可をとる</text>
  <rect x="20" y="148" width="760" height="66" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="40" y="165" width="32" height="32" rx="6" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <path d="M47 181 l8 8 l14 -16" stroke="#5b7f4a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="190" font-size="26" font-weight="700" fill="#22201c">作業台</text>
  <text x="250" y="190" font-size="24" fill="#6b655b">座ったまま届く高さ</text>
  <rect x="20" y="226" width="760" height="66" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="40" y="243" width="32" height="32" rx="6" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <path d="M47 259 l8 8 l14 -16" stroke="#5b7f4a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="268" font-size="26" font-weight="700" fill="#22201c">樹種</text>
  <text x="250" y="268" font-size="24" fill="#6b655b">丈夫・トゲや実に注意</text>
  <rect x="20" y="304" width="760" height="66" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="40" y="321" width="32" height="32" rx="6" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <path d="M47 337 l8 8 l14 -16" stroke="#5b7f4a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="346" font-size="26" font-weight="700" fill="#22201c">水やり</text>
  <text x="250" y="346" font-size="24" fill="#6b655b">当番表。休日も担当</text>
  <rect x="20" y="382" width="760" height="66" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="40" y="399" width="32" height="32" rx="6" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <path d="M47 415 l8 8 l14 -16" stroke="#5b7f4a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="424" font-size="26" font-weight="700" fill="#22201c">道具</text>
  <text x="250" y="424" font-size="24" fill="#6b655b">はさみの数と保管場所</text>
</svg>
