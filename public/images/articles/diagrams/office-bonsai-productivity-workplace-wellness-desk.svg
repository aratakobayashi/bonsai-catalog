<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>オフィスのデスク周りの置き場所の良い例と避けたい場所</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <!-- window -->
  <rect x="20" y="40" width="150" height="250" fill="#e8eef2" stroke="#1a365d" stroke-width="4"/>
  <line x1="95" y1="40" x2="95" y2="290" stroke="#1a365d" stroke-width="3"/>
  <text x="95" y="326" text-anchor="middle" font-size="24" font-weight="700" fill="#1a365d">窓</text>
  <!-- AC -->
  <rect x="520" y="40" width="200" height="50" rx="10" fill="#fff" stroke="#6b655b" stroke-width="3"/>
  <text x="620" y="74" text-anchor="middle" font-size="22" fill="#6b655b">エアコン</text>
  <g stroke="#6b655b" stroke-width="3" stroke-dasharray="8 8" fill="none"><path d="M560 96 q0 60 -20 110"/><path d="M620 96 q0 60 0 110"/><path d="M680 96 q0 60 20 110"/></g>
  <!-- desk -->
  <rect x="190" y="330" width="590" height="16" fill="#8b6b4a"/>
  <rect x="210" y="346" width="14" height="110" fill="#8b6b4a"/><rect x="746" y="346" width="14" height="110" fill="#8b6b4a"/>
  <!-- PC -->
  <rect x="410" y="210" width="150" height="100" rx="8" fill="#22201c"/><rect x="470" y="310" width="30" height="20" fill="#22201c"/>
  <g stroke="#b8935a" stroke-width="3" stroke-dasharray="6 6"><line x1="566" y1="250" x2="600" y2="250"/><line x1="566" y1="275" x2="600" y2="275"/></g>
  <!-- good plant -->
  <path d="M230 300 h60 l-8 30 h-44 z" fill="#8b6b4a"/><path d="M260 300 q-3 -26 3 -44" stroke="#6f5439" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="263" cy="248" rx="34" ry="20" fill="#5b7f4a"/>
  <circle cx="260" cy="392" r="13" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <text x="282" y="401" font-size="23" font-weight="700" fill="#5b7f4a">窓に近く明るい</text>
  <!-- bad AC -->
  <path d="M650 300 h60 l-8 30 h-44 z" fill="#8b6b4a"/><path d="M680 300 q-3 -26 3 -44" stroke="#6f5439" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="683" cy="248" rx="34" ry="20" fill="#5b7f4a"/>
  <g stroke="#8b6b4a" stroke-width="5" stroke-linecap="round"><line x1="668" y1="380" x2="692" y2="404"/><line x1="692" y1="380" x2="668" y2="404"/></g>
  <text x="660" y="440" text-anchor="middle" font-size="22" fill="#8b6b4a">空調の風・排気</text>
  <text x="300" y="110" font-size="22" fill="#8b6b4a">夏の直射は</text>
  <text x="300" y="140" font-size="22" fill="#8b6b4a">ガラス越しでも</text>
  <text x="300" y="170" font-size="22" fill="#8b6b4a">カーテンで和らげる</text>
  <g stroke="#b8935a" stroke-width="3" stroke-dasharray="8 8"><line x1="175" y1="120" x2="290" y2="160"/></g>
</svg>
