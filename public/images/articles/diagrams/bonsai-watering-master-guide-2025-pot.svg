<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>鉢底から流れるまで与えた鉢と、表面だけ湿らせた鉢の断面</title>
  <rect width="800" height="480" fill="#faf9f6"/>

  <!-- 左：よい例 -->
  <rect x="20" y="20" width="370" height="440" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="58" cy="62" r="20" fill="none" stroke="#5b7f4a" stroke-width="5"/>
  <text x="92" y="72" font-size="28" font-weight="700" fill="#22201c">流れるまで</text>
  <!-- じょうろの水 -->
  <g stroke="#1a365d" stroke-width="4" stroke-linecap="round">
    <line x1="170" y1="100" x2="170" y2="124"/><line x1="205" y1="96" x2="205" y2="124"/><line x1="240" y1="100" x2="240" y2="124"/>
  </g>
  <!-- 鉢 -->
  <path d="M80 140 h250 l-26 170 h-198 z" fill="#8b6b4a"/>
  <path d="M96 150 h218 l-22 150 h-174 z" fill="#5e4630"/>
  <!-- 根（全体） -->
  <g stroke="#f3f0ea" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M205 150 v40"/>
    <path d="M205 170 q-40 20 -70 70"/><path d="M205 175 q40 25 70 70"/>
    <path d="M205 190 q-20 40 -40 100"/><path d="M205 190 q20 45 35 100"/>
    <path d="M150 220 q-20 20 -26 50"/><path d="M262 225 q18 25 22 50"/>
  </g>
  <rect x="150" y="128" width="110" height="22" fill="#5b7f4a" rx="4"/>
  <!-- 鉢底の穴と流れ出る水 -->
  <rect x="190" y="300" width="30" height="10" fill="#faf9f6"/>
  <g fill="#1a365d">
    <path d="M205 322 q-8 12 0 18 q8 -6 0 -18 z"/>
    <path d="M190 350 q-7 10 0 15 q7 -5 0 -15 z"/>
    <path d="M220 350 q-7 10 0 15 q7 -5 0 -15 z"/>
  </g>
  <text x="205" y="408" text-anchor="middle" font-size="24" fill="#22201c">鉢全体が湿る</text>
  <text x="205" y="442" text-anchor="middle" font-size="24" fill="#22201c">根が全体に張る</text>

  <!-- 右：よくない例 -->
  <rect x="410" y="20" width="370" height="440" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <g stroke="#8b6b4a" stroke-width="5" stroke-linecap="round">
    <line x1="434" y1="48" x2="468" y2="82"/><line x1="468" y1="48" x2="434" y2="82"/>
  </g>
  <text x="482" y="72" font-size="28" font-weight="700" fill="#22201c">表面だけ</text>
  <g stroke="#1a365d" stroke-width="4" stroke-linecap="round">
    <line x1="595" y1="104" x2="595" y2="122"/>
  </g>
  <path d="M470 140 h250 l-26 170 h-198 z" fill="#8b6b4a"/>
  <path d="M486 150 h218 l-22 150 h-174 z" fill="#e3d2b4"/>
  <path d="M486 150 h218 l-6 40 h-206 z" fill="#5e4630"/>
  <g stroke="#f3f0ea" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M595 150 v24"/>
    <path d="M595 165 q-50 8 -90 18"/><path d="M595 165 q50 8 90 18"/>
    <path d="M595 172 q-30 10 -55 14"/><path d="M595 172 q30 10 55 14"/>
  </g>
  <rect x="540" y="128" width="110" height="22" fill="#5b7f4a" rx="4"/>
  <rect x="580" y="300" width="30" height="10" fill="#faf9f6"/>
  <text x="595" y="252" text-anchor="middle" font-size="22" fill="#8b6b4a">乾いたまま</text>
  <text x="595" y="408" text-anchor="middle" font-size="24" fill="#22201c">下のほうが乾く</text>
  <text x="595" y="442" text-anchor="middle" font-size="24" fill="#22201c">根が上に偏る</text>
</svg>
