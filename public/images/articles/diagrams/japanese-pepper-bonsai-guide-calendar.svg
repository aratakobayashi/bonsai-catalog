<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 546" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>山椒の盆栽の年間作業カレンダー</title>
  <rect width="800" height="546" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">山椒の一年</text>
  <text x="780" y="44" text-anchor="end" font-size="22" fill="#6b655b">関東の平地の目安</text>
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="186" y="94">1</text><text x="239" y="94">2</text><text x="291" y="94">3</text><text x="344" y="94">4</text><text x="396" y="94">5</text><text x="449" y="94">6</text><text x="501" y="94">7</text><text x="554" y="94">8</text><text x="606" y="94">9</text><text x="659" y="94">10</text><text x="711" y="94">11</text><text x="764" y="94">12</text>
  </g>
  <text x="20" y="94" font-size="22" fill="#6b655b">月</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="108" width="770" height="50" rx="8"/>
    <rect x="20" y="164" width="770" height="50" rx="8"/>
    <rect x="20" y="220" width="770" height="50" rx="8"/>
    <rect x="20" y="276" width="770" height="50" rx="8"/>
    <rect x="20" y="332" width="770" height="50" rx="8"/>
    <rect x="20" y="388" width="770" height="50" rx="8"/>
    <rect x="20" y="444" width="770" height="50" rx="8"/>
  </g>
  <g stroke="#ebe7df" stroke-width="1.5">
    <line x1="160" y1="108" x2="160" y2="494"/><line x1="212.5" y1="108" x2="212.5" y2="494"/><line x1="265" y1="108" x2="265" y2="494"/><line x1="317.5" y1="108" x2="317.5" y2="494"/><line x1="370" y1="108" x2="370" y2="494"/><line x1="422.5" y1="108" x2="422.5" y2="494"/><line x1="475" y1="108" x2="475" y2="494"/><line x1="527.5" y1="108" x2="527.5" y2="494"/><line x1="580" y1="108" x2="580" y2="494"/><line x1="632.5" y1="108" x2="632.5" y2="494"/><line x1="685" y1="108" x2="685" y2="494"/><line x1="737.5" y1="108" x2="737.5" y2="494"/>
  </g>
  <g font-size="24" font-weight="700" fill="#22201c">
    <text x="34" y="141">植え替え</text>
    <text x="34" y="197">木の芽</text>
    <text x="34" y="253">花</text>
    <text x="34" y="309">実</text>
    <text x="34" y="365">剪定</text>
    <text x="34" y="421">肥料</text>
    <text x="34" y="477">幼虫の見回り</text>
  </g>
  <!-- 植え替え -->
  <rect x="249.2" y="119" width="47.2" height="28" rx="6" fill="#8b6b4a"/>
  <!-- 木の芽 -->
  <rect x="265.0" y="175" width="105.0" height="28" rx="6" fill="#5b7f4a"/>
  <!-- 花 -->
  <rect x="317.5" y="231" width="105.0" height="28" rx="6" fill="#b8935a" fill-opacity="0.5"/>
  <!-- 実 -->
  <rect x="370.0" y="287" width="105.0" height="28" rx="6" fill="#5b7f4a" fill-opacity="0.5"/>
  <text x="422" y="309" text-anchor="middle" font-size="22" fill="#5b7f4a">青</text>
  <rect x="580.0" y="287" width="105.0" height="28" rx="6" fill="#b4573a"/>
  <!-- 剪定 -->
  <rect x="711.2" y="343" width="78.8" height="28" rx="6" fill="#1a365d"/>
  <rect x="160.0" y="343" width="105.0" height="28" rx="6" fill="#1a365d"/>
  <!-- 肥料 -->
  <rect x="354.2" y="399" width="120.7" height="28" rx="6" fill="#b8935a"/>
  <rect x="606.2" y="399" width="78.8" height="28" rx="6" fill="#b8935a"/>
  <!-- 幼虫の見回り -->
  <rect x="317.5" y="455" width="367.5" height="28" rx="6" fill="#6b655b" fill-opacity="0.45"/>
  <text x="20" y="532" font-size="22" fill="#6b655b">実：5〜6月は青い実、9〜10月は赤く熟す</text>
</svg>
