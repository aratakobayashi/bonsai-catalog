<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>室内で育てやすい樹と、屋外で育てて数日だけ飾る樹。ガジュマル、ベンジャミンなどのフィカス、シェフレラは室内向き。松、真柏、もみじ、欅、さつき、梅、長寿梅、寒椿は屋外で育て、部屋に飾るのは2〜3日まで</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <rect x="20" y="20" width="370" height="440" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="56" cy="62" r="17" fill="none" stroke="#5b7f4a" stroke-width="5"/>
  <text x="88" y="72" font-size="28" font-weight="700" fill="#22201c">室内で育てやすい</text>
  <circle cx="64" cy="128" r="7" fill="#5b7f4a"/>  <text x="86" y="136" font-size="26" font-weight="700" fill="#22201c">ガジュマル</text>
  <text x="86" y="170" font-size="22" fill="#6b655b">暖かい地域の樹</text>
  <circle cx="64" cy="220" r="7" fill="#5b7f4a"/>  <text x="86" y="228" font-size="26" font-weight="700" fill="#22201c">ベンジャミンなど</text>
  <text x="86" y="262" font-size="22" fill="#6b655b">フィカスの仲間</text>
  <circle cx="64" cy="312" r="7" fill="#5b7f4a"/>  <text x="86" y="320" font-size="26" font-weight="700" fill="#22201c">シェフレラ</text>
  <text x="86" y="354" font-size="22" fill="#6b655b">カポックとも呼ぶ</text>
  <text x="205" y="430" font-size="22" font-weight="700" fill="#5b7f4a" text-anchor="middle">春〜秋は外に出すと丈夫に</text>
  <rect x="410" y="20" width="370" height="440" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="446" cy="62" r="17" fill="#1a365d"/>  <text x="478" y="72" font-size="28" font-weight="700" fill="#22201c">外で育て、数日飾る</text>
  <circle cx="454" cy="128" r="7" fill="#1a365d"/>  <text x="476" y="136" font-size="26" font-weight="700" fill="#22201c">松・真柏</text>
  <circle cx="454" cy="198" r="7" fill="#1a365d"/>  <text x="476" y="206" font-size="26" font-weight="700" fill="#22201c">もみじ・欅</text>
  <circle cx="454" cy="268" r="7" fill="#1a365d"/>  <text x="476" y="276" font-size="26" font-weight="700" fill="#22201c">さつき・梅</text>
  <circle cx="454" cy="338" r="7" fill="#1a365d"/>  <text x="476" y="346" font-size="26" font-weight="700" fill="#22201c">長寿梅・寒椿</text>
  <text x="595" y="430" font-size="22" font-weight="700" fill="#1a365d" text-anchor="middle">部屋に飾るのは2〜3日まで</text>

</svg>
