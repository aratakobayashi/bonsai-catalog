<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>会場で気をつけたい4つのこと</title>
  <rect width="800" height="450" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">会場で気をつけたい4つのこと</text>
  <g>
    <rect x="20" y="72" width="375" height="150" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <!-- hand + tree -->
    <path d="M70 180 h60 l-8 24 h-44 z" fill="#8b6b4a"/>
    <path d="M100 180 v-40" stroke="#6f5439" stroke-width="7"/>
    <ellipse cx="100" cy="128" rx="34" ry="20" fill="#5b7f4a"/>
    <text x="160" y="132" font-size="25" font-weight="700" fill="#22201c">人の樹に触る前に</text>
    <text x="160" y="170" font-size="22" fill="#6b655b">ひと声かける</text>
  </g>
  <g>
    <rect x="405" y="72" width="375" height="150" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="440" y="118" width="80" height="56" rx="8" fill="#1a365d"/>
    <circle cx="480" cy="146" r="17" fill="#faf9f6"/><circle cx="480" cy="146" r="9" fill="#1a365d"/>
    <rect x="452" y="108" width="24" height="12" rx="3" fill="#1a365d"/>
    <text x="545" y="132" font-size="25" font-weight="700" fill="#22201c">写真やSNSは</text>
    <text x="545" y="170" font-size="22" fill="#6b655b">持ち主に確かめる</text>
  </g>
  <g>
    <rect x="20" y="236" width="375" height="150" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <path d="M62 340 l50 -60 M80 340 l32 -60" stroke="#22201c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="62" cy="346" r="12" fill="none" stroke="#b8935a" stroke-width="5"/>
    <circle cx="86" cy="346" r="12" fill="none" stroke="#b8935a" stroke-width="5"/>
    <text x="160" y="296" font-size="25" font-weight="700" fill="#22201c">借りた道具は</text>
    <text x="160" y="334" font-size="22" fill="#6b655b">掃除して元の場所へ</text>
  </g>
  <g>
    <rect x="405" y="236" width="375" height="150" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="440" y="290" width="80" height="50" rx="6" fill="#e3d2b4" stroke="#8b6b4a" stroke-width="2"/>
    <path d="M440 300 h80" stroke="#8b6b4a" stroke-width="2"/>
    <text x="545" y="296" font-size="25" font-weight="700" fill="#22201c">作業のごみは</text>
    <text x="545" y="334" font-size="22" fill="#6b655b">持ち帰るか分別</text>
  </g>
  <text x="400" y="426" text-anchor="middle" font-size="22" fill="#6b655b">分からないことは、その場で聞いてよい</text>
</svg>
