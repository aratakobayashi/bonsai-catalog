<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>南天の剪定：幹の先は切らず、古い幹を根元から間引く</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <line x1="300" y1="380" x2="300" y2="90" stroke="#6f5439" stroke-width="10" stroke-linecap="round"/><g fill="#5b7f4a"><ellipse cx="278" cy="100" rx="16" ry="7" transform="rotate(-20 278 100)"/><ellipse cx="322" cy="100" rx="16" ry="7" transform="rotate(20 322 100)"/></g><g fill="#5b7f4a"><ellipse cx="278" cy="130" rx="16" ry="7" transform="rotate(-20 278 130)"/><ellipse cx="322" cy="130" rx="16" ry="7" transform="rotate(20 322 130)"/></g><g fill="#5b7f4a"><ellipse cx="278" cy="160" rx="16" ry="7" transform="rotate(-20 278 160)"/><ellipse cx="322" cy="160" rx="16" ry="7" transform="rotate(20 322 160)"/></g>
  <line x1="380" y1="380" x2="380" y2="170" stroke="#6f5439" stroke-width="7" stroke-linecap="round"/><g fill="#5b7f4a"><ellipse cx="358" cy="180" rx="16" ry="7" transform="rotate(-20 358 180)"/><ellipse cx="402" cy="180" rx="16" ry="7" transform="rotate(20 402 180)"/></g><g fill="#5b7f4a"><ellipse cx="358" cy="210" rx="16" ry="7" transform="rotate(-20 358 210)"/><ellipse cx="402" cy="210" rx="16" ry="7" transform="rotate(20 402 210)"/></g><g fill="#5b7f4a"><ellipse cx="358" cy="240" rx="16" ry="7" transform="rotate(-20 358 240)"/><ellipse cx="402" cy="240" rx="16" ry="7" transform="rotate(20 402 240)"/></g>
  <line x1="450" y1="380" x2="450" y2="210" stroke="#6f5439" stroke-width="7" stroke-linecap="round"/><g fill="#5b7f4a"><ellipse cx="428" cy="220" rx="16" ry="7" transform="rotate(-20 428 220)"/><ellipse cx="472" cy="220" rx="16" ry="7" transform="rotate(20 472 220)"/></g><g fill="#5b7f4a"><ellipse cx="428" cy="250" rx="16" ry="7" transform="rotate(-20 428 250)"/><ellipse cx="472" cy="250" rx="16" ry="7" transform="rotate(20 472 250)"/></g><g fill="#5b7f4a"><ellipse cx="428" cy="280" rx="16" ry="7" transform="rotate(-20 428 280)"/><ellipse cx="472" cy="280" rx="16" ry="7" transform="rotate(20 472 280)"/></g>
  <line x1="520" y1="380" x2="520" y2="150" stroke="#6f5439" stroke-width="7" stroke-linecap="round"/><g fill="#5b7f4a"><ellipse cx="498" cy="160" rx="16" ry="7" transform="rotate(-20 498 160)"/><ellipse cx="542" cy="160" rx="16" ry="7" transform="rotate(20 542 160)"/></g><g fill="#5b7f4a"><ellipse cx="498" cy="190" rx="16" ry="7" transform="rotate(-20 498 190)"/><ellipse cx="542" cy="190" rx="16" ry="7" transform="rotate(20 542 190)"/></g><g fill="#5b7f4a"><ellipse cx="498" cy="220" rx="16" ry="7" transform="rotate(-20 498 220)"/><ellipse cx="542" cy="220" rx="16" ry="7" transform="rotate(20 542 220)"/></g>
  <!-- 花のもと -->
  <g fill="#b8935a"><circle cx="380" cy="160" r="9"/><circle cx="450" cy="200" r="9"/><circle cx="520" cy="140" r="9"/><circle cx="300" cy="80" r="9"/></g>
  <path d="M250 380 h330 l-14 50 h-302 z" fill="#8b6b4a"/>
  <!-- 根元で切る -->
  <line x1="268" y1="344" x2="332" y2="326" stroke="#1a365d" stroke-width="5" stroke-dasharray="10 7"/>
  <text x="44" y="320" font-size="24" font-weight="700" fill="#1a365d">古い幹は</text>
  <text x="44" y="352" font-size="24" font-weight="700" fill="#1a365d">根元で切る</text>
  <!-- 先端は切らない -->
  <text x="560" y="96" font-size="24" font-weight="700" fill="#8b6b4a">幹の先に</text>
  <text x="560" y="128" font-size="24" font-weight="700" fill="#8b6b4a">花のもと</text>
  <text x="560" y="160" font-size="22" fill="#8b6b4a">→ 切らない</text>
  <text x="660" y="300" text-anchor="middle" font-size="22" fill="#5b7f4a">若い幹を</text>
  <text x="660" y="330" text-anchor="middle" font-size="22" fill="#5b7f4a">育てる</text>
</svg>
