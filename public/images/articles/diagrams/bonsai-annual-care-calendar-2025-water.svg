<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>季節ごとの水やりの回数の目安</title>
  <rect width="800" height="440" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">水やりの回数の目安</text>
  <g>
    <rect x="20" y="74" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <text x="109" y="118" text-anchor="middle" font-size="26" font-weight="700" fill="#5b7f4a">春</text>
    <text x="109" y="150" text-anchor="middle" font-size="22" fill="#6b655b">3〜5月</text>
    <circle cx="109" cy="214" r="26" fill="#1a365d"/>
    <text x="109" y="290" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">1日1回</text>
    <text x="109" y="324" text-anchor="middle" font-size="22" fill="#22201c">乾いたら</text>
  </g>
  <g>
    <rect x="214" y="74" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <text x="303" y="118" text-anchor="middle" font-size="26" font-weight="700" fill="#b4573a">夏</text>
    <text x="303" y="150" text-anchor="middle" font-size="22" fill="#6b655b">6〜8月</text>
    <circle cx="273" cy="214" r="26" fill="#1a365d"/><circle cx="333" cy="214" r="26" fill="#1a365d"/>
    <text x="303" y="290" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">1日1〜2回</text>
    <text x="303" y="324" text-anchor="middle" font-size="22" fill="#22201c">朝と夕方</text>
  </g>
  <g>
    <rect x="408" y="74" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <text x="497" y="118" text-anchor="middle" font-size="26" font-weight="700" fill="#b8935a">秋</text>
    <text x="497" y="150" text-anchor="middle" font-size="22" fill="#6b655b">9〜11月</text>
    <circle cx="497" cy="214" r="26" fill="#1a365d"/>
    <text x="497" y="290" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">1日1回</text>
    <text x="497" y="324" text-anchor="middle" font-size="22" fill="#22201c">少しずつ減る</text>
  </g>
  <g>
    <rect x="602" y="74" width="178" height="270" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <text x="691" y="118" text-anchor="middle" font-size="26" font-weight="700" fill="#1a365d">冬</text>
    <text x="691" y="150" text-anchor="middle" font-size="22" fill="#6b655b">12〜2月</text>
    <circle cx="691" cy="214" r="26" fill="#1a365d" fill-opacity="0.35"/>
    <text x="691" y="290" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">2〜4日に1回</text>
    <text x="691" y="324" text-anchor="middle" font-size="22" fill="#22201c">乾いたら午前に</text>
  </g>
  <rect x="20" y="362" width="760" height="62" rx="14" fill="#1a365d"/>
  <text x="400" y="402" text-anchor="middle" font-size="25" font-weight="700" fill="#faf9f6">回数より「乾いたら与える」が基本</text>
</svg>
