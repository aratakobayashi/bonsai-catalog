<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>赤星病の病原菌は、春はビャクシンの仲間からハナカイドウへ、夏から秋はハナカイドウからビャクシンの仲間へ移る。同じ棚に並べず離して置く</title>
  <rect width="800" height="488" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">赤星病：ビャクシンの仲間と離して置く</text>
  <rect x="20" y="68" width="760" height="400" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="104.0" y="314" width="132.0" height="9" rx="3" fill="#8b6b4a"/>
  <path d="M110.0 320 L230.0 320 L216.8 350.0 L123.19999999999999 350.0 Z" fill="#8b6b4a"/>
  <path d="M170 320 C164.0 280.0 188.0 260.0 174.0 220.0" stroke="#6f5439" stroke-width="9.0" fill="none" stroke-linecap="round"/>
  <ellipse cx="140.0" cy="225.0" rx="42.0" ry="26.0" fill="#5b7f4a"/>
  <ellipse cx="204.0" cy="210.0" rx="40.0" ry="24.0" fill="#5b7f4a"/>
  <ellipse cx="174.0" cy="185.0" rx="44.0" ry="26.0" fill="#5b7f4a"/>
  <circle cx="140" cy="200" r="7" fill="#d9822b"/>
  <circle cx="200" cy="186" r="7" fill="#d9822b"/>
  <circle cx="170" cy="222" r="7" fill="#d9822b"/>
  <text x="170" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#22201c">ハナカイドウ</text>
  <text x="170" y="414" text-anchor="middle" font-size="22" fill="#d9822b">葉に橙色の斑点</text>
  <rect x="564.0" y="314" width="132.0" height="9" rx="3" fill="#8b6b4a"/>
  <path d="M570.0 320 L690.0 320 L676.8 350.0 L583.2 350.0 Z" fill="#8b6b4a"/>
  <path d="M630 320 C624.0 280.0 648.0 260.0 634.0 220.0" stroke="#6f5439" stroke-width="9.0" fill="none" stroke-linecap="round"/>
  <ellipse cx="600.0" cy="225.0" rx="42.0" ry="26.0" fill="#4f7a46"/>
  <ellipse cx="664.0" cy="210.0" rx="40.0" ry="24.0" fill="#4f7a46"/>
  <ellipse cx="634.0" cy="185.0" rx="44.0" ry="26.0" fill="#4f7a46"/>
  <text x="630" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#22201c">真柏などの</text>
  <text x="630" y="414" text-anchor="middle" font-size="22" fill="#6b655b">ビャクシンの仲間</text>
  <path d="M300 170 L500 170" stroke="#d9822b" stroke-width="4"/>
  <path d="M500 160 L520 170 L500 180 Z" fill="#d9822b"/>
  <path d="M500 230 L300 230" stroke="#d9822b" stroke-width="4"/>
  <path d="M300 220 L280 230 L300 240 Z" fill="#d9822b"/>
  <text x="400" y="150" text-anchor="middle" font-size="22" fill="#6b655b">夏〜秋</text>
  <text x="400" y="272" text-anchor="middle" font-size="22" fill="#6b655b">春</text>
  <text x="400" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#d9822b">病原菌が行き来する</text>
  <text x="400" y="340" text-anchor="middle" font-size="24" font-weight="700" fill="#1a365d">同じ棚に並べない</text>
</svg>
