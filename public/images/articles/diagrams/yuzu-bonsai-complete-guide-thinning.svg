<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>柚子の摘果：小さな鉢では実の数を絞り、樹の負担を減らす</title>
  <rect width="800" height="460" fill="#faf9f6"/>

  <!-- 左：つけすぎ -->
  <rect x="20" y="20" width="370" height="420" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="205" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="#b4573a">× 実をつけすぎ</text>
  <ellipse cx="205" cy="190" rx="130" ry="80" fill="#5b7f4a"/>
  <path d="M200 340 C 196 300, 212 270, 204 240" stroke="#6f5439" stroke-width="10" fill="none"/>
  <g fill="#9cbc7a">
    <circle cx="120" cy="170" r="14"/><circle cx="160" cy="140" r="14"/><circle cx="210" cy="130" r="14"/><circle cx="260" cy="146" r="14"/>
    <circle cx="300" cy="180" r="14"/><circle cx="140" cy="210" r="14"/><circle cx="190" cy="200" r="14"/><circle cx="240" cy="210" r="14"/>
    <circle cx="280" cy="230" r="14"/><circle cx="170" cy="240" r="14"/>
  </g>
  <path d="M130 340 h150 l-12 34 h-126 z" fill="#8b6b4a"/>
  <text x="205" y="410" text-anchor="middle" font-size="22" fill="#22201c">実が小さく、翌年は実が少ない</text>

  <!-- 右：絞る -->
  <rect x="410" y="20" width="370" height="420" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <text x="595" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="#5b7f4a">○ 数を絞る</text>
  <ellipse cx="595" cy="190" rx="130" ry="80" fill="#5b7f4a"/>
  <path d="M590 340 C 586 300, 602 270, 594 240" stroke="#6f5439" stroke-width="10" fill="none"/>
  <g fill="#9cbc7a"><circle cx="530" cy="160" r="20"/><circle cx="660" cy="200" r="20"/><circle cx="590" cy="236" r="20"/></g>
  <path d="M520 340 h150 l-12 34 h-126 z" fill="#8b6b4a"/>
  <text x="595" y="410" text-anchor="middle" font-size="22" fill="#22201c">形のよい実を数個残す</text>
</svg>
