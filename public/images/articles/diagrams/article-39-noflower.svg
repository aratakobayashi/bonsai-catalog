<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>桜の盆栽の花が咲かないときに見直す4つの点</title>
  <rect width="800" height="400" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">花が咲かないときの見直し</text>
  <rect x="20" y="68" width="178" height="312" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="109" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#22201c">冬に室内</text>
  <path d="M95 146 L123 174 M123 146 L95 174" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <text x="109" y="224" text-anchor="middle" font-size="21" fill="#6b655b">寒さが足りず</text>
  <text x="109" y="258" text-anchor="middle" font-size="21" fill="#6b655b">花芽が目覚めない</text>
  <line x1="40" y1="300" x2="178" y2="300" stroke="#ebe7df" stroke-width="2"/>
  <text x="109" y="346" text-anchor="middle" font-size="21" font-weight="700" fill="#1a365d">冬は屋外に</text>
  <rect x="214" y="68" width="178" height="312" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="303" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#22201c">夏の水切れ</text>
  <path d="M289 146 L317 174 M317 146 L289 174" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <text x="303" y="224" text-anchor="middle" font-size="21" fill="#6b655b">葉が傷むと</text>
  <text x="303" y="258" text-anchor="middle" font-size="21" fill="#6b655b">花芽が育たない</text>
  <line x1="234" y1="300" x2="372" y2="300" stroke="#ebe7df" stroke-width="2"/>
  <text x="303" y="346" text-anchor="middle" font-size="21" font-weight="700" fill="#1a365d">夏は朝夕に確認</text>
  <rect x="408" y="68" width="178" height="312" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="497" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#22201c">秋冬に剪定</text>
  <path d="M483 146 L511 174 M511 146 L483 174" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <text x="497" y="224" text-anchor="middle" font-size="21" fill="#6b655b">できた花芽を</text>
  <text x="497" y="258" text-anchor="middle" font-size="21" fill="#6b655b">切り落とした</text>
  <line x1="428" y1="300" x2="566" y2="300" stroke="#ebe7df" stroke-width="2"/>
  <text x="497" y="346" text-anchor="middle" font-size="21" font-weight="700" fill="#1a365d">剪定は花後に</text>
  <rect x="602" y="68" width="178" height="312" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="691" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#22201c">日陰・肥料過多</text>
  <path d="M677 146 L705 174 M705 146 L677 174" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <text x="691" y="224" text-anchor="middle" font-size="21" fill="#6b655b">枝ばかり伸びて</text>
  <text x="691" y="258" text-anchor="middle" font-size="21" fill="#6b655b">花芽が少ない</text>
  <line x1="622" y1="300" x2="760" y2="300" stroke="#ebe7df" stroke-width="2"/>
  <text x="691" y="346" text-anchor="middle" font-size="21" font-weight="700" fill="#1a365d">日なたに置く</text>
</svg>
