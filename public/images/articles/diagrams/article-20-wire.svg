<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>針金かけの基本。枝に約45度の角度で等間隔に巻き、針金の太さは枝の約3分の1。食い込む前に外す</title>
  <rect width="800" height="474" fill="#faf9f6"/>
  <text x="400" y="48" font-size="30" font-weight="700" fill="#1a365d" text-anchor="middle">針金かけの基本</text>
  <rect x="20" y="76" width="760" height="300" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <path d="M80 320 q200 -40 340 -120 q120 -70 300 -80" stroke="#6f5439" stroke-width="26" fill="none" stroke-linecap="round"/>
  <g stroke="#b8935a" stroke-width="6" stroke-linecap="round"><line x1="110" y1="318" x2="134" y2="282"/><line x1="147" y1="311" x2="171" y2="275"/><line x1="184" y1="304" x2="208" y2="268"/><line x1="221" y1="296" x2="245" y2="260"/><line x1="259" y1="287" x2="283" y2="251"/><line x1="296" y1="277" x2="320" y2="241"/><line x1="333" y1="266" x2="357" y2="230"/><line x1="370" y1="253" x2="394" y2="217"/><line x1="407" y1="239" x2="431" y2="203"/><line x1="444" y1="223" x2="468" y2="187"/><line x1="481" y1="206" x2="505" y2="170"/><line x1="519" y1="187" x2="543" y2="151"/><line x1="556" y1="168" x2="580" y2="132"/><line x1="593" y1="148" x2="617" y2="112"/><line x1="630" y1="128" x2="654" y2="92"/></g>
  <text x="110" y="150" font-size="24" font-weight="700" fill="#22201c">約45°の角度で</text>
  <text x="110" y="182" font-size="24" font-weight="700" fill="#22201c">等間隔に巻く</text>
  <text x="470" y="300" font-size="24" font-weight="700" fill="#22201c">針金の太さは</text>
  <text x="470" y="332" font-size="24" font-weight="700" fill="#22201c">枝の約3分の1</text>
  <rect x="20" y="392" width="760" height="62" rx="14" fill="#1a365d"/>
  <text x="400" y="432.0" font-size="25" font-weight="700" fill="#faf9f6" text-anchor="middle">食い込む前に外す（夏〜秋はこまめに確認）</text>

</svg>
