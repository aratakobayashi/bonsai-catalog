<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の体験教室の主な種類</title>
  <rect width="800" height="510" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">体験教室の主な種類</text>
  <rect x="24" y="80" width="370" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="24" y="80" width="10" height="170" rx="4" fill="#5b7f4a"/>
  <text x="54" y="130" font-size="26" font-weight="700" fill="#2c2a26">ミニ盆栽の植え付け</text>
  <text x="54" y="178" font-size="22" fill="#2c2a26">小さな苗を鉢に植える</text>
  <text x="54" y="218" font-size="22" fill="#5b7f4a">持ち帰りできることが多い</text>
  <rect x="406" y="80" width="370" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="406" y="80" width="10" height="170" rx="4" fill="#b8935a"/>
  <text x="436" y="130" font-size="26" font-weight="700" fill="#2c2a26">苔玉・寄せ植え</text>
  <text x="436" y="178" font-size="22" fill="#2c2a26">土を丸めて苔で包む</text>
  <text x="436" y="218" font-size="22" fill="#5b7f4a">室内に少し飾りやすい</text>
  <rect x="24" y="266" width="370" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="24" y="266" width="10" height="170" rx="4" fill="#4f86b5"/>
  <text x="54" y="316" font-size="26" font-weight="700" fill="#2c2a26">手入れの体験</text>
  <text x="54" y="364" font-size="22" fill="#2c2a26">剪定や針金かけを教わる</text>
  <text x="54" y="404" font-size="22" fill="#5b7f4a">経験者にも向く</text>
  <rect x="406" y="266" width="370" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="406" y="266" width="10" height="170" rx="4" fill="#8b6b4a"/>
  <text x="436" y="316" font-size="26" font-weight="700" fill="#2c2a26">連続の講座</text>
  <text x="436" y="364" font-size="22" fill="#2c2a26">数回に分けて基礎から</text>
  <text x="436" y="404" font-size="22" fill="#5b7f4a">年間の作業が分かる</text>
<text x="776" y="494" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
