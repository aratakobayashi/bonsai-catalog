<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>樹種ごとに必要な光の量の目安。松柏類や花もの・実ものは日なた、もみじ・さつき・椿は半日陰でも育ち、苔やシダは明るい日陰向き</title>
  <rect width="800" height="466" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">樹種と光の量の目安</text>
  <rect x="20" y="70" width="244" height="300" rx="14" fill="#fff" stroke="#b8935a" stroke-width="3"/>
  <rect x="20" y="70" width="244" height="54" rx="14" fill="#b8935a"/><rect x="20" y="104" width="244" height="20" fill="#b8935a"/>
  <text x="142" y="106" font-size="24" font-weight="700" text-anchor="middle" fill="#fff">日なたが必要</text>
  <text x="142" y="176" font-size="24" text-anchor="middle" fill="#22201c">黒松・赤松</text>
  <text x="142" y="228" font-size="24" text-anchor="middle" fill="#22201c">五葉松・真柏</text>
  <text x="142" y="280" font-size="24" text-anchor="middle" fill="#22201c">梅・桜</text>
  <text x="142" y="332" font-size="24" text-anchor="middle" fill="#22201c">実もの全般</text>
  <rect x="278" y="70" width="244" height="300" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <rect x="278" y="70" width="244" height="54" rx="14" fill="#5b7f4a"/><rect x="278" y="104" width="244" height="20" fill="#5b7f4a"/>
  <text x="400" y="106" font-size="24" font-weight="700" text-anchor="middle" fill="#fff">半日陰でも育つ</text>
  <text x="400" y="176" font-size="24" text-anchor="middle" fill="#22201c">もみじ・楓</text>
  <text x="400" y="228" font-size="24" text-anchor="middle" fill="#22201c">さつき・つつじ</text>
  <text x="400" y="280" font-size="24" text-anchor="middle" fill="#22201c">椿・南天</text>
  <text x="400" y="332" font-size="24" text-anchor="middle" fill="#22201c">姫しゃら</text>
  <rect x="536" y="70" width="244" height="300" rx="14" fill="#fff" stroke="#1a365d" stroke-width="3"/>
  <rect x="536" y="70" width="244" height="54" rx="14" fill="#1a365d"/><rect x="536" y="104" width="244" height="20" fill="#1a365d"/>
  <text x="658" y="106" font-size="24" font-weight="700" text-anchor="middle" fill="#fff">明るい日陰向き</text>
  <text x="658" y="176" font-size="24" text-anchor="middle" fill="#22201c">苔</text>
  <text x="658" y="228" font-size="24" text-anchor="middle" fill="#22201c">シダ類</text>
  <text x="658" y="280" font-size="24" text-anchor="middle" fill="#22201c">山野草の一部</text>
  <text x="658" y="332" font-size="24" text-anchor="middle" fill="#22201c">石付きの下草</text>
  <path d="M40 404 H760" stroke="#6b655b" stroke-width="3"/><path d="M40 404 l14 -9 v18 z M760 404 l-14 -9 v18 z" fill="#6b655b"/>
  <text x="40" y="444" font-size="22" fill="#6b655b">光が多く必要</text>
  <text x="760" y="444" font-size="22" text-anchor="end" fill="#6b655b">少ない光でも保つ</text>
</svg>
