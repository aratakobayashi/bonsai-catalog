<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>山野草の寄せ植えの組み立て：主役・添え・足元の三つの高さ</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1a365d">寄せ植えは「高・中・低」の三つで組む</text>

  <!-- 鉢 -->
  <path d="M120 350 h560 l-30 56 h-500 z" fill="#8b6b4a"/>
  <rect x="112" y="340" width="576" height="16" rx="5" fill="#6f5439"/>
  <!-- 土の盛り -->
  <path d="M130 342 C 220 300, 360 296, 470 318 C 560 334, 620 336, 670 342 Z" fill="#e3d2b4"/>
  <!-- 石 -->
  <path d="M420 330 C 430 300, 470 296, 490 318 C 494 330, 470 338, 440 338 Z" fill="#9b958a"/>

  <!-- 主役（背の高い草） -->
  <g stroke="#5b7f4a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M250 320 C 246 260, 236 200, 222 130"/><path d="M256 320 C 262 260, 276 196, 292 140"/>
    <path d="M252 320 C 252 250, 254 190, 256 110"/><path d="M248 320 C 230 280, 206 240, 186 210"/>
    <path d="M258 320 C 280 286, 300 260, 322 240"/>
  </g>
  <g fill="#c77d92"><circle cx="256" cy="106" r="10"/><circle cx="222" cy="126" r="9"/><circle cx="292" cy="136" r="9"/></g>
  <!-- 添え（中くらいの草） -->
  <g fill="#5b7f4a">
    <ellipse cx="370" cy="300" rx="34" ry="14" transform="rotate(-20 370 300)"/>
    <ellipse cx="400" cy="296" rx="30" ry="12" transform="rotate(25 400 296)"/>
    <ellipse cx="384" cy="282" rx="26" ry="11" transform="rotate(-70 384 282)"/>
  </g>
  <g fill="#faf9f6" stroke="#b8935a" stroke-width="2"><circle cx="390" cy="258" r="8"/></g>
  <!-- 足元（苔・低い草） -->
  <g fill="#7d9a68">
    <ellipse cx="170" cy="338" rx="40" ry="10"/><ellipse cx="320" cy="330" rx="46" ry="10"/>
    <ellipse cx="560" cy="334" rx="80" ry="10"/><ellipse cx="640" cy="338" rx="30" ry="8"/>
  </g>

  <!-- ラベル -->
  <g font-size="22">
    <line x1="300" y1="110" x2="520" y2="110" stroke="#ebe7df" stroke-width="2"/>
    <text x="530" y="104" font-weight="700" fill="#22201c" font-size="24">高：主役</text>
    <text x="530" y="134" fill="#6b655b">花や葉に季節が出る草</text>
    <line x1="416" y1="270" x2="520" y2="200" stroke="#ebe7df" stroke-width="2"/>
    <text x="530" y="196" font-weight="700" fill="#22201c" font-size="24">中：添え</text>
    <text x="530" y="226" fill="#6b655b">葉の形が違う草</text>
    <line x1="560" y1="326" x2="600" y2="282" stroke="#ebe7df" stroke-width="2"/>
    <text x="530" y="278" font-weight="700" fill="#22201c" font-size="24">低：足元</text>
    <text x="40" y="450" fill="#6b655b">主役は中心からずらし、低い草と苔で土を覆います</text>
  </g>
</svg>
