<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>梅の盆栽を花の時期に室内へ飾るときの注意。明るい窓辺に置き、暖房の風は避け、飾るのは2〜3日、夜は涼しい場所へ移す</title>
  <rect width="800" height="420" fill="#faf7f0"/>
  <text x="24" y="44" font-size="30" font-weight="700" fill="#2c2a26">花の時期に室内へ飾るとき</text>
  <rect x="20" y="68" width="178" height="290" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <circle cx="109" cy="120" r="15" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <text x="109" y="186" text-anchor="middle" font-size="23" font-weight="700" fill="#2c2a26">明るい窓辺</text>
  <text x="109" y="240" text-anchor="middle" font-size="21" fill="#6b655b">カーテン越しの</text>
  <text x="109" y="274" text-anchor="middle" font-size="21" fill="#6b655b">やわらかい光</text>
  <rect x="214" y="68" width="178" height="290" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <path d="M289 106 L317 134 M317 106 L289 134" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <text x="303" y="186" text-anchor="middle" font-size="23" font-weight="700" fill="#2c2a26">暖房の風</text>
  <text x="303" y="240" text-anchor="middle" font-size="21" fill="#6b655b">花が早く散り</text>
  <text x="303" y="274" text-anchor="middle" font-size="21" fill="#6b655b">枝が乾く</text>
  <rect x="408" y="68" width="178" height="290" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <circle cx="497" cy="120" r="15" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <text x="497" y="186" text-anchor="middle" font-size="23" font-weight="700" fill="#2c2a26">飾るのは数日</text>
  <text x="497" y="240" text-anchor="middle" font-size="21" fill="#6b655b">2〜3日を目安に</text>
  <text x="497" y="274" text-anchor="middle" font-size="21" fill="#6b655b">屋外へ戻す</text>
  <rect x="602" y="68" width="178" height="290" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <circle cx="691" cy="120" r="15" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <text x="691" y="186" text-anchor="middle" font-size="23" font-weight="700" fill="#2c2a26">夜は涼しく</text>
  <text x="691" y="240" text-anchor="middle" font-size="21" fill="#6b655b">玄関や無暖房の</text>
  <text x="691" y="274" text-anchor="middle" font-size="21" fill="#6b655b">部屋へ移す</text>
<text x="776" y="404" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
