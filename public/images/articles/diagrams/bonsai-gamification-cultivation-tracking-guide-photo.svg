<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>成長を比べるための写真の撮り方。同じ位置・同じ高さ・無地の背景・鉢の正面に印</title>
  <rect width="800" height="570" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">比べやすい写真の撮り方</text>
  <rect x="430" y="76" width="320" height="300" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="590" y="116" text-anchor="middle" font-size="24" font-weight="700" fill="#2c2a26">無地の背景</text>
  <rect x="470" y="330" width="240" height="16" fill="#6f5439"/>
  <rect x="380" y="346" width="420" height="10" fill="#d9d1c3"/>
  <path d="M532.2 298.5 h115.5 l-8.4 31.5 h-98.7 z" fill="#b8935a"/>
  <path d="M583.7 298.5 C579.5 256.5 611.0 235.5 592.1 193.5 L602.6 193.5 C623.6 235.5 596.3 256.5 600.5 298.5 z" fill="#6f5439"/>
  <ellipse cx="550.1" cy="216.6" rx="42.0" ry="18.9" fill="#5b7f4a"/>
  <ellipse cx="632.0" cy="193.5" rx="37.8" ry="16.8" fill="#5b7f4a"/>
  <ellipse cx="594.2" cy="164.1" rx="35.7" ry="18.9" fill="#5b7f4a"/>
  <path d="M582 338 l8 -12 l8 12 z" fill="#b8935a"/>
  <text x="590" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">鉢に正面の印</text>
  <rect x="96" y="196" width="104" height="66" rx="10" fill="#a07a42"/>
  <rect x="124" y="184" width="40" height="16" rx="4" fill="#a07a42"/>
  <circle cx="160" cy="229" r="20" fill="#faf7f0"/><circle cx="160" cy="229" r="11" fill="#b8935a"/>
  <path d="M148 262 L110 380 M148 262 L148 380 M148 262 L186 380" stroke="#6b655b" stroke-width="5" stroke-linecap="round"/>
  <path d="M206 229 L440 250" stroke="#b8935a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="148" y="170" text-anchor="middle" font-size="24" font-weight="700" fill="#2c2a26">同じ高さ</text>
  <path d="M88 392 h120" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/>
  <text x="148" y="428" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">床に立ち位置の印</text>
  <rect x="30" y="450" width="740" height="60" rx="14" fill="#a07a42"/>
  <text x="400" y="489" text-anchor="middle" font-size="24" font-weight="700" fill="#faf7f0">同じ条件で撮ると、変化が比べやすい</text>
<text x="776" y="554" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
