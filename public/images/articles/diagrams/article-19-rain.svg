<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>雨の日に葉が傘になり、鉢の土が乾いたままになる様子</title>
  <rect width="800" height="520" fill="#faf9f6"/>
  <text x="400" y="48" font-size="30" font-weight="700" fill="#1a365d" text-anchor="middle">雨の日でも鉢の土は乾くことがある</text>
  <g stroke="#1a365d" stroke-width="3" stroke-linecap="round" opacity="0.6"><line x1="70" y1="80" x2="60" y2="112"/><line x1="120" y1="92" x2="110" y2="124"/><line x1="170" y1="104" x2="160" y2="136"/><line x1="220" y1="80" x2="210" y2="112"/><line x1="270" y1="92" x2="260" y2="124"/><line x1="320" y1="104" x2="310" y2="136"/><line x1="370" y1="80" x2="360" y2="112"/><line x1="420" y1="92" x2="410" y2="124"/><line x1="470" y1="104" x2="460" y2="136"/><line x1="520" y1="80" x2="510" y2="112"/><line x1="570" y1="92" x2="560" y2="124"/></g>
  <ellipse cx="400" cy="190" rx="230" ry="62" fill="#5b7f4a"/>
  <path d="M400 340 q-8 -60 4 -120" stroke="#6f5439" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M270.0 338 h260 l-26.0 70 h-208.0 z" fill="#8b6b4a"/>
  <path d="M284 344 h232 l-6 22 h-220 z" fill="#e3d2b4"/>
  <rect x="90" y="408" width="620" height="10" rx="4" fill="#ebe7df"/>
  <text x="640" y="128" font-size="24" font-weight="700" fill="#5b7f4a">葉が傘になる</text>
  <text x="540" y="372" font-size="24" font-weight="700" fill="#8b6b4a">← 鉢の土は乾いたまま</text>
  <rect x="20" y="436" width="760" height="62" rx="14" fill="#1a365d"/>
  <text x="400" y="476.36" font-size="26" font-weight="700" fill="#faf9f6" text-anchor="middle">雨の翌朝も、土の色を見て確かめる</text>

</svg>
