<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 438" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>紅葉のための夏から冬の管理。7〜9月中旬は午後の日差しを避けて葉を守る、9月中旬からは日によく当てる、肥料は9月中旬〜10月で終える、紅葉の見頃は11月中旬〜12月上旬、落葉後の12〜2月に剪定</title>
  <rect width="800" height="438" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">紅葉までの管理</text>
  <text x="780" y="44" text-anchor="end" font-size="22" fill="#6b655b">関東の平地の目安</text>
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="186" y="94">1</text><text x="239" y="94">2</text><text x="291" y="94">3</text><text x="344" y="94">4</text><text x="396" y="94">5</text><text x="449" y="94">6</text><text x="501" y="94">7</text><text x="554" y="94">8</text><text x="606" y="94">9</text><text x="659" y="94">10</text><text x="711" y="94">11</text><text x="764" y="94">12</text>
  </g>
  <text x="20" y="94" font-size="22" fill="#6b655b">月</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="108" width="770" height="50" rx="8"/>
    <rect x="20" y="164" width="770" height="50" rx="8"/>
    <rect x="20" y="220" width="770" height="50" rx="8"/>
    <rect x="20" y="276" width="770" height="50" rx="8"/>
    <rect x="20" y="332" width="770" height="50" rx="8"/>
  </g>
  <g stroke="#ebe7df" stroke-width="1.5">
    <line x1="160.0" y1="108" x2="160.0" y2="382"/>
    <line x1="212.5" y1="108" x2="212.5" y2="382"/>
    <line x1="265.0" y1="108" x2="265.0" y2="382"/>
    <line x1="317.5" y1="108" x2="317.5" y2="382"/>
    <line x1="370.0" y1="108" x2="370.0" y2="382"/>
    <line x1="422.5" y1="108" x2="422.5" y2="382"/>
    <line x1="475.0" y1="108" x2="475.0" y2="382"/>
    <line x1="527.5" y1="108" x2="527.5" y2="382"/>
    <line x1="580.0" y1="108" x2="580.0" y2="382"/>
    <line x1="632.5" y1="108" x2="632.5" y2="382"/>
    <line x1="685.0" y1="108" x2="685.0" y2="382"/>
    <line x1="737.5" y1="108" x2="737.5" y2="382"/>
  </g>
  <text x="32" y="141" font-size="24" font-weight="700" fill="#22201c">葉を守る</text>
  <rect x="475.0" y="119" width="131.2" height="28" rx="6" fill="#6b655b"/>
  <text x="32" y="197" font-size="24" font-weight="700" fill="#22201c">日に当てる</text>
  <rect x="291.2" y="175" width="157.5" height="28" rx="6" fill="#5b7f4a" fill-opacity="0.35"/>
  <rect x="606.2" y="175" width="131.2" height="28" rx="6" fill="#5b7f4a"/>
  <text x="32" y="253" font-size="24" font-weight="700" fill="#22201c">肥料</text>
  <rect x="349.0" y="231" width="99.8" height="28" rx="6" fill="#b8935a" fill-opacity="0.35"/>
  <rect x="606.2" y="231" width="78.8" height="28" rx="6" fill="#b8935a"/>
  <text x="32" y="309" font-size="24" font-weight="700" fill="#22201c">紅葉</text>
  <rect x="711.2" y="287" width="47.3" height="28" rx="6" fill="#b4573a"/>
  <text x="32" y="365" font-size="24" font-weight="700" fill="#22201c">剪定</text>
  <rect x="160.0" y="343" width="105.0" height="28" rx="6" fill="#1a365d"/>
  <rect x="753.2" y="343" width="36.7" height="28" rx="6" fill="#1a365d"/>
  <text x="20" y="424" font-size="22" fill="#6b655b">葉を守る：午後は日陰に　薄い色：春の管理（参考）</text>
</svg>
