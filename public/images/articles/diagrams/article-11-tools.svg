<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>最初にそろえる道具と、あとでよい道具</title>
  <rect width="800" height="430" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">最初の道具は3つで十分</text>
  <rect x="20" y="70" width="470" height="340" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <rect x="510" y="70" width="270" height="340" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="255" y="110" text-anchor="middle" font-size="25" font-weight="700" fill="#5b7f4a">最初にそろえる</text>
  <text x="645" y="110" text-anchor="middle" font-size="25" font-weight="700" fill="#6b655b">あとでよい</text>
  <!-- はさみ -->
  <g stroke="#22201c" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="80" cy="250" r="14"/><circle cx="112" cy="250" r="14"/>
    <line x1="86" y1="237" x2="130" y2="160"/><line x1="106" y1="237" x2="62" y2="160"/>
  </g>
  <!-- じょうろ -->
  <path d="M200 190 h70 v70 h-70 z" fill="#1a365d"/>
  <path d="M270 200 l40 -30" stroke="#1a365d" stroke-width="8" stroke-linecap="round"/>
  <rect x="304" y="160" width="20" height="14" rx="4" fill="#1a365d"/>
  <path d="M200 205 q-24 10 0 40" fill="none" stroke="#1a365d" stroke-width="6"/>
  <!-- ピンセット -->
  <g stroke="#6b655b" stroke-width="5" stroke-linecap="round">
    <line x1="400" y1="160" x2="420" y2="260"/><line x1="440" y1="160" x2="420" y2="260"/>
  </g>
  <g font-size="23" fill="#22201c" text-anchor="middle">
    <text x="96" y="310">盆栽ばさみ</text>
    <text x="255" y="310">ハス口じょうろ</text>
    <text x="420" y="310">ピンセット</text>
  </g>
  <text x="255" y="370" text-anchor="middle" font-size="22" fill="#6b655b">枝を切る・水やり・芽や虫を取る</text>
  <g font-size="23" fill="#22201c">
    <text x="540" y="170">針金とペンチ</text>
    <text x="540" y="220">又枝切り</text>
    <text x="540" y="270">用土・鉢底網</text>
    <text x="540" y="320">回転台</text>
  </g>
  <text x="645" y="370" text-anchor="middle" font-size="22" fill="#6b655b">作業を始める時に</text>
</svg>
