  <ellipse cx="251" cy="310" rx="10" ry="5" fill="#5b7f4a" transform="rotate(-40 251 310)"/>
  <ellipse cx="251" cy="330" rx="10" ry="5" fill="#5b7f4a" transform="rotate(40 251 330)"/>
  <ellipse cx="268" cy="310" rx="10" ry="5" fill="#5b7f4a" transform="rotate(-40 268 310)"/>
  <ellipse cx="268" cy="330" rx="10" ry="5" fill="#5b7f4a" transform="rotate(40 268 330)"/>
  <ellipse cx="294" cy="320" rx="11" ry="5" fill="#5b7f4a"/>
  </g>
  <g transform="rotate(20 280 216)">
  <line x1="280" y1="216" x2="370" y2="216" stroke="#5b7f4a" stroke-width="3"/>
