  <ellipse cx="438" cy="142" rx="10" ry="5" fill="#8fae78" transform="rotate(-40 438 142)"/>
  <ellipse cx="438" cy="162" rx="10" ry="5" fill="#8fae78" transform="rotate(40 438 162)"/>
  <ellipse cx="455" cy="142" rx="10" ry="5" fill="#8fae78" transform="rotate(-40 455 142)"/>
  <ellipse cx="455" cy="162" rx="10" ry="5" fill="#8fae78" transform="rotate(40 455 162)"/>
  <ellipse cx="472" cy="142" rx="10" ry="5" fill="#8fae78" transform="rotate(-40 472 142)"/>
  <ellipse cx="472" cy="162" rx="10" ry="5" fill="#8fae78" transform="rotate(40 472 162)"/>
