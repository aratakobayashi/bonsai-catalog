  <ellipse cx="558" cy="126" rx="10" ry="5" fill="#8fae78" transform="rotate(40 558 126)"/>
  <ellipse cx="575" cy="106" rx="10" ry="5" fill="#8fae78" transform="rotate(-40 575 106)"/>
  <ellipse cx="575" cy="126" rx="10" ry="5" fill="#8fae78" transform="rotate(40 575 126)"/>
  <ellipse cx="592" cy="106" rx="10" ry="5" fill="#8fae78" transform="rotate(-40 592 106)"/>
  <ellipse cx="592" cy="126" rx="10" ry="5" fill="#8fae78" transform="rotate(40 592 126)"/>
