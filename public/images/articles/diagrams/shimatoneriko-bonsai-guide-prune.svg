  <rect x="470" y="230" width="300" height="190" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="620" y="274" font-size="22" text-anchor="middle" fill="#22201c">残したい節の</text>
  <text x="620" y="306" font-size="22" text-anchor="middle" fill="#22201c">少し上で切る</text>
  <text x="620" y="352" font-size="22" text-anchor="middle" font-weight="700" fill="#5b7f4a">残す枝：濃い色</text>
  <text x="620" y="390" font-size="22" text-anchor="middle" fill="#6b655b">切る枝：薄い色</text>
</svg>
