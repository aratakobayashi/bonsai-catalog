  <ellipse cx="318" cy="226" rx="10" ry="5" fill="#5b7f4a" transform="rotate(40 318 226)"/>
  <ellipse cx="335" cy="206" rx="10" ry="5" fill="#5b7f4a" transform="rotate(-40 335 206)"/>
  <ellipse cx="335" cy="226" rx="10" ry="5" fill="#5b7f4a" transform="rotate(40 335 226)"/>
  <ellipse cx="352" cy="206" rx="10" ry="5" fill="#5b7f4a" transform="rotate(-40 352 206)"/>
  <ellipse cx="352" cy="226" rx="10" ry="5" fill="#5b7f4a" transform="rotate(40 352 226)"/>
  <ellipse cx="378" cy="216" rx="11" ry="5" fill="#5b7f4a"/>
