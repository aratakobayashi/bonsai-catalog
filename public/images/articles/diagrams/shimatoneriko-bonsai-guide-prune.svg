  <line x1="312" y1="160" x2="348" y2="210" stroke="#b4573a" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round"/>
  <text x="186" y="168" font-size="22" font-weight="700" fill="#b4573a">ここで切る</text>
  <g transform="rotate(-70 196 320)">
