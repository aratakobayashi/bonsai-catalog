<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>山椒の雄花と雌花の見分け方</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <rect x="20" y="20" width="370" height="430" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="410" y="20" width="370" height="430" rx="16" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <text x="205" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#22201c">雄木の花</text>
  <text x="595" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#22201c">雌木の花</text>
  <!-- 雄花：花びら＋おしべ -->
  <g transform="translate(205 180)">
    <g fill="#e6dcae"><circle cx="0" cy="-34" r="20"/><circle cx="32" cy="-10" r="20"/><circle cx="20" cy="28" r="20"/><circle cx="-20" cy="28" r="20"/><circle cx="-32" cy="-10" r="20"/></g>
    <g stroke="#8b6b4a" stroke-width="4" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="-46"/><line x1="0" y1="0" x2="40" y2="-22"/><line x1="0" y1="0" x2="-40" y2="-22"/><line x1="0" y1="0" x2="26" y2="36"/><line x1="0" y1="0" x2="-26" y2="36"/></g>
    <g fill="#b8935a"><circle cx="0" cy="-50" r="9"/><circle cx="44" cy="-24" r="9"/><circle cx="-44" cy="-24" r="9"/><circle cx="29" cy="40" r="9"/><circle cx="-29" cy="40" r="9"/></g>
  </g>
  <text x="205" y="292" text-anchor="middle" font-size="24" fill="#8b6b4a">黄色いおしべが目立つ</text>
  <text x="205" y="400" text-anchor="middle" font-size="26" font-weight="700" fill="#6b655b">実はならない</text>
  <!-- 雌花→実 -->
  <g transform="translate(595 180)">
    <g fill="#e6dcae"><circle cx="0" cy="-34" r="20"/><circle cx="32" cy="-10" r="20"/><circle cx="20" cy="28" r="20"/><circle cx="-20" cy="28" r="20"/><circle cx="-32" cy="-10" r="20"/></g>
    <circle cx="-9" cy="0" r="13" fill="#5b7f4a"/><circle cx="9" cy="0" r="13" fill="#5b7f4a"/>
  </g>
  <text x="595" y="292" text-anchor="middle" font-size="24" fill="#5b7f4a">緑の小さな粒がある</text>
  <g>
    <circle cx="500" cy="384" r="13" fill="#5b7f4a"/><circle cx="526" cy="384" r="13" fill="#5b7f4a"/>
    <text x="513" y="430" text-anchor="middle" font-size="22" fill="#22201c">初夏</text>
    <path d="M556 384 h40" stroke="#b8935a" stroke-width="4"/><path d="M596 376 l12 8 l-12 8 z" fill="#b8935a"/>
    <circle cx="650" cy="384" r="14" fill="#b4573a"/><circle cx="680" cy="384" r="14" fill="#b4573a"/>
    <circle cx="650" cy="384" r="5" fill="#22201c"/><circle cx="680" cy="384" r="5" fill="#22201c"/>
    <text x="665" y="430" text-anchor="middle" font-size="22" fill="#22201c">秋</text>
  </g>
</svg>
