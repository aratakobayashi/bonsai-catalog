<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>実生の1年の流れ</title>
  <rect width="800" height="380" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">実生の1年の流れ</text>
  <g font-size="20">
    <rect x="22" y="76" width="140" height="190" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <text x="92" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#b8935a">秋</text>
    <path d="M70 150 q22 -30 44 0 q-22 10 -44 0 z" fill="#b9774a"/><path d="M92 150 q8 26 26 40" stroke="#b9774a" stroke-width="10" fill="none" stroke-linecap="round" opacity=".7"/>
    <text x="92" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">熟した種を</text><text x="92" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">採る</text>
    <path d="M164 170 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M168 162 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="178" y="76" width="140" height="190" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <text x="248" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#4f86b5">冬</text>
    <rect x="218" y="130" width="60" height="70" rx="6" fill="#e5eef5" stroke="#9fc3dc" stroke-width="2"/><path d="M234 150 l6 -6 l6 6 l-6 6 z M252 168 l6 -6 l6 6 l-6 6 z" fill="#9fc3dc"/>
    <text x="248" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">寒さに当てて</text><text x="248" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">保存</text>
    <path d="M320 170 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M324 162 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="334" y="76" width="140" height="190" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <text x="404" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#5b7f4a">春</text>
    <path d="M360 186 h88 l-6 22 h-76 z" fill="#3a3731"/><rect x="360" y="182" width="88" height="8" fill="#8a6a4a"/><path d="M384 182 v-18 M404 182 v-24 M424 182 v-16" stroke="#6f9558" stroke-width="3"/><ellipse cx="398" cy="156" rx="7" ry="4" fill="#6f9558"/><ellipse cx="410" cy="156" rx="7" ry="4" fill="#6f9558"/>
    <text x="404" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">まいて</text><text x="404" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">発芽</text>
    <path d="M476 170 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M480 162 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="490" y="76" width="140" height="190" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <text x="560" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#c45c4a">夏</text>
    <circle cx="530" cy="146" r="14" fill="#ecc650"/><path d="M548 190 h56 l-6 20 h-44 z" fill="#3a3731"/><path d="M576 190 v-30" stroke="#6f9558" stroke-width="3"/><ellipse cx="568" cy="160" rx="9" ry="5" fill="#6f9558"/><ellipse cx="584" cy="156" rx="9" ry="5" fill="#5b7f4a"/>
    <text x="560" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">日差しと</text><text x="560" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">水切れに注意</text>
    <path d="M632 170 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M636 162 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="646" y="76" width="132" height="190" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <text x="712" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#5b7f4a">次の春</text>
    <path d="M680 186 h28 l-4 18 h-20 z M716 186 h28 l-4 18 h-20 z" fill="#3a3731"/><path d="M694 186 v-30 M730 186 v-34" stroke="#7a5236" stroke-width="3"/><ellipse cx="694" cy="154" rx="11" ry="6" fill="#6f9558"/><ellipse cx="730" cy="150" rx="11" ry="6" fill="#5b7f4a"/>
    <text x="712" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">1本ずつ</text><text x="712" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">鉢上げ</text>
  </g>
  <rect x="22" y="284" width="756" height="68" rx="14" fill="#f3ebdd"/>
  <text x="40" y="314" font-size="19" font-weight="700" fill="#2c2a26">もみじなどは冬の寒さに当ててからまくと、</text>
  <text x="40" y="340" font-size="19" fill="#2c2a26">春にそろって芽が出やすくなります</text>
  <text x="776" y="372" text-anchor="end" font-size="15" fill="#b8935a" letter-spacing="2">盆栽コレクション</text>
</svg>
