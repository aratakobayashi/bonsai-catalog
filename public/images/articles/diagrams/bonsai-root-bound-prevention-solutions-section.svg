<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>健康な鉢と根詰まりの鉢の断面</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <!-- 健康 -->
  <rect x="20" y="20" width="370" height="340" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="205" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#5b7f4a">健康な鉢</text>
  <path d="M60 150 h290 l-24 150 h-242 z" fill="#8b6b4a"/>
  <path d="M74 160 h262 l-20 130 h-222 z" fill="#e3d2b4"/>
  <g fill="#c9b48f"><circle cx="110" cy="190" r="6"/><circle cx="150" cy="250" r="6"/><circle cx="260" cy="200" r="6"/><circle cx="290" cy="260" r="6"/><circle cx="200" cy="275" r="6"/><circle cx="130" cy="225" r="5"/><circle cx="300" cy="180" r="5"/></g>
  <g stroke="#6f5439" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M205 160 v40"/><path d="M205 200 q-40 20 -70 60"/><path d="M205 200 q40 20 70 50"/><path d="M205 210 v60"/><path d="M190 230 q-30 0 -50 -20"/>
  </g>
  <rect x="198" y="100" width="14" height="62" fill="#6f5439"/>
  <g stroke="#1a365d" stroke-width="3" fill="none"><path d="M120 120 v26 m-6 -8 l6 8 l6 -8"/><path d="M290 120 v26 m-6 -8 l6 8 l6 -8"/></g>
  <text x="205" y="340" text-anchor="middle" font-size="24" fill="#22201c">すき間があり、水が通る</text>

  <!-- 根詰まり -->
  <rect x="410" y="20" width="370" height="340" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="595" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#8b6b4a">根詰まりの鉢</text>
  <path d="M450 150 h290 l-24 150 h-242 z" fill="#8b6b4a"/>
  <path d="M464 160 h262 l-20 130 h-222 z" fill="#b59b78"/>
  <g stroke="#6f5439" stroke-width="5" fill="none">
    <path d="M470 168 h250 l-18 116 h-214 z"/>
    <path d="M480 178 h230 l-16 98 h-198 z"/>
    <path d="M490 188 h210 l-14 80 h-182 z"/>
  </g>
  <rect x="588" y="100" width="14" height="62" fill="#6f5439"/>
  <rect x="470" y="140" width="250" height="12" rx="6" fill="#9cc0d8"/>
  <g stroke="#6f5439" stroke-width="4" stroke-linecap="round"><path d="M580 300 v18"/><path d="M610 300 v22"/></g>
  <text x="595" y="340" text-anchor="middle" font-size="24" fill="#22201c">根が回り、水が表面にたまる</text>

  <rect x="20" y="378" width="760" height="72" rx="14" fill="#f3f0ea" stroke="#8b6b4a" stroke-width="2"/>
  <text x="400" y="424" text-anchor="middle" font-size="25" fill="#22201c">鉢底から根が出る・水が染み込まない → 植え替えの合図</text>
</svg>
