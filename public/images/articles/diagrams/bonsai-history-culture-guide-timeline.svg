<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の歴史の大まかな流れ</title>
  <rect width="800" height="432" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">歴史の大まかな流れ</text>
  <line x1="40" y1="128" x2="760" y2="128" stroke="#b8935a" stroke-width="5"/>
  <circle cx="90" cy="128" r="12" fill="#b8935a"/>
  <text x="90" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">中国</text>
  <rect x="15" y="154" width="150" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="90" y="200" text-anchor="middle" font-size="22" fill="#2c2a26">盆景が</text>
  <text x="90" y="240" text-anchor="middle" font-size="22" fill="#2c2a26">起こりと</text>
  <text x="90" y="280" text-anchor="middle" font-size="22" fill="#2c2a26">される</text>
  <circle cx="245" cy="128" r="12" fill="#b8935a"/>
  <text x="245" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">鎌倉〜室町</text>
  <rect x="170" y="154" width="150" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="245" y="200" text-anchor="middle" font-size="22" fill="#2c2a26">絵巻に</text>
  <text x="245" y="240" text-anchor="middle" font-size="22" fill="#2c2a26">鉢植えの樹が</text>
  <text x="245" y="280" text-anchor="middle" font-size="22" fill="#2c2a26">描かれる</text>
  <circle cx="400" cy="128" r="12" fill="#b8935a"/>
  <text x="400" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">江戸</text>
  <rect x="325" y="154" width="150" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-size="22" fill="#2c2a26">武家や町人に</text>
  <text x="400" y="240" text-anchor="middle" font-size="22" fill="#2c2a26">鉢植えが</text>
  <text x="400" y="280" text-anchor="middle" font-size="22" fill="#2c2a26">広まる</text>
  <circle cx="555" cy="128" r="12" fill="#b8935a"/>
  <text x="555" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">明治〜大正</text>
  <rect x="480" y="154" width="150" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="555" y="200" text-anchor="middle" font-size="22" fill="#2c2a26">盆栽の名が</text>
  <text x="555" y="240" text-anchor="middle" font-size="22" fill="#2c2a26">定着、大宮に</text>
  <text x="555" y="280" text-anchor="middle" font-size="22" fill="#2c2a26">盆栽村</text>
  <circle cx="710" cy="128" r="12" fill="#b8935a"/>
  <text x="710" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">昭和以降</text>
  <rect x="635" y="154" width="150" height="170" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="710" y="200" text-anchor="middle" font-size="22" fill="#2c2a26">海外に</text>
  <text x="710" y="240" text-anchor="middle" font-size="22" fill="#2c2a26">広まり</text>
  <text x="710" y="280" text-anchor="middle" font-size="22" fill="#2c2a26">BONSAIに</text>
  <text x="400" y="368" text-anchor="middle" font-size="24" font-weight="700" fill="#5b7f4a">中国の盆景から、日本の盆栽へ</text>
<text x="776" y="416" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
