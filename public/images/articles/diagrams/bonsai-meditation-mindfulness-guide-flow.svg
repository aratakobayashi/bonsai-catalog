<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽と向き合う時間の流れ。眺める、確かめる、手入れする、書き留めるの4つ</title>
  <rect width="800" height="416" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">盆栽と過ごす時間の流れ</text>
  <rect x="20" y="80" width="172" height="230" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="106" cy="132" r="26" fill="#5b7f4a"/>
  <text x="106" y="141" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="106" y="200" font-size="26" font-weight="700" text-anchor="middle" fill="#22201c">眺める</text>
  <text x="106" y="244" font-size="22" text-anchor="middle" fill="#6b655b">正面から</text>
  <text x="106" y="276" font-size="22" text-anchor="middle" fill="#6b655b">全体を見る</text>
  <path d="M196 195 l14 0" stroke="#b8935a" stroke-width="4"/><path d="M214 195 l-9 -7 v14 z" fill="#b8935a"/>
  <rect x="216" y="80" width="172" height="230" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="302" cy="132" r="26" fill="#1a365d"/>
  <text x="302" y="141" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="302" y="200" font-size="26" font-weight="700" text-anchor="middle" fill="#22201c">確かめる</text>
  <text x="302" y="244" font-size="22" text-anchor="middle" fill="#6b655b">土・葉・芽に</text>
  <text x="302" y="276" font-size="22" text-anchor="middle" fill="#6b655b">触れてみる</text>
  <path d="M392 195 l14 0" stroke="#b8935a" stroke-width="4"/><path d="M410 195 l-9 -7 v14 z" fill="#b8935a"/>
  <rect x="412" y="80" width="172" height="230" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="498" cy="132" r="26" fill="#5b7f4a"/>
  <text x="498" y="141" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="498" y="200" font-size="26" font-weight="700" text-anchor="middle" fill="#22201c">手入れする</text>
  <text x="498" y="244" font-size="22" text-anchor="middle" fill="#6b655b">水やりや</text>
  <text x="498" y="276" font-size="22" text-anchor="middle" fill="#6b655b">芽摘みを1つ</text>
  <path d="M588 195 l14 0" stroke="#b8935a" stroke-width="4"/><path d="M606 195 l-9 -7 v14 z" fill="#b8935a"/>
  <rect x="608" y="80" width="172" height="230" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="694" cy="132" r="26" fill="#1a365d"/>
  <text x="694" y="141" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">4</text>
  <text x="694" y="200" font-size="26" font-weight="700" text-anchor="middle" fill="#22201c">書き留める</text>
  <text x="694" y="244" font-size="22" text-anchor="middle" fill="#6b655b">気づいたことを</text>
  <text x="694" y="276" font-size="22" text-anchor="middle" fill="#6b655b">一行だけ</text>
  <rect x="20" y="334" width="760" height="62" rx="12" fill="#f3f0ea"/>
  <text x="400" y="374" font-size="24" font-weight="700" text-anchor="middle" fill="#1a365d">スマートフォンは離れた所に置いておく</text>
</svg>
