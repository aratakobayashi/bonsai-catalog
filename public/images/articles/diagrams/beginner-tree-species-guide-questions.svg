<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>樹種を選ぶ前の3つの質問</title>
  <rect width="800" height="510" fill="#faf7f0"/>
  <text x="24" y="46" font-size="30" font-weight="700" fill="#2c2a26">樹種を選ぶ前の3つの質問</text>
  <g>
    <rect x="20" y="74" width="245" height="290" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="142" cy="120" r="26" fill="#b8935a"/><text x="142" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">1</text>
    <text x="142" y="186" text-anchor="middle" font-size="26" font-weight="700" fill="#2c2a26">どこに置く？</text>
    <text x="142" y="236" text-anchor="middle" font-size="22" fill="#2c2a26">日が当たる屋外</text>
    <text x="142" y="268" text-anchor="middle" font-size="22" fill="#2c2a26">→ ほぼすべて</text>
    <text x="142" y="314" text-anchor="middle" font-size="22" fill="#2c2a26">室内だけ</text>
    <text x="142" y="346" text-anchor="middle" font-size="22" fill="#2c2a26">→ ガジュマルなど</text>
  </g>
  <g>
    <rect x="277" y="74" width="245" height="290" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="400" cy="120" r="26" fill="#b8935a"/><text x="400" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">2</text>
    <text x="400" y="186" text-anchor="middle" font-size="26" font-weight="700" fill="#2c2a26">何を楽しむ？</text>
    <text x="400" y="236" text-anchor="middle" font-size="22" fill="#2c2a26">一年中の緑 → 松柏</text>
    <text x="400" y="278" text-anchor="middle" font-size="22" fill="#2c2a26">紅葉・枝 → 雑木</text>
    <text x="400" y="320" text-anchor="middle" font-size="22" fill="#2c2a26">花 → 花もの</text>
  </g>
  <g>
    <rect x="534" y="74" width="246" height="290" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="657" cy="120" r="26" fill="#b8935a"/><text x="657" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">3</text>
    <text x="657" y="186" text-anchor="middle" font-size="26" font-weight="700" fill="#2c2a26">夏の水やり</text>
    <text x="657" y="236" text-anchor="middle" font-size="22" fill="#2c2a26">朝夕できる</text>
    <text x="657" y="268" text-anchor="middle" font-size="22" fill="#2c2a26">→ もみじも可</text>
    <text x="657" y="314" text-anchor="middle" font-size="22" fill="#2c2a26">朝だけ</text>
    <text x="657" y="346" text-anchor="middle" font-size="22" fill="#2c2a26">→ 真柏・松</text>
  </g>
  <rect x="20" y="384" width="760" height="64" rx="14" fill="#a07a42"/>
  <text x="400" y="426" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">置き場所に合う樹種から選ぶのが近道</text>
<text x="776" y="494" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
