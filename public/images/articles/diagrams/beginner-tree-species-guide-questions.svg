<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>樹種を選ぶ前の3つの質問</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">樹種を選ぶ前の3つの質問</text>
  <g>
    <rect x="20" y="74" width="245" height="290" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <circle cx="142" cy="120" r="26" fill="#1a365d"/><text x="142" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">1</text>
    <text x="142" y="186" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">どこに置く？</text>
    <text x="142" y="236" text-anchor="middle" font-size="22" fill="#22201c">日が当たる屋外</text>
    <text x="142" y="268" text-anchor="middle" font-size="22" fill="#22201c">→ ほぼすべて</text>
    <text x="142" y="314" text-anchor="middle" font-size="22" fill="#22201c">室内だけ</text>
    <text x="142" y="346" text-anchor="middle" font-size="22" fill="#22201c">→ ガジュマルなど</text>
  </g>
  <g>
    <rect x="277" y="74" width="245" height="290" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <circle cx="400" cy="120" r="26" fill="#1a365d"/><text x="400" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">2</text>
    <text x="400" y="186" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">何を楽しむ？</text>
    <text x="400" y="236" text-anchor="middle" font-size="22" fill="#22201c">一年中の緑 → 松柏</text>
    <text x="400" y="278" text-anchor="middle" font-size="22" fill="#22201c">紅葉・枝 → 雑木</text>
    <text x="400" y="320" text-anchor="middle" font-size="22" fill="#22201c">花 → 花もの</text>
  </g>
  <g>
    <rect x="534" y="74" width="246" height="290" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <circle cx="657" cy="120" r="26" fill="#1a365d"/><text x="657" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">3</text>
    <text x="657" y="186" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">夏の水やり</text>
    <text x="657" y="236" text-anchor="middle" font-size="22" fill="#22201c">朝夕できる</text>
    <text x="657" y="268" text-anchor="middle" font-size="22" fill="#22201c">→ もみじも可</text>
    <text x="657" y="314" text-anchor="middle" font-size="22" fill="#22201c">朝だけ</text>
    <text x="657" y="346" text-anchor="middle" font-size="22" fill="#22201c">→ 真柏・松</text>
  </g>
  <rect x="20" y="384" width="760" height="64" rx="14" fill="#1a365d"/>
  <text x="400" y="426" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">置き場所に合う樹種から選ぶのが近道</text>
</svg>
