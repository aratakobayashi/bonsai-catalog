<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>始める前に確かめる手続き</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">始める前に確かめる手続き</text>
  <g font-size="24" fill="#22201c">
    <rect x="20" y="72" width="760" height="78" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="44" y="94" width="34" height="34" rx="6" fill="none" stroke="#1a365d" stroke-width="3"/>
    <path d="M51 111 l8 8 l14 -16" fill="none" stroke="#5b7f4a" stroke-width="4"/>
    <text x="98" y="104" font-weight="700">事業を始めた届け出</text>
    <text x="98" y="136" font-size="22" fill="#6b655b">個人なら税務署へ開業の届け出</text>
    <rect x="20" y="162" width="760" height="78" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="44" y="184" width="34" height="34" rx="6" fill="none" stroke="#1a365d" stroke-width="3"/>
    <path d="M51 201 l8 8 l14 -16" fill="none" stroke="#5b7f4a" stroke-width="4"/>
    <text x="98" y="194" font-weight="700">通販をするなら</text>
    <text x="98" y="226" font-size="22" fill="#6b655b">特定商取引法にもとづく表示</text>
    <rect x="20" y="252" width="760" height="78" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="44" y="274" width="34" height="34" rx="6" fill="none" stroke="#1a365d" stroke-width="3"/>
    <path d="M51 291 l8 8 l14 -16" fill="none" stroke="#5b7f4a" stroke-width="4"/>
    <text x="98" y="284" font-weight="700">中古の鉢や道具を仕入れて売るなら</text>
    <text x="98" y="316" font-size="22" fill="#6b655b">古物商の許可（警察署が窓口）</text>
    <rect x="20" y="342" width="760" height="78" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <rect x="44" y="364" width="34" height="34" rx="6" fill="none" stroke="#1a365d" stroke-width="3"/>
    <path d="M51 381 l8 8 l14 -16" fill="none" stroke="#5b7f4a" stroke-width="4"/>
    <text x="98" y="374" font-weight="700">海外に送るなら</text>
    <text x="98" y="406" font-size="22" fill="#6b655b">植物検疫と相手の国の決まり</text>
  </g>
  <text x="400" y="458" text-anchor="middle" font-size="22" fill="#6b655b">細かな条件は、それぞれの窓口で確かめる</text>
</svg>
