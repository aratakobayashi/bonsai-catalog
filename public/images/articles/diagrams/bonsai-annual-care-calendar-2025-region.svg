<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>地域による作業時期のずれ</title>
  <rect width="800" height="420" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">地域で作業の時期がずれる</text>
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="250" y="100">春の作業</text>
    <text x="600" y="100">秋・冬の準備</text>
  </g>
  <g font-size="24" font-weight="700" fill="#22201c">
    <text x="24" y="160">寒い地域</text>
    <text x="24" y="240">関東の平地</text>
    <text x="24" y="320">暖かい地域</text>
  </g>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="160" y="126" width="620" height="50" rx="8"/>
    <rect x="160" y="206" width="620" height="50" rx="8"/>
    <rect x="160" y="286" width="620" height="50" rx="8"/>
  </g>
  <!-- 基準 -->
  <rect x="200" y="217" width="100" height="28" rx="6" fill="#5b7f4a"/>
  <rect x="560" y="217" width="100" height="28" rx="6" fill="#1a365d"/>
  <!-- 寒い：春遅く、秋早く -->
  <rect x="250" y="137" width="100" height="28" rx="6" fill="#5b7f4a"/>
  <rect x="510" y="137" width="100" height="28" rx="6" fill="#1a365d"/>
  <!-- 暖かい：春早く、秋遅く -->
  <rect x="170" y="297" width="100" height="28" rx="6" fill="#5b7f4a"/>
  <rect x="610" y="297" width="100" height="28" rx="6" fill="#1a365d"/>
  <g stroke="#b8935a" stroke-width="3" fill="#b8935a">
    <line x1="250" y1="190" x2="300" y2="190"/><path d="M300 184 l12 6 l-12 6 z"/>
    <line x1="560" y1="190" x2="510" y2="190"/><path d="M510 184 l-12 6 l12 6 z"/>
  </g>
  <rect x="20" y="352" width="760" height="54" rx="14" fill="#1a365d"/>
  <text x="400" y="387" text-anchor="middle" font-size="24" font-weight="700" fill="#faf9f6">月よりも、芽の動きと気温で時期を決める</text>
</svg>
