<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 496" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>黒松、五葉松、真柏のちがい。どれも日によく当てる。黒松は乾いたらたっぷり水をやり6〜7月に芽切り、五葉松はやや乾かし気味で春に芽摘み、真柏は乾いたら水やりと葉水で芽摘みと針金かけ</title>
  <rect width="800" height="496" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">松柏類3種のちがい</text>
  <rect x="20" y="72" width="760" height="56" rx="10" fill="#a07a42"/>
  <text x="290" y="109" font-size="24" font-weight="700" fill="#faf7f0" text-anchor="middle">日当たり</text>
  <text x="480" y="109" font-size="24" font-weight="700" fill="#faf7f0" text-anchor="middle">水やり</text>
  <text x="680" y="109" font-size="24" font-weight="700" fill="#faf7f0" text-anchor="middle">主な手入れ</text>
  <rect x="20" y="138" width="760" height="80" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="80" y="188" font-size="28" font-weight="700" fill="#2c2a26" text-anchor="middle">黒松</text>
  <text x="290" y="188" font-size="22" fill="#2c2a26" text-anchor="middle">よく当てる</text>
  <text x="480" y="188" font-size="22" fill="#2c2a26" text-anchor="middle">乾いたらたっぷり</text>
  <text x="680" y="188" font-size="22" fill="#2c2a26" text-anchor="middle">芽切り（6〜7月）</text>
  <rect x="20" y="228" width="760" height="80" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="80" y="278" font-size="28" font-weight="700" fill="#2c2a26" text-anchor="middle">五葉松</text>
  <text x="290" y="278" font-size="22" fill="#2c2a26" text-anchor="middle">よく当てる</text>
  <text x="480" y="278" font-size="22" fill="#2c2a26" text-anchor="middle">やや乾かし気味</text>
  <text x="680" y="278" font-size="22" fill="#2c2a26" text-anchor="middle">芽摘み（春）</text>
  <rect x="20" y="318" width="760" height="80" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="80" y="368" font-size="28" font-weight="700" fill="#2c2a26" text-anchor="middle">真柏</text>
  <text x="290" y="368" font-size="22" fill="#2c2a26" text-anchor="middle">よく当てる</text>
  <text x="480" y="368" font-size="22" fill="#2c2a26" text-anchor="middle">乾いたら＋葉水</text>
  <text x="680" y="368" font-size="22" fill="#2c2a26" text-anchor="middle">芽摘み・針金</text>
  <text x="400" y="432" font-size="22" fill="#6b655b" text-anchor="middle">どれも屋外の日なたで育てる樹です</text>

<text x="776" y="480" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
