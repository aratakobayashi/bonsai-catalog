<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>皐月の年間作業カレンダー。植え替えは3〜4月か花後の6月、開花は5月下旬〜6月中旬、花がら摘みと花後の剪定は6月中旬〜7月上旬、7月以降に翌年の花芽ができる、肥料は4月・花後・9〜10月、夏は西日を避け、冬は寒風と凍結を避ける</title>
  <rect width="800" height="550" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">皐月の一年の作業</text>
  <text x="780" y="44" text-anchor="end" font-size="22" fill="#6b655b">関東の平地の目安</text>
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="186" y="94">1</text><text x="239" y="94">2</text><text x="291" y="94">3</text><text x="344" y="94">4</text><text x="396" y="94">5</text><text x="449" y="94">6</text><text x="501" y="94">7</text><text x="554" y="94">8</text><text x="606" y="94">9</text><text x="659" y="94">10</text><text x="711" y="94">11</text><text x="764" y="94">12</text>
  </g>
  <text x="20" y="94" font-size="22" fill="#6b655b">月</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="108" width="770" height="50" rx="8"/>
    <rect x="20" y="164" width="770" height="50" rx="8"/>
    <rect x="20" y="220" width="770" height="50" rx="8"/>
    <rect x="20" y="276" width="770" height="50" rx="8"/>
    <rect x="20" y="332" width="770" height="50" rx="8"/>
    <rect x="20" y="388" width="770" height="50" rx="8"/>
    <rect x="20" y="444" width="770" height="50" rx="8"/>
  </g>
  <g stroke="#ebe7df" stroke-width="1.5">
    <line x1="160.0" y1="108" x2="160.0" y2="494"/>
    <line x1="212.5" y1="108" x2="212.5" y2="494"/>
    <line x1="265.0" y1="108" x2="265.0" y2="494"/>
    <line x1="317.5" y1="108" x2="317.5" y2="494"/>
    <line x1="370.0" y1="108" x2="370.0" y2="494"/>
    <line x1="422.5" y1="108" x2="422.5" y2="494"/>
    <line x1="475.0" y1="108" x2="475.0" y2="494"/>
    <line x1="527.5" y1="108" x2="527.5" y2="494"/>
    <line x1="580.0" y1="108" x2="580.0" y2="494"/>
    <line x1="632.5" y1="108" x2="632.5" y2="494"/>
    <line x1="685.0" y1="108" x2="685.0" y2="494"/>
    <line x1="737.5" y1="108" x2="737.5" y2="494"/>
  </g>
  <text x="32" y="141" font-size="24" font-weight="700" fill="#22201c">植え替え</text>
  <rect x="265.0" y="119" width="99.8" height="28" rx="6" fill="#8b6b4a"/>
  <rect x="438.2" y="119" width="36.8" height="28" rx="6" fill="#8b6b4a" fill-opacity="0.45"/>
  <text x="32" y="197" font-size="24" font-weight="700" fill="#22201c">開花</text>
  <rect x="401.5" y="175" width="52.5" height="28" rx="6" fill="#b4573a"/>
  <text x="32" y="253" font-size="24" font-weight="700" fill="#22201c">花後の剪定</text>
  <rect x="443.5" y="231" width="52.5" height="28" rx="6" fill="#1a365d"/>
  <text x="32" y="309" font-size="21" font-weight="700" fill="#22201c">花芽ができる</text>
  <rect x="496.0" y="287" width="115.5" height="28" rx="6" fill="#5b7f4a" fill-opacity="0.45"/>
  <text x="32" y="365" font-size="24" font-weight="700" fill="#22201c">肥料</text>
  <rect x="307.0" y="343" width="52.5" height="28" rx="6" fill="#b8935a"/>
  <rect x="454.0" y="343" width="42.0" height="28" rx="6" fill="#b8935a"/>
  <rect x="580.0" y="343" width="105.0" height="28" rx="6" fill="#b8935a"/>
  <text x="32" y="421" font-size="24" font-weight="700" fill="#22201c">西日よけ</text>
  <rect x="475.0" y="399" width="126.0" height="28" rx="6" fill="#6b655b"/>
  <text x="32" y="477" font-size="24" font-weight="700" fill="#22201c">冬の保護</text>
  <rect x="160.0" y="455" width="105.0" height="28" rx="6" fill="#6b655b" fill-opacity="0.35"/>
  <rect x="737.5" y="455" width="52.5" height="28" rx="6" fill="#6b655b" fill-opacity="0.35"/>
  <text x="20" y="536" font-size="22" fill="#6b655b">薄い色：花後の植え替え／花芽ができる時期（強く切らない）</text>
</svg>
