<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>舎利とジンの見分け方</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">舎利とジン</text>
  <rect x="20" y="70" width="460" height="390" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <!-- pot -->
  <path d="M120 400 h240 l-18 36 h-204 z" fill="#8b6b4a"/>
  <!-- trunk living (brown) and shari (white) -->
  <path d="M220 400 q-30 -80 20 -150 q40 -60 0 -120" fill="none" stroke="#6f5439" stroke-width="40" stroke-linecap="round"/>
  <path d="M236 400 q-24 -80 18 -150 q34 -56 4 -112" fill="none" stroke="#efe9dc" stroke-width="14" stroke-linecap="round"/>
  <!-- jin at top -->
  <path d="M240 140 l-10 -50 l18 -6" fill="none" stroke="#efe9dc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 230 l60 -40" stroke="#efe9dc" stroke-width="8" stroke-linecap="round"/>
  <!-- foliage -->
  <ellipse cx="170" cy="230" rx="58" ry="24" fill="#5b7f4a"/>
  <ellipse cx="300" cy="150" rx="64" ry="24" fill="#5b7f4a"/>
  <ellipse cx="200" cy="320" rx="40" ry="18" fill="#5b7f4a"/>
  <!-- leader lines -->
  <g stroke="#b8935a" stroke-width="2.5">
    <line x1="258" y1="300" x2="520" y2="300"/>
    <line x1="232" y1="96" x2="520" y2="110"/>
    <line x1="316" y1="194" x2="520" y2="200"/>
  </g>
  <g font-size="24" font-weight="700" fill="#22201c">
    <text x="530" y="118">ジン（幹先）</text>
    <text x="530" y="208">ジン（枝）</text>
    <text x="530" y="308">舎利（幹）</text>
  </g>
  <g font-size="22" fill="#6b655b">
    <text x="530" y="146">枯れた枝先や幹先</text>
    <text x="530" y="236">白く残した枯れ枝</text>
    <text x="530" y="336">幹の一部が白い</text>
    <text x="530" y="364">生きた部分と並ぶ</text>
  </g>
</svg>
