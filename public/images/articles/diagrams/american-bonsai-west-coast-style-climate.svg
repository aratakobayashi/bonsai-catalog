<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>カリフォルニア沿岸部と関東の雨の多い時期の比較</title>
  <rect width="800" height="420" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">雨の多い時期のちがい（おおよそ）</text>
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="236" y="98">1</text><text x="282" y="98">2</text><text x="328" y="98">3</text>
    <text x="374" y="98">4</text><text x="420" y="98">5</text><text x="466" y="98">6</text>
    <text x="512" y="98">7</text><text x="558" y="98">8</text><text x="604" y="98">9</text>
    <text x="650" y="98">10</text><text x="696" y="98">11</text><text x="742" y="98">12</text>
  </g>
  <text x="20" y="98" font-size="22" fill="#6b655b">月</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="114" width="760" height="90" rx="10"/>
    <rect x="20" y="220" width="760" height="90" rx="10"/>
  </g>
  <g font-size="24" font-weight="700" fill="#22201c">
    <text x="36" y="154">西海岸</text>
    <text x="36" y="260">関東</text>
  </g>
  <g font-size="22" fill="#6b655b">
    <text x="36" y="186">（沿岸部）</text>
    <text x="36" y="292">（平地）</text>
  </g>
  <!-- West coast rain: Nov-Mar -->
  <rect x="213" y="140" width="138" height="38" rx="8" fill="#1a365d"/>
  <rect x="673" y="140" width="92" height="38" rx="8" fill="#1a365d"/>
  <rect x="397" y="140" width="230" height="38" rx="8" fill="#b8935a" fill-opacity="0.5"/>
  <text x="512" y="167" text-anchor="middle" font-size="22" fill="#22201c">乾いた夏</text>
  <!-- Kanto rain: Jun-Jul, Sep-Oct -->
  <rect x="443" y="246" width="92" height="38" rx="8" fill="#1a365d"/>
  <rect x="581" y="246" width="92" height="38" rx="8" fill="#1a365d"/>
  <rect x="213" y="246" width="92" height="38" rx="8" fill="#b8935a" fill-opacity="0.5"/>
  <rect x="719" y="246" width="46" height="38" rx="8" fill="#b8935a" fill-opacity="0.5"/>
  <text x="259" y="273" text-anchor="middle" font-size="22" fill="#22201c">乾燥</text>
  <g font-size="22">
    <rect x="20" y="334" width="26" height="26" rx="5" fill="#1a365d"/>
    <text x="56" y="355" fill="#22201c">雨が多い</text>
    <rect x="200" y="334" width="26" height="26" rx="5" fill="#b8935a" fill-opacity="0.5"/>
    <text x="236" y="355" fill="#22201c">乾きやすい</text>
  </g>
  <text x="20" y="400" font-size="22" fill="#6b655b">地域や年によって変わります。傾向の比較です</text>
</svg>
