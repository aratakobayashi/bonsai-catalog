<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 502" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽展に出品するまでの準備の流れ</title>
  <rect width="800" height="502" fill="#faf9f6"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">出品までの準備の流れ</text>
  <rect x="30" y="80" width="740" height="58" rx="10" fill="#fff"/>
  <circle cx="72" cy="109" r="9" fill="#b8935a"/>
  <line x1="72" y1="118" x2="72" y2="158" stroke="#b8935a" stroke-width="3"/>
  <text x="96" y="117" font-size="24" font-weight="700" fill="#1a365d">数か月前</text>
  <text x="250" y="117" font-size="24" fill="#22201c">申し込み・出す樹を決める</text>
  <rect x="30" y="148" width="740" height="58" rx="10" fill="#f3f0ea"/>
  <circle cx="72" cy="177" r="9" fill="#b8935a"/>
  <line x1="72" y1="186" x2="72" y2="226" stroke="#b8935a" stroke-width="3"/>
  <text x="96" y="185" font-size="24" font-weight="700" fill="#1a365d">1か月前</text>
  <text x="250" y="185" font-size="24" fill="#22201c">枝先と葉を整える</text>
  <rect x="30" y="216" width="740" height="58" rx="10" fill="#fff"/>
  <circle cx="72" cy="245" r="9" fill="#b8935a"/>
  <line x1="72" y1="254" x2="72" y2="294" stroke="#b8935a" stroke-width="3"/>
  <text x="96" y="253" font-size="24" font-weight="700" fill="#1a365d">2週間前</text>
  <text x="250" y="253" font-size="24" fill="#22201c">鉢を洗い、苔を張る</text>
  <rect x="30" y="284" width="740" height="58" rx="10" fill="#f3f0ea"/>
  <circle cx="72" cy="313" r="9" fill="#b8935a"/>
  <line x1="72" y1="322" x2="72" y2="362" stroke="#b8935a" stroke-width="3"/>
  <text x="96" y="321" font-size="24" font-weight="700" fill="#1a365d">前日</text>
  <text x="250" y="321" font-size="24" fill="#22201c">卓と添えを用意する</text>
  <rect x="30" y="352" width="740" height="58" rx="10" fill="#fff"/>
  <circle cx="72" cy="381" r="9" fill="#b8935a"/>
  <line x1="72" y1="390" x2="72" y2="430" stroke="#b8935a" stroke-width="3"/>
  <text x="96" y="389" font-size="24" font-weight="700" fill="#1a365d">当日</text>
  <text x="250" y="389" font-size="24" fill="#22201c">搬入し、正面を決めて飾る</text>
  <rect x="30" y="420" width="740" height="58" rx="10" fill="#f3f0ea"/>
  <circle cx="72" cy="449" r="9" fill="#b8935a"/>
  <text x="96" y="457" font-size="24" font-weight="700" fill="#1a365d">会期後</text>
  <text x="250" y="457" font-size="24" fill="#22201c">搬出し、半日陰で休ませる</text>
</svg>
