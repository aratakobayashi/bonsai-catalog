<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の4つの増やし方</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">盆栽の4つの増やし方</text>
  <!-- 実生 -->
  <rect x="20" y="72" width="178" height="300" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="44" y="190" width="130" height="50" fill="#e3d2b4"/>
  <line x1="109" y1="190" x2="109" y2="150" stroke="#5b7f4a" stroke-width="5"/>
  <path d="M109 152 c -26 -6 -34 -20 -30 -28 c 14 2 26 12 30 28 z M109 152 c 26 -6 34 -20 30 -28 c -14 2 -26 12 -30 28 z" fill="#5b7f4a"/>
  <ellipse cx="109" cy="212" rx="10" ry="7" fill="#8b6b4a"/>
  <text x="109" y="282" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">実生</text>
  <text x="109" y="318" text-anchor="middle" font-size="22" fill="#22201c">種から</text>
  <text x="109" y="350" text-anchor="middle" font-size="22" fill="#b4573a">性質がばらつく</text>
  <!-- 挿し木 -->
  <rect x="214" y="72" width="178" height="300" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="238" y="190" width="130" height="50" fill="#e3d2b4"/>
  <line x1="303" y1="236" x2="303" y2="120" stroke="#8b6b4a" stroke-width="6"/>
  <ellipse cx="288" cy="132" rx="16" ry="8" fill="#5b7f4a"/><ellipse cx="318" cy="122" rx="16" ry="8" fill="#5b7f4a"/>
  <path d="M303 222 l-16 14 M303 226 l16 12" stroke="#b8935a" stroke-width="3"/>
  <text x="303" y="282" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">挿し木</text>
  <text x="303" y="318" text-anchor="middle" font-size="22" fill="#22201c">枝を土に挿す</text>
  <text x="303" y="350" text-anchor="middle" font-size="22" fill="#5b7f4a">親と同じ性質</text>
  <!-- 接ぎ木 -->
  <rect x="408" y="72" width="178" height="300" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <line x1="497" y1="240" x2="497" y2="176" stroke="#8b6b4a" stroke-width="12"/>
  <line x1="497" y1="176" x2="497" y2="110" stroke="#5b7f4a" stroke-width="8"/>
  <rect x="485" y="168" width="24" height="16" fill="#b8935a"/>
  <text x="530" y="150" font-size="22" fill="#5b7f4a">穂</text>
  <text x="530" y="222" font-size="22" fill="#8b6b4a">台木</text>
  <text x="497" y="282" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">接ぎ木</text>
  <text x="497" y="318" text-anchor="middle" font-size="22" fill="#22201c">別の根につなぐ</text>
  <text x="497" y="350" text-anchor="middle" font-size="22" fill="#5b7f4a">品種を残せる</text>
  <!-- 取り木 -->
  <rect x="602" y="72" width="178" height="300" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <line x1="660" y1="240" x2="660" y2="100" stroke="#8b6b4a" stroke-width="12"/>
  <path d="M660 190 L730 130" stroke="#8b6b4a" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="704" cy="152" rx="22" ry="16" fill="#b8935a"/>
  <ellipse cx="736" cy="122" rx="20" ry="10" fill="#5b7f4a"/>
  <text x="691" y="282" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">取り木</text>
  <text x="691" y="318" text-anchor="middle" font-size="22" fill="#22201c">枝に根を出す</text>
  <text x="691" y="350" text-anchor="middle" font-size="22" fill="#5b7f4a">太い枝ごと</text>
  <rect x="20" y="392" width="760" height="62" rx="14" fill="#1a365d"/>
  <text x="400" y="432" text-anchor="middle" font-size="25" font-weight="700" fill="#faf9f6">挿し木・接ぎ木・取り木は、親と同じ性質の樹になる</text>
</svg>
