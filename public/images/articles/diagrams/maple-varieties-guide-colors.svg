  <text x="505" y="254" text-anchor="middle" font-size="23" fill="#22201c">緑</text>
  <use href="#mv-lf" fill="#b4573a" transform="translate(654 206) scale(2.1) rotate(-14)"/>
  <use href="#mv-lf" fill="#d9a640" transform="translate(708 212) scale(1.8) rotate(16)"/>
  <text x="680" y="254" text-anchor="middle" font-size="23" fill="#22201c">赤・黄</text>
  <rect x="20" y="294" width="760" height="200" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="44" y="404" font-size="27" font-weight="700" fill="#22201c">野村もみじ</text>
