<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>愛好会での最初の1年の歩み</title>
  <rect width="800" height="430" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">最初の1年の歩み</text>
  <g>
    <rect x="20" y="76" width="170" height="250" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <circle cx="105" cy="124" r="26" fill="#1a365d"/><text x="105" y="133" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">1</text>
    <text x="105" y="196" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">初参加</text>
    <text x="105" y="240" text-anchor="middle" font-size="22" fill="#22201c">見学のつもりで</text>
    <text x="105" y="272" text-anchor="middle" font-size="22" fill="#22201c">話を聞く</text>
    <text x="105" y="304" text-anchor="middle" font-size="22" fill="#22201c">名前を覚える</text>
  </g>
  <g>
    <rect x="210" y="76" width="170" height="250" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <circle cx="295" cy="124" r="26" fill="#1a365d"/><text x="295" y="133" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">2</text>
    <text x="295" y="196" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">作業を見る</text>
    <text x="295" y="240" text-anchor="middle" font-size="22" fill="#22201c">例会の実演</text>
    <text x="295" y="272" text-anchor="middle" font-size="22" fill="#22201c">道具の使い方</text>
    <text x="295" y="304" text-anchor="middle" font-size="22" fill="#22201c">季節の作業</text>
  </g>
  <g>
    <rect x="400" y="76" width="170" height="250" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <circle cx="485" cy="124" r="26" fill="#1a365d"/><text x="485" y="133" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">3</text>
    <text x="485" y="196" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">相談する</text>
    <text x="485" y="240" text-anchor="middle" font-size="22" fill="#22201c">自分の樹を</text>
    <text x="485" y="272" text-anchor="middle" font-size="22" fill="#22201c">持っていく</text>
    <text x="485" y="304" text-anchor="middle" font-size="22" fill="#22201c">手直しを見る</text>
  </g>
  <g>
    <rect x="590" y="76" width="190" height="250" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
    <circle cx="685" cy="124" r="26" fill="#5b7f4a"/><text x="685" y="133" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">4</text>
    <text x="685" y="196" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">手伝う</text>
    <text x="685" y="240" text-anchor="middle" font-size="22" fill="#22201c">展示会の準備</text>
    <text x="685" y="272" text-anchor="middle" font-size="22" fill="#22201c">や当番</text>
  </g>
  <g fill="#b8935a">
    <path d="M192 196 l14 10 l-14 10 z"/><path d="M382 196 l14 10 l-14 10 z"/><path d="M572 196 l14 10 l-14 10 z"/>
  </g>
  <rect x="20" y="346" width="760" height="64" rx="14" fill="#1a365d"/>
  <text x="400" y="388" text-anchor="middle" font-size="26" font-weight="700" fill="#faf9f6">急がず、季節をひと回り経験する</text>
</svg>
