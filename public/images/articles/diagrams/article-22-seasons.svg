  <title>盆栽展で見られるものの季節の目安。梅などの早春の花は1月中旬〜3月、春の花ものは3月中旬〜5月、さつきは5月下旬〜6月、小品や山野草は春と秋、紅葉と実ものは10〜12月、正月飾りや鉢市は12月〜1月</title>
