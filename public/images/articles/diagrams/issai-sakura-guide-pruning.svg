<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>一才桜の花芽と葉芽、花後に切る位置</title>
  <defs>
    <path id="sk-lb" d="M0 0 q-7 -10 0 -24 q7 14 0 24 z"/>
  </defs>
  <rect width="800" height="500" fill="#faf9f6"/>
  <rect x="20" y="20" width="760" height="350" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <!-- 枝 -->
  <path d="M60 330 Q300 300 720 120" stroke="#6f5439" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- 短い枝と花芽 -->
  <g stroke="#6f5439" stroke-width="6" stroke-linecap="round">
    <line x1="200" y1="308" x2="190" y2="268"/>
    <line x1="330" y1="285" x2="330" y2="245"/>
  </g>
  <g fill="#b8935a">
    <circle cx="180" cy="258" r="13"/><circle cx="200" cy="254" r="13"/><circle cx="190" cy="236" r="12"/>
    <circle cx="320" cy="234" r="13"/><circle cx="340" cy="232" r="13"/><circle cx="330" cy="214" r="12"/>
  </g>
  <!-- 葉芽 -->
  <g fill="#5b7f4a">
    <use href="#sk-lb" transform="translate(470 238) rotate(-20) scale(1.7)"/>
    <use href="#sk-lb" transform="translate(560 196) rotate(-25) scale(1.7)"/>
    <use href="#sk-lb" transform="translate(650 158) rotate(-25) scale(1.7)"/>
  </g>
  <!-- 切る位置 -->
  <line x1="580" y1="150" x2="616" y2="214" stroke="#1a365d" stroke-width="5" stroke-dasharray="10 7"/>
  <text x="600" y="262" text-anchor="middle" font-size="24" font-weight="700" fill="#1a365d">ここで切る</text>
  <text x="600" y="294" text-anchor="middle" font-size="22" fill="#1a365d">葉芽の少し上</text>
  <text x="140" y="190" font-size="25" font-weight="700" fill="#8b6b4a">花芽（丸い）</text>
  <text x="350" y="170" font-size="25" font-weight="700" fill="#5b7f4a">葉芽（細い）</text>
  <text x="44" y="62" font-size="26" font-weight="700" fill="#22201c">花が終わった直後</text>
  <!-- 注意 -->
  <rect x="20" y="390" width="760" height="90" rx="14" fill="#f3f0ea" stroke="#8b6b4a" stroke-width="2"/>
  <g stroke="#8b6b4a" stroke-width="5" stroke-linecap="round">
    <line x1="46" y1="422" x2="72" y2="448"/><line x1="72" y1="422" x2="46" y2="448"/>
  </g>
  <text x="90" y="445" font-size="25" fill="#22201c">秋〜冬に枝先を切る → 花芽も落ちる</text>
</svg>
