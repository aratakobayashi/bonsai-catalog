<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>剪定で元から切ることが多い枝。真上に伸びる立ち枝、下を向く下がり枝、幹のほうへ戻る逆さ枝、ほかの枝と交差する交差枝、同じ高さから何本も出る車枝、勢いよく長く伸びる徒長枝</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">切ることが多い枝</text>

  <!-- 幹と良い枝 -->
  <g stroke="#6f5439" stroke-linecap="round" fill="none">
    <path d="M300 460 C290 400 310 340 300 280 C294 230 304 180 300 120" stroke-width="18"/>
    <path d="M298 380 L170 350" stroke-width="7"/>
    <path d="M302 300 L430 270" stroke-width="7"/>
    <path d="M300 220 L200 196" stroke-width="6"/>
  </g>
  <!-- 忌み枝 -->
  <g stroke="#b4573a" stroke-linecap="round" fill="none" stroke-width="5">
    <path d="M220 362 L216 290"/>
    <path d="M380 282 L420 340"/>
    <path d="M190 352 Q150 330 210 320 L262 316"/>
    <path d="M300 250 L380 200 M330 232 L300 190"/>
    <path d="M302 300 L360 320 M302 300 L250 316"/>
    <path d="M300 140 Q340 80 400 70"/>
  </g>
  <g fill="#b4573a">
    <circle cx="216" cy="290" r="6"/><circle cx="420" cy="340" r="6"/><circle cx="262" cy="316" r="6"/>
    <circle cx="350" cy="220" r="6"/><circle cx="360" cy="320" r="6"/><circle cx="400" cy="70" r="6"/>
  </g>
  <path d="M250 460 q50 -20 100 0 z" fill="#6f5439"/>

  <!-- ラベル -->
  <g stroke="#b4573a" stroke-width="2" stroke-dasharray="5 4">
    <line x1="216" y1="290" x2="110" y2="280"/>
    <line x1="420" y1="340" x2="520" y2="360"/>
    <line x1="190" y1="340" x2="110" y2="400"/>
    <line x1="350" y1="220" x2="520" y2="210"/>
    <line x1="360" y1="320" x2="520" y2="290"/>
    <line x1="400" y1="70" x2="520" y2="110"/>
  </g>
  <g font-size="24" font-weight="700" fill="#22201c">
    <text x="20" y="276">立ち枝</text>
    <text x="20" y="410">逆さ枝</text>
    <text x="530" y="118">徒長枝</text>
    <text x="530" y="218">交差枝</text>
    <text x="530" y="298">車枝</text>
    <text x="530" y="368">下がり枝</text>
  </g>
  <g font-size="22" fill="#6b655b">
    <text x="20" y="306">真上に伸びる</text>
    <text x="20" y="440">幹へ戻る</text>
    <text x="530" y="148">長く勢いが強い</text>
    <text x="530" y="248">ほかの枝と交わる</text>
    <text x="606" y="298">1か所から</text>
    <text x="530" y="398">下を向く</text>
  </g>
  <rect x="530" y="430" width="250" height="50" rx="10" fill="#f3f0ea"/>
  <text x="655" y="463" text-anchor="middle" font-size="22" fill="#22201c"><tspan fill="#b4573a" font-weight="700">赤</tspan>：元から切る候補</text>
</svg>
