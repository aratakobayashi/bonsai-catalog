<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 472" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽園でのマナー。してよいことと避けたいこと</title>
  <rect width="800" height="472" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">盆栽園でのマナー</text>
  <rect x="24" y="80" width="368" height="330" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="408" y="80" width="368" height="330" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <circle cx="64" cy="124" r="13" fill="none" stroke="#5b7f4a" stroke-width="5"/>
  <text x="92" y="133" font-size="26" font-weight="700" fill="#5b7f4a">してよいこと</text>
  <g stroke="#8b6b4a" stroke-width="5" stroke-linecap="round"><line x1="437" y1="113" x2="459" y2="135"/><line x1="459" y1="113" x2="437" y2="135"/></g>
  <text x="476" y="133" font-size="26" font-weight="700" fill="#8b6b4a">避けたいこと</text>
  <text x="52" y="200" font-size="22" fill="#2c2a26">・入るときに一声かける</text>
  <text x="52" y="256" font-size="22" fill="#2c2a26">・撮影は先に確かめる</text>
  <text x="52" y="312" font-size="22" fill="#2c2a26">・通路をあけて見る</text>
  <text x="52" y="368" font-size="22" fill="#2c2a26">・分からない樹は聞く</text>
  <text x="436" y="200" font-size="22" fill="#2c2a26">・鉢や枝に触る</text>
  <text x="436" y="256" font-size="22" fill="#2c2a26">・棚に荷物を置く</text>
  <text x="436" y="312" font-size="22" fill="#2c2a26">・水やり中に近づく</text>
  <text x="436" y="368" font-size="22" fill="#2c2a26">・無断で写真を投稿</text>
<text x="776" y="456" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
