  <rect x="329.8" y="340" width="112" height="36" rx="8" fill="#1a365d"/>  <text x="386" y="366" font-size="22" font-weight="700" fill="#faf9f6" text-anchor="middle">母の日</text>
  <text x="780" y="366" font-size="22" fill="#6b655b" text-anchor="end">薄い色＝つぼみ</text>

