  <line x1="265.0" y1="108" x2="265.0" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="317.5" y1="108" x2="317.5" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="370.0" y1="108" x2="370.0" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="422.5" y1="108" x2="422.5" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="475.0" y1="108" x2="475.0" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="527.5" y1="108" x2="527.5" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="580.0" y1="108" x2="580.0" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="632.5" y1="108" x2="632.5" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="685.0" y1="108" x2="685.0" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <line x1="737.5" y1="108" x2="737.5" y2="326" stroke="#ebe7df" stroke-width="1.5"/>
  <text x="34" y="141" font-size="24" font-weight="700" fill="#22201c">長寿梅</text>
  <rect x="244.0" y="119" width="105.0" height="28" rx="6" fill="#b8935a" fill-opacity="1"/>
  <text x="34" y="197" font-size="24" font-weight="700" fill="#22201c">姫リンゴ</text>
  <rect x="317.5" y="175" width="52.5" height="28" rx="6" fill="#b8935a" fill-opacity="1"/>
  <rect x="580.0" y="175" width="131.2" height="28" rx="6" fill="#8b6b4a" fill-opacity="0.55"/>
