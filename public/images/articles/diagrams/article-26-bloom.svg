<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>母の日のころに楽しめる花の時期。長寿梅は2月下旬〜4月、姫リンゴは4月に花が咲き秋に実がなる、藤は4月中旬〜5月上旬、さつきは5月下旬〜6月で母の日のころはつぼみ</title>
  <rect width="800" height="396" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">花の時期と母の日</text>
  <text x="780" y="44" font-size="22" fill="#6b655b" text-anchor="end">関東の平地の目安</text>
  <text x="186" y="94" font-size="22" fill="#22201c" text-anchor="middle">1</text>
  <text x="239" y="94" font-size="22" fill="#22201c" text-anchor="middle">2</text>
  <text x="291" y="94" font-size="22" fill="#22201c" text-anchor="middle">3</text>
  <text x="344" y="94" font-size="22" fill="#22201c" text-anchor="middle">4</text>
  <text x="396" y="94" font-size="22" fill="#22201c" text-anchor="middle">5</text>
  <text x="449" y="94" font-size="22" fill="#22201c" text-anchor="middle">6</text>
  <text x="501" y="94" font-size="22" fill="#22201c" text-anchor="middle">7</text>
  <text x="554" y="94" font-size="22" fill="#22201c" text-anchor="middle">8</text>
  <text x="606" y="94" font-size="22" fill="#22201c" text-anchor="middle">9</text>
  <text x="659" y="94" font-size="22" fill="#22201c" text-anchor="middle">10</text>
  <text x="711" y="94" font-size="22" fill="#22201c" text-anchor="middle">11</text>
  <text x="764" y="94" font-size="22" fill="#22201c" text-anchor="middle">12</text>
  <text x="20" y="94" font-size="22" fill="#6b655b">月</text>
  <rect x="20" y="108" width="770" height="50" rx="8" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="164" width="770" height="50" rx="8" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="220" width="770" height="50" rx="8" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="276" width="770" height="50" rx="8" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
