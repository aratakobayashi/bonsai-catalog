<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>症状と土の状態から原因を絞る</title>
  <rect width="800" height="520" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">葉の症状と土の状態から絞る</text>
  <!-- header -->
  <rect x="20" y="70" width="250" height="56" rx="10" fill="#1a365d"/>
  <rect x="280" y="70" width="240" height="56" rx="10" fill="#f3f0ea"/>
  <rect x="530" y="70" width="250" height="56" rx="10" fill="#f3f0ea"/>
  <text x="145" y="107" text-anchor="middle" font-size="24" font-weight="700" fill="#faf9f6">葉の様子</text>
  <text x="400" y="107" text-anchor="middle" font-size="24" font-weight="700" fill="#22201c">土が乾いている</text>
  <text x="655" y="107" text-anchor="middle" font-size="24" font-weight="700" fill="#22201c">土が湿ったまま</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="136" width="760" height="80" rx="10"/>
    <rect x="20" y="226" width="760" height="80" rx="10"/>
    <rect x="20" y="316" width="760" height="80" rx="10"/>
    <rect x="20" y="406" width="760" height="80" rx="10"/>
  </g>
  <g font-size="23" font-weight="700" fill="#22201c">
    <text x="40" y="185">しおれて垂れる</text>
    <text x="40" y="275">葉先が茶色く縮れる</text>
    <text x="40" y="365">下の葉から黄色く</text>
    <text x="40" y="455">葉の色が薄く間延び</text>
  </g>
  <g font-size="23" fill="#b4573a" text-anchor="middle">
    <text x="400" y="185">水切れ</text>
    <text x="400" y="275">水切れ・葉焼け</text>
    <text x="400" y="365">根詰まり</text>
  </g>
  <g font-size="23" fill="#1a365d" text-anchor="middle">
    <text x="655" y="185">根腐れ</text>
    <text x="655" y="275">肥料焼け・根の傷み</text>
    <text x="655" y="365">水のやりすぎ</text>
  </g>
  <text x="527" y="455" text-anchor="middle" font-size="23" fill="#5b7f4a">日照不足（室内・日陰）</text>
  <text x="20" y="510" font-size="22" fill="#6b655b">原因が重なることもあります。置き場所もあわせて見直します</text>
</svg>
