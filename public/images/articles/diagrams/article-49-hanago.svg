<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>皐月の花後の手入れ：花がらを付け根から摘む、1か所から出た新芽を2本ほどに整理する、7月以降は枝先に花芽ができるので強く切らない</title>
  <defs>
    <ellipse id="lf" cx="12" cy="0" rx="12" ry="5.5"/>
  </defs>
  <rect width="800" height="470" fill="#faf9f6"/>

  <!-- ① 花がら摘み -->
  <rect x="20" y="20" width="244" height="430" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="142" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">① 花がらを摘む</text>
  <line x1="142" y1="380" x2="142" y2="210" stroke="#6f5439" stroke-width="5" stroke-linecap="round"/>
  <g fill="#5b7f4a">
    <use href="#lf" transform="translate(142 230) rotate(-160)"/><use href="#lf" transform="translate(142 230) rotate(-20)"/>
    <use href="#lf" transform="translate(142 236) rotate(150)"/><use href="#lf" transform="translate(142 236) rotate(30)"/>
  </g>
  <g fill="#b4573a" opacity="0.55">
    <path d="M142 205 l-36 -40 q36 -30 72 0 z"/>
  </g>
  <path d="M110 155 q32 -20 64 0" fill="none" stroke="#b4573a" stroke-width="3" opacity="0.55"/>
  <circle cx="142" cy="208" r="20" fill="none" stroke="#b8935a" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="142" y="428" text-anchor="middle" font-size="22" fill="#1a365d">付け根から取る</text>

  <!-- ② 芽を整理 -->
  <rect x="278" y="20" width="244" height="430" rx="14" fill="#fff" stroke="#b8935a" stroke-width="3"/>
  <text x="400" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">② 芽を2本に</text>
  <line x1="400" y1="380" x2="400" y2="260" stroke="#6f5439" stroke-width="5" stroke-linecap="round"/>
  <g stroke-linecap="round" fill="none" stroke-width="4">
    <path d="M400 262 L350 170" stroke="#5b7f4a"/>
    <path d="M400 262 L450 170" stroke="#5b7f4a"/>
    <path d="M400 262 L400 150" stroke="#5b7f4a" opacity="0.3"/>
    <path d="M400 262 L320 214" stroke="#5b7f4a" opacity="0.3"/>
    <path d="M400 262 L480 214" stroke="#5b7f4a" opacity="0.3"/>
  </g>
  <g fill="#5b7f4a">
    <use href="#lf" transform="translate(350 170) rotate(-150)"/><use href="#lf" transform="translate(350 170) rotate(-60)"/>
    <use href="#lf" transform="translate(450 170) rotate(-30)"/><use href="#lf" transform="translate(450 170) rotate(-120)"/>
  </g>
  <g stroke="#b8935a" stroke-width="3.5">
    <line x1="388" y1="200" x2="412" y2="200"/><line x1="338" y1="216" x2="350" y2="236"/><line x1="462" y1="216" x2="450" y2="236"/>
  </g>
  <text x="400" y="402" text-anchor="middle" font-size="22" fill="#b8935a">ほかは元から切る</text>
  <text x="400" y="428" text-anchor="middle" font-size="22" fill="#1a365d">伸ばす芽を残す</text>

  <!-- ③ 花芽 -->
  <rect x="536" y="20" width="244" height="430" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="658" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">③ 7月以降</text>
  <line x1="658" y1="380" x2="658" y2="260" stroke="#6f5439" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#6f5439" stroke-width="4" stroke-linecap="round"><path d="M658 262 L612 180"/><path d="M658 262 L704 180"/></g>
  <g fill="#5b7f4a">
    <use href="#lf" transform="translate(612 182) rotate(-160)"/><use href="#lf" transform="translate(612 182) rotate(-20)"/>
    <use href="#lf" transform="translate(704 182) rotate(-160)"/><use href="#lf" transform="translate(704 182) rotate(-20)"/>
  </g>
  <g fill="#b8935a"><ellipse cx="612" cy="170" rx="8" ry="12"/><ellipse cx="704" cy="170" rx="8" ry="12"/></g>
  <text x="658" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#b8935a">枝先に花芽</text>
  <text x="658" y="402" text-anchor="middle" font-size="22" fill="#6b655b">翌年の花になる</text>
  <text x="658" y="428" text-anchor="middle" font-size="22" fill="#1a365d">強く切らない</text>
</svg>
