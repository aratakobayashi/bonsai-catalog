<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の鉢の中のつくり。底穴に鉢底ネットを当て、大粒の土を薄く敷き、赤玉土の小粒などで植え、針金で樹を固定する</title>
  <rect width="800" height="530" fill="#faf9f6"/>
  <text x="400" y="48" font-size="30" font-weight="700" fill="#1a365d" text-anchor="middle">鉢の中のつくり</text>
  <rect x="20" y="72" width="760" height="360" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <path d="M140 150 h380 l-30 220 h-320 z" fill="#8b6b4a"/>
  <path d="M158 160 h344 l-26 196 h-292 z" fill="#b0855a"/>
  <path d="M186 316 h288 l-6 40 h-276 z" fill="#5e4630"/>
  <rect x="300" y="356" width="60" height="14" fill="#fff"/>
  <rect x="292" y="346" width="76" height="8" fill="#6b655b"/>
  <path d="M300 352 q-20 -140 0 -190 M360 352 q20 -140 0 -190" stroke="#b8935a" stroke-width="4" fill="none"/>
  <path d="M330 162 q-3.7199999999999998 -24.8 2.48 -49.6" stroke="#6f5439" stroke-width="5.58" fill="none" stroke-linecap="round"/>
  <g fill="#5b7f4a"><ellipse cx="331.24" cy="104.96000000000001" rx="28.52" ry="16.12"/><ellipse cx="306.44" cy="123.56" rx="21.08" ry="11.16"/><ellipse cx="356.04" cy="126.03999999999999" rx="19.84" ry="10.54"/></g>
  <text x="560" y="200" font-size="24" font-weight="700" fill="#22201c">赤玉土の小粒など</text>
  <path d="M554 192 h-70" stroke="#22201c" stroke-width="2"/>
  <text x="560" y="280" font-size="24" font-weight="700" fill="#b8935a">固定用の針金</text>
  <path d="M554 272 h-178" stroke="#22201c" stroke-width="2"/>
  <text x="560" y="340" font-size="24" font-weight="700" fill="#22201c">大粒の土（ゴロ土）</text>
  <path d="M554 332 h-90" stroke="#22201c" stroke-width="2"/>
  <text x="560" y="396" font-size="24" font-weight="700" fill="#22201c">鉢底ネット</text>
  <path d="M554 388 q-100 0 -186 -34" stroke="#22201c" stroke-width="2" fill="none"/>
  <rect x="20" y="448" width="760" height="62" rx="14" fill="#1a365d"/>
  <text x="400" y="488.36" font-size="26" font-weight="700" fill="#faf9f6" text-anchor="middle">底穴のない容器は、水がたまるので使わない</text>

</svg>
