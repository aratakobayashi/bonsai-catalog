<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>屋外向きの樹は、ふだんはベランダで育て、室内には2〜3日飾ってから外へ戻す。ガジュマルなど室内向きの樹は、明るい窓辺に置いたまま育てられる</title>
  <rect width="800" height="440" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">育てる場所と飾る場所</text>

  <rect x="20" y="70" width="300" height="230" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <text x="170" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">ベランダ</text>
  <text x="170" y="146" text-anchor="middle" font-size="22" fill="#5b7f4a">ふだん育てる</text>
  <g>
    <circle cx="96" cy="200" r="22" fill="#b8935a"/>
    <path d="M150 262 h56 l-6 -18 h-44 z" fill="#8b6b4a"/>
    <path d="M178 246 q-6 -26 4 -46" stroke="#6f5439" stroke-width="5" fill="none"/>
    <ellipse cx="180" cy="200" rx="30" ry="14" fill="#5b7f4a"/>
    <rect x="120" y="262" width="150" height="10" fill="#c9b48f"/>
  </g>

  <rect x="480" y="70" width="300" height="230" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="630" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">室内</text>
  <text x="630" y="146" text-anchor="middle" font-size="22" fill="#1a365d">見せたいときに飾る</text>
  <g>
    <rect x="560" y="262" width="140" height="10" fill="#c9b48f"/>
    <path d="M602 262 h56 l-6 -18 h-44 z" fill="#8b6b4a"/>
    <path d="M630 246 q-6 -26 4 -46" stroke="#6f5439" stroke-width="5" fill="none"/>
    <ellipse cx="632" cy="200" rx="30" ry="14" fill="#5b7f4a"/>
  </g>

  <!-- 矢印 -->
  <path d="M336 150 h120" stroke="#b8935a" stroke-width="6" stroke-linecap="round"/>
  <path d="M440 136 l18 14 l-18 14" fill="none" stroke="#b8935a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#b8935a">2〜3日</text>
  <path d="M464 230 h-120" stroke="#1a365d" stroke-width="6" stroke-linecap="round"/>
  <path d="M360 216 l-18 14 l18 14" fill="none" stroke="#1a365d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="274" text-anchor="middle" font-size="22" font-weight="700" fill="#1a365d">外へ戻す</text>

  <rect x="20" y="322" width="760" height="98" rx="14" fill="#f3f0ea"/>
  <text x="400" y="362" text-anchor="middle" font-size="24" font-weight="700" fill="#22201c">ガジュマルなど室内向きの樹</text>
  <text x="400" y="398" text-anchor="middle" font-size="22" fill="#6b655b">明るい窓辺に置いたまま育てられる</text>
</svg>
