  <text x="780" y="44" font-size="22" fill="#6b655b" text-anchor="end">関東の平地の目安</text>
  <text x="205" y="94" font-size="22" fill="#22201c" text-anchor="middle">1</text>
  <text x="256" y="94" font-size="22" fill="#22201c" text-anchor="middle">2</text>
  <text x="307" y="94" font-size="22" fill="#22201c" text-anchor="middle">3</text>
