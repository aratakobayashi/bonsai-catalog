<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 524" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>姫リンゴの盆栽の年間作業カレンダー。植え替えは2月下旬〜3月、開花と受粉は4月、摘果は5〜6月、肥料は花後〜6月と9月中旬〜10月、花芽ができるのは7〜8月、実の色づきは9〜11月、剪定は12〜2月と6月に軽く</title>
  <rect width="800" height="524" fill="#faf9f6"/>
