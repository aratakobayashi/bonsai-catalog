  <text x="34" y="365" font-size="24" font-weight="700" fill="#22201c">花芽ができる</text>
  <rect x="485.0" y="343" width="101.7" height="28" rx="6" fill="#5b7f4a" fill-opacity="0.4"/>
  <text x="34" y="421" font-size="24" font-weight="700" fill="#22201c">実の色づき</text>
  <rect x="586.7" y="399" width="152.5" height="28" rx="6" fill="#8b6b4a" fill-opacity="0.55"/>
  <text x="34" y="477" font-size="24" font-weight="700" fill="#22201c">剪定</text>
  <rect x="180.0" y="455" width="101.7" height="28" rx="6" fill="#1a365d" fill-opacity="1"/>
  <rect x="739.2" y="455" width="50.8" height="28" rx="6" fill="#1a365d" fill-opacity="1"/>
  <rect x="434.2" y="455" width="50.8" height="28" rx="6" fill="#1a365d" fill-opacity="0.35"/>
  <text x="460" y="477" font-size="22" fill="#1a365d" text-anchor="middle">軽く</text>

