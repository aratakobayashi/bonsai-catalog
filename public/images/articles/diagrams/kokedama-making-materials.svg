<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>苔玉作りに用意するもの</title>
  <rect width="800" height="440" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">苔玉作りに用意するもの</text>
  <text x="24" y="84" font-size="20" fill="#6b655b">材料は4つ。苗・土・苔・糸がそろったキットもあります</text>
  <!-- 1 苗 -->
  <rect x="22" y="110" width="178" height="220" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <path d="M86 236 h50 l-6 46 h-38 z" fill="#3a3731"/>
  <path d="M111 236 v-40" stroke="#5b7f4a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="96" cy="196" rx="20" ry="11" fill="#5b7f4a" transform="rotate(-25 96 196)"/>
  <ellipse cx="128" cy="186" rx="20" ry="11" fill="#6f9558" transform="rotate(20 128 186)"/>
  <ellipse cx="110" cy="170" rx="16" ry="9" fill="#5b7f4a"/>
  <text x="111" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">植物の苗</text>
  <!-- 2 土 -->
  <rect x="214" y="110" width="178" height="220" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <ellipse cx="270" cy="240" rx="40" ry="26" fill="#3b2f25"/>
  <ellipse cx="338" cy="246" rx="32" ry="20" fill="#b9774a"/>
  <circle cx="330" cy="240" r="4" fill="#d79b6c"/><circle cx="344" cy="250" r="4" fill="#d79b6c"/><circle cx="350" cy="238" r="3" fill="#d79b6c"/>
  <text x="303" y="190" text-anchor="middle" font-size="17" fill="#6b655b">ケト土7：赤玉土3</text>
  <text x="303" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">土</text>
  <!-- 3 苔 -->
  <rect x="406" y="110" width="178" height="220" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="436" y="206" width="118" height="56" rx="12" fill="#6f9558"/>
  <path d="M440 214 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q8 -12 12 0" fill="none" stroke="#86ad6c" stroke-width="5" stroke-linecap="round"/>
  <text x="495" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">苔（ハイゴケ）</text>
  <!-- 4 糸 -->
  <rect x="598" y="110" width="180" height="220" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="660" y="196" width="56" height="70" rx="8" fill="#e8e1d3"/>
  <path d="M664 208 h48 M664 220 h48 M664 232 h48 M664 244 h48 M664 256 h48" stroke="#b8935a" stroke-width="4"/>
  <path d="M716 230 q24 4 18 30" fill="none" stroke="#b8935a" stroke-width="3"/>
  <text x="688" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a26">糸</text>
  <text x="24" y="376" font-size="20" fill="#2c2a26">そのほか：水を張ったバケツ・はさみ・ゴム手袋・新聞紙</text>
  <text x="24" y="410" font-size="18" fill="#6b655b">苗は2.5〜3号（直径7.5〜9cm）のポットが扱いやすい大きさです</text>
  <text x="776" y="428" text-anchor="end" font-size="15" fill="#b8935a" letter-spacing="2">盆栽コレクション</text>
</svg>
