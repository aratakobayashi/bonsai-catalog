  <title>老鴉柿は雌木と雄木が別。雌木だけでは実がつきにくく、花の時期に雄木を近くに置くと実がつきやすい</title>
  <rect width="800" height="418" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">老鴉柿（ロウヤガキ）は雌木と雄木が別</text>
