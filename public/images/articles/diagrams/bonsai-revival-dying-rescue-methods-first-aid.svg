<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>原因別の応急処置</title>
  <rect width="800" height="540" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">原因別の応急処置</text>

  <rect x="20" y="74" width="374" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="20" y="74" width="374" height="54" rx="14" fill="#4f86b5"/>
  <rect x="20" y="110" width="374" height="18" fill="#4f86b5"/>
  <text x="207" y="111" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">水切れ</text>
  <text x="44" y="172" font-size="23" fill="#2c2a26">・鉢ごと水に沈める</text>
  <text x="44" y="210" font-size="23" fill="#2c2a26">・明るい日陰で休ませる</text>
  <text x="44" y="248" font-size="23" fill="#5b7f4a" font-weight="700">水を与える</text>

  <rect x="406" y="74" width="374" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="406" y="74" width="374" height="54" rx="14" fill="#8b6b4a"/>
  <rect x="406" y="110" width="374" height="18" fill="#8b6b4a"/>
  <text x="593" y="111" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">根腐れ</text>
  <text x="430" y="172" font-size="23" fill="#2c2a26">・受け皿を外し、乾かす</text>
  <text x="430" y="210" font-size="23" fill="#2c2a26">・適期なら植え替え</text>
  <text x="430" y="248" font-size="23" fill="#8b6b4a" font-weight="700">水を控える</text>

  <rect x="20" y="284" width="374" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="20" y="284" width="374" height="54" rx="14" fill="#b8935a"/>
  <rect x="20" y="320" width="374" height="18" fill="#b8935a"/>
  <text x="207" y="321" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">葉焼け</text>
  <text x="44" y="382" font-size="23" fill="#2c2a26">・半日陰へ移す</text>
  <text x="44" y="420" font-size="23" fill="#2c2a26">・少しずつ日に慣らす</text>
  <text x="44" y="458" font-size="23" fill="#5b7f4a" font-weight="700">水やりは普段どおり</text>

  <rect x="406" y="284" width="374" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="406" y="284" width="374" height="54" rx="14" fill="#5b7f4a"/>
  <rect x="406" y="320" width="374" height="18" fill="#5b7f4a"/>
  <text x="593" y="321" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">肥料のやりすぎ</text>
  <text x="430" y="382" font-size="23" fill="#2c2a26">・置き肥を取り除く</text>
  <text x="430" y="420" font-size="23" fill="#2c2a26">・水を何度か流す</text>
  <text x="430" y="458" font-size="23" fill="#8b6b4a" font-weight="700">肥料は1〜2か月休む</text>
<text x="776" y="524" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
