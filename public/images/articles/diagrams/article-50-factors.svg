<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の値段を左右するところ。幹の太さと太り方、根張り、枝の数と配置、鉢、そして仕立てにかかった年数と樹種</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">値段を左右するところ</text>

  <!-- 樹 -->
  <g fill="#5b7f4a">
    <ellipse cx="300" cy="140" rx="70" ry="30"/><ellipse cx="196" cy="200" rx="66" ry="26"/>
    <ellipse cx="372" cy="222" rx="70" ry="26"/><ellipse cx="236" cy="268" rx="54" ry="22"/>
  </g>
  <g stroke="#6f5439" stroke-linecap="round" fill="none">
    <path d="M290 380 C270 320 300 280 290 230 C284 200 296 170 300 150" stroke-width="22"/>
    <path d="M286 300 L240 270" stroke-width="8"/><path d="M290 250 L370 222" stroke-width="8"/><path d="M290 214 L200 200" stroke-width="7"/>
  </g>
  <path d="M244 384 q46 -26 92 0 z" fill="#6f5439"/>
  <!-- 鉢 -->
  <path d="M170 384 h240 l-18 52 h-204 z" fill="#8b6b4a"/>
  <rect x="160" y="378" width="260" height="12" rx="4" fill="#6f5439"/>

  <!-- 引き出し線 -->
  <g stroke="#1a365d" stroke-width="2.5" fill="#1a365d">
    <line x1="306" y1="320" x2="470" y2="320"/><circle cx="306" cy="320" r="5"/>
    <line x1="330" y1="380" x2="470" y2="388"/><circle cx="330" cy="380" r="5"/>
    <line x1="372" y1="222" x2="470" y2="200"/><circle cx="372" cy="222" r="5"/>
    <line x1="400" y1="420" x2="470" y2="448"/><circle cx="400" cy="420" r="5"/>
  </g>
  <g font-size="24" font-weight="700" fill="#22201c">
    <text x="480" y="208">枝の数と配置</text>
    <text x="480" y="328">幹の太さ・太り方</text>
    <text x="480" y="396">根張り</text>
    <text x="480" y="456">鉢</text>
  </g>
  <g font-size="22" fill="#6b655b">
    <text x="480" y="240">細かく、偏りがない</text>
    <text x="480" y="360">下ほど太く、上へ細く</text>
    <text x="518" y="456">作家物や古い鉢は高め</text>
  </g>
  <rect x="470" y="84" width="310" height="72" rx="12" fill="#f3f0ea"/>
  <text x="625" y="114" text-anchor="middle" font-size="22" fill="#22201c">見えない要素：</text>
  <text x="625" y="144" text-anchor="middle" font-size="22" font-weight="700" fill="#1a365d">育てた年数と樹種</text>
</svg>
