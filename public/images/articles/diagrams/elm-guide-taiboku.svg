<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>大木らしく見える3つの条件</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">大木らしく見える3つの条件</text>

  <!-- 樹冠 -->
  <path d="M90 250 Q100 120 250 96 Q400 120 410 250 Z" fill="#5b7f4a" fill-opacity="0.25"/>
  <!-- 枝 -->
  <g stroke="#6f5439" stroke-linecap="round" fill="none">
    <path d="M250 300 L140 236" stroke-width="9"/>
    <path d="M250 300 L362 230" stroke-width="9"/>
    <path d="M250 250 L180 160" stroke-width="6"/>
    <path d="M250 250 L322 160" stroke-width="6"/>
    <path d="M140 236 L110 200 M140 236 L150 196 M362 230 L392 196 M362 230 L350 192" stroke-width="4"/>
    <path d="M180 160 L160 128 M180 160 L196 126 M322 160 L304 126 M322 160 L342 128" stroke-width="3"/>
    <path d="M110 200 l-8 -16 M110 200 l8 -16 M150 196 l-6 -16 M150 196 l8 -14 M392 196 l8 -16 M392 196 l-8 -16 M350 192 l-6 -16 M350 192 l8 -14 M160 128 l-6 -12 M196 126 l6 -12 M304 126 l-6 -12 M342 128 l6 -12" stroke-width="2"/>
  </g>
  <!-- 幹：根元が太く上に細る -->
  <path d="M206 410 Q222 340 236 250 L242 140 L258 140 L264 250 Q278 340 294 410 Z" fill="#6f5439"/>
  <!-- 根張り -->
  <path d="M130 414 Q180 400 206 380 L294 380 Q320 400 370 414 Z" fill="#6f5439"/>
  <line x1="90" y1="414" x2="410" y2="414" stroke="#8b6b4a" stroke-width="4"/>
  <rect x="120" y="414" width="260" height="34" rx="4" fill="#8b6b4a"/>

  <!-- ラベル -->
  <g fill="#1a365d" font-size="26" font-weight="700">
    <circle cx="470" cy="150" r="20" fill="#b8935a"/><text x="470" y="159" text-anchor="middle" fill="#fff" font-size="24">3</text>
    <circle cx="470" cy="270" r="20" fill="#b8935a"/><text x="470" y="279" text-anchor="middle" fill="#fff" font-size="24">2</text>
    <circle cx="470" cy="390" r="20" fill="#b8935a"/><text x="470" y="399" text-anchor="middle" fill="#fff" font-size="24">1</text>
  </g>
  <g stroke="#b8935a" stroke-width="2.5" stroke-dasharray="6 6">
    <line x1="400" y1="160" x2="448" y2="150"/>
    <line x1="290" y1="300" x2="448" y2="270"/>
    <line x1="350" y1="408" x2="448" y2="390"/>
  </g>
  <g font-size="26" font-weight="700" fill="#22201c">
    <text x="502" y="146">枝の細かさ</text>
    <text x="502" y="266">幹の細り方</text>
    <text x="502" y="386">根張り</text>
  </g>
  <g font-size="22" fill="#6b655b">
    <text x="502" y="178">枝先ほど細かく分かれる</text>
    <text x="502" y="298">根元が太く、上へ細る</text>
    <text x="502" y="418">四方に太い根が張る</text>
  </g>
</svg>
