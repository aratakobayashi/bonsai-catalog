<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽が海外に広まった主な節目</title>
  <rect width="800" height="440" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">海外に広まった主な節目</text>
  <line x1="60" y1="100" x2="60" y2="410" stroke="#b8935a" stroke-width="4"/>
  <g fill="#1a365d"><circle cx="60" cy="110" r="12"/><circle cx="60" cy="190" r="12"/><circle cx="60" cy="270" r="12"/><circle cx="60" cy="350" r="12"/></g>
  <g font-size="26" font-weight="700" fill="#1a365d">
    <text x="90" y="119">19世紀後半</text>
    <text x="90" y="199">1970年</text>
    <text x="90" y="279">1976年</text>
    <text x="90" y="359">1989年</text>
  </g>
  <g font-size="22" fill="#22201c">
    <text x="290" y="106">パリなどの万国博覧会で</text>
    <text x="290" y="136">ヨーロッパに紹介される</text>
    <text x="290" y="186">大阪の日本万国博覧会で</text>
    <text x="290" y="216">盆栽が展示される</text>
    <text x="290" y="266">アメリカ建国200年に</text>
    <text x="290" y="296">日本から盆栽を寄贈</text>
    <text x="290" y="346">大宮で第1回の</text>
    <text x="290" y="376">世界盆栽大会</text>
  </g>
  <g stroke="#ebe7df" stroke-width="2"><line x1="90" y1="154" x2="780" y2="154"/><line x1="90" y1="234" x2="780" y2="234"/><line x1="90" y1="314" x2="780" y2="314"/></g>
</svg>
