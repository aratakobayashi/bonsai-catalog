<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>撮影の配置を上から見た図。盆栽の後ろに無地の背景を離して置き、窓の光を斜め前から当て、カメラは正面に置く</title>
  <rect width="800" height="486" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">撮影の配置（上から見た図）</text>
  <rect x="230" y="78" width="340" height="22" rx="4" fill="#1a365d"/>
  <text x="400" y="136" font-size="22" font-weight="700" text-anchor="middle" fill="#1a365d">無地の背景（布・板）</text>
  <rect x="300" y="210" width="200" height="110" rx="10" fill="#f3f0ea" stroke="#ebe7df" stroke-width="2"/>
  <circle cx="400" cy="265" r="40" fill="#5b7f4a"/><circle cx="400" cy="265" r="12" fill="#6f5439"/>
  <text x="400" y="350" font-size="22" text-anchor="middle" fill="#22201c">台の上の盆栽</text>
  <path d="M600 104 V206" stroke="#b8935a" stroke-width="3"/><path d="M600 100 l-8 12 h16 z M600 210 l-8 -12 h16 z" fill="#b8935a"/>
  <text x="616" y="162" font-size="22" font-weight="700" fill="#22201c">背景から離す</text>
  <rect x="20" y="150" width="18" height="200" fill="#b8935a" fill-opacity="0.5"/>
  <text x="48" y="140" font-size="22" fill="#6b655b">窓</text>
  <path d="M44 190 L280 235" stroke="#b8935a" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M44 250 L280 259" stroke="#b8935a" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M44 310 L280 283" stroke="#b8935a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="60" y="400" font-size="22" font-weight="700" fill="#22201c">光は斜め前から</text>
  <text x="60" y="430" font-size="22" fill="#6b655b">（直射日光は避ける）</text>
  <rect x="364" y="420" width="72" height="44" rx="8" fill="#22201c"/><circle cx="400" cy="420" r="14" fill="#6b655b"/>
  <path d="M400 404 V330" stroke="#22201c" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="460" y="450" font-size="22" font-weight="700" fill="#22201c">カメラは正面から</text>
</svg>
