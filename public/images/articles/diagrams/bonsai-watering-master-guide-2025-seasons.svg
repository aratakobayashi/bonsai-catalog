<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>季節ごとの水やりの回数と時間帯の目安</title>
  <rect width="800" height="540" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">季節ごとの回数と時間帯</text>
  <text x="184" y="86" font-size="22" fill="#6b655b">回数の目安</text>
  <text x="590" y="86" font-size="22" fill="#6b655b">時間帯</text>

  <!-- 春 -->
  <rect x="20" y="100" width="760" height="76" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="100" width="142" height="76" rx="12" fill="#5b7f4a"/>
  <text x="91" y="134" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">春</text>
  <text x="91" y="164" text-anchor="middle" font-size="22" fill="#fff">3〜5月</text>
  <text x="184" y="148" font-size="25" fill="#22201c">1日1回</text>
  <text x="590" y="148" font-size="25" font-weight="700" fill="#1a365d">朝</text>

  <!-- 梅雨 -->
  <rect x="20" y="186" width="760" height="76" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="186" width="142" height="76" rx="12" fill="#1a365d" fill-opacity="0.7"/>
  <text x="91" y="220" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">梅雨</text>
  <text x="91" y="250" text-anchor="middle" font-size="22" fill="#fff">6〜7月上</text>
  <text x="184" y="234" font-size="25" fill="#22201c">乾いたときだけ</text>
  <text x="590" y="234" font-size="25" font-weight="700" fill="#1a365d">朝</text>

  <!-- 夏 -->
  <rect x="20" y="272" width="760" height="76" rx="12" fill="#f3f0ea" stroke="#b8935a" stroke-width="3"/>
  <rect x="20" y="272" width="142" height="76" rx="12" fill="#b8935a"/>
  <text x="91" y="306" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">夏</text>
  <text x="91" y="336" text-anchor="middle" font-size="22" fill="#fff">7〜9月上</text>
  <text x="184" y="306" font-size="25" fill="#22201c">朝1回</text>
  <text x="184" y="336" font-size="22" fill="#22201c">夕方も乾いていればもう1回</text>
  <text x="590" y="320" font-size="25" font-weight="700" fill="#1a365d">朝と夕方</text>

  <!-- 秋 -->
  <rect x="20" y="358" width="760" height="76" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="358" width="142" height="76" rx="12" fill="#8b6b4a"/>
  <text x="91" y="392" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">秋</text>
  <text x="91" y="422" text-anchor="middle" font-size="22" fill="#fff">9月中〜11月</text>
  <text x="184" y="406" font-size="25" fill="#22201c">1日1回 → 1〜2日に1回</text>
  <text x="590" y="406" font-size="25" font-weight="700" fill="#1a365d">朝</text>

  <!-- 冬 -->
  <rect x="20" y="444" width="760" height="76" rx="12" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="444" width="142" height="76" rx="12" fill="#1a365d"/>
  <text x="91" y="478" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">冬</text>
  <text x="91" y="508" text-anchor="middle" font-size="22" fill="#fff">12〜2月</text>
  <text x="184" y="478" font-size="25" fill="#22201c">2〜4日に1回程度</text>
  <text x="184" y="508" font-size="22" fill="#22201c">乾いていれば</text>
  <text x="590" y="478" font-size="25" font-weight="700" fill="#1a365d">晴れた日の</text>
  <text x="590" y="508" font-size="25" font-weight="700" fill="#1a365d">午前中</text>
</svg>
