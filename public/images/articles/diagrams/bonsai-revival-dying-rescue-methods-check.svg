<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>生きているかを確かめる3つの場所</title>
  <rect width="800" height="510" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">生きているかを確かめる</text>

  <!-- 1 枝の皮 -->
  <rect x="20" y="72" width="244" height="290" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="142" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#2c2a26">枝の皮</text>
  <rect x="44" y="140" width="196" height="24" rx="12" fill="#8b6b4a"/>
  <rect x="96" y="143" width="48" height="18" rx="9" fill="#9cc27f"/>
  <rect x="44" y="222" width="196" height="24" rx="12" fill="#8b6b4a"/>
  <rect x="96" y="225" width="48" height="18" rx="9" fill="#c9a77c"/>
  <text x="142" y="198" text-anchor="middle" font-size="22" fill="#5b7f4a" font-weight="700">緑 → 生きている</text>
  <text x="142" y="280" text-anchor="middle" font-size="22" fill="#8b6b4a" font-weight="700">茶色 → 枯れている</text>
  <text x="142" y="334" text-anchor="middle" font-size="22" fill="#2c2a26">爪で少し削る</text>

  <!-- 2 芽 -->
  <rect x="278" y="72" width="244" height="290" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="400" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#2c2a26">芽</text>
  <path d="M320 290 C360 250 400 220 470 150" stroke="#8b6b4a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="478" cy="138" rx="12" ry="20" transform="rotate(40 478 138)" fill="#5b7f4a"/>
  <ellipse cx="392" cy="214" rx="10" ry="17" transform="rotate(-20 392 214)" fill="#5b7f4a"/>
  <text x="400" y="334" text-anchor="middle" font-size="22" fill="#2c2a26">ふっくらしている</text>

  <!-- 3 根 -->
  <rect x="536" y="72" width="244" height="290" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <text x="658" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#2c2a26">根の先</text>
  <rect x="576" y="140" width="164" height="130" rx="10" fill="#e3d2b4"/>
  <g stroke="#8b6b4a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M658 140 v40 M658 180 q-30 20 -50 60 M658 180 q30 20 50 60 M658 200 v50"/>
  </g>
  <g fill="#faf7f0" stroke="#b8935a" stroke-width="2">
    <circle cx="608" cy="242" r="7"/><circle cx="708" cy="242" r="7"/><circle cx="658" cy="254" r="7"/>
  </g>
  <text x="658" y="334" text-anchor="middle" font-size="22" fill="#2c2a26">白く張りがある</text>

  <rect x="20" y="382" width="760" height="68" rx="14" fill="#a07a42"/>
  <text x="400" y="425" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">生きていれば、新しい芽が出る見込みがあります</text>
<text x="776" y="494" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
