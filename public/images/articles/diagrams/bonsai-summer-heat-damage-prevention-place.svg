<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>夏の置き場所：直置きと棚の上の比較</title>
  <defs>
    <g id="bt">
      <path d="M-40 0 h80 l-8 26 h-64 z" fill="#8b6b4a"/>
      <path d="M0 0 q-4 -30 2 -54" stroke="#6f5439" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="-64" rx="40" ry="22" fill="#5b7f4a"/>
      <ellipse cx="-28" cy="-40" rx="22" ry="13" fill="#5b7f4a"/>
      <ellipse cx="30" cy="-44" rx="22" ry="13" fill="#5b7f4a"/>
    </g>
    <g id="sun"><circle r="22" fill="#b8935a"/><g stroke="#b8935a" stroke-width="4" stroke-linecap="round"><line y1="-30" y2="-40"/><line x1="-30" x2="-40"/><line x1="30" x2="40"/><line y1="30" y2="40"/><line x1="22" y1="-22" x2="29" y2="-29"/><line x1="-22" y1="-22" x2="-29" y2="-29"/></g></g>
  </defs>
  <rect width="800" height="470" fill="#faf9f6"/>
  <!-- 悪い例 -->
  <rect x="20" y="20" width="370" height="340" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="44" y="64" font-size="28" font-weight="700" fill="#8b6b4a">直置き</text>
  <use href="#sun" x="320" y="90"/>
  <rect x="40" y="290" width="330" height="22" fill="#c9c4bb"/>
  <use href="#bt" x="130" y="264"/><use href="#bt" x="222" y="264"/>
  <g stroke="#b8935a" stroke-width="3" fill="none" stroke-dasharray="6 6"><path d="M90 286 l-14 -60"/><path d="M180 286 l0 -40"/><path d="M276 286 l14 -60"/></g>
  <text x="205" y="344" text-anchor="middle" font-size="23" fill="#22201c">照り返し・鉢が熱い</text>
  <!-- 良い例 -->
  <rect x="410" y="20" width="370" height="340" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="434" y="64" font-size="28" font-weight="700" fill="#5b7f4a">棚の上</text>
  <use href="#sun" x="730" y="110"/>
  <rect x="664" y="104" width="12" height="206" fill="#b8935a"/>
  <rect x="430" y="100" width="246" height="14" rx="4" fill="#5b7f4a" opacity="0.55"/>
  <rect x="440" y="230" width="210" height="10" fill="#8b6b4a"/>
  <rect x="452" y="240" width="10" height="70" fill="#8b6b4a"/><rect x="628" y="240" width="10" height="70" fill="#8b6b4a"/>
  <rect x="430" y="310" width="330" height="10" fill="#c9c4bb"/>
  <use href="#bt" x="500" y="204"/><use href="#bt" x="600" y="204"/>
  <g stroke="#1a365d" stroke-width="3" fill="none"><path d="M520 268 h60 m-10 -8 l10 8 l-10 8"/></g>
  <text x="595" y="344" text-anchor="middle" font-size="23" fill="#22201c">高く・日よけ・風を通す</text>
  <rect x="20" y="380" width="760" height="70" rx="14" fill="#1a365d"/>
  <text x="400" y="424" text-anchor="middle" font-size="25" font-weight="700" fill="#faf9f6">地面から離し、午後の日差しを和らげる</text>
</svg>
