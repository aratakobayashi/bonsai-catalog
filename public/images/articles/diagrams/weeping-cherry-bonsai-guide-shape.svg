<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>シダレザクラの樹形づくり：芯を支柱で立てて高さを出し、枝を垂らす</title>
  <rect width="800" height="480" fill="#faf9f6"/>

  <!-- ① -->
  <rect x="20" y="20" width="370" height="440" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="205" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">そのままだと</text>
  <path d="M205 360 C 200 320, 210 290, 205 250" stroke="#6f5439" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g stroke="#6f5439" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M205 256 C 170 230, 140 250, 128 320"/><path d="M205 256 C 240 230, 270 250, 282 320"/>
    <path d="M205 256 C 196 236, 180 250, 176 316"/><path d="M205 256 C 214 236, 230 250, 234 316"/>
  </g>
  <path d="M130 360 h150 l-12 34 h-126 z" fill="#8b6b4a"/>
  <text x="205" y="430" text-anchor="middle" font-size="22" fill="#6b655b">枝が下を向き、高さが出ない</text>

  <!-- ② -->
  <rect x="410" y="20" width="370" height="440" rx="14" fill="#fff" stroke="#b8935a" stroke-width="3"/>
  <text x="595" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">芯を立てて伸ばす</text>
  <!-- 支柱 -->
  <line x1="610" y1="362" x2="610" y2="96" stroke="#b8935a" stroke-width="5"/>
  <g stroke="#b8935a" stroke-width="3"><line x1="600" y1="150" x2="618" y2="150"/><line x1="600" y1="210" x2="618" y2="210"/><line x1="600" y1="270" x2="618" y2="270"/></g>
  <path d="M595 360 C 590 320, 600 280, 596 230 C 594 190, 602 150, 604 110" stroke="#6f5439" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g stroke="#6f5439" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M604 116 C 570 96, 530 120, 520 200"/><path d="M604 116 C 640 96, 680 120, 690 200"/>
    <path d="M598 200 C 566 186, 540 220, 532 300"/><path d="M598 200 C 630 186, 656 220, 664 300"/>
  </g>
  <g fill="#c77d92">
    <circle cx="522" cy="186" r="6"/><circle cx="526" cy="160" r="6"/><circle cx="688" cy="186" r="6"/><circle cx="684" cy="160" r="6"/>
    <circle cx="534" cy="286" r="6"/><circle cx="538" cy="258" r="6"/><circle cx="662" cy="286" r="6"/><circle cx="658" cy="258" r="6"/>
  </g>
  <path d="M520 360 h150 l-12 34 h-126 z" fill="#8b6b4a"/>
  <text x="595" y="430" text-anchor="middle" font-size="22" fill="#1a365d">上から枝が流れ落ちる形に</text>
  <text x="622" y="348" font-size="22" fill="#b8935a">支柱</text>
</svg>
