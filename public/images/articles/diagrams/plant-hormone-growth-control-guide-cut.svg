<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 441" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>剪定で切る位置の比較。外向きの芽のすぐ上で切ると枝が外へ伸びる。内向きの芽では内側へ伸びる。芽から離れて切ると残った部分が枯れ込む</title>
  <rect width="800" height="441" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">芽のどこで切るか</text>
  <rect x="20.0" y="68" width="242.7" height="353" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <line x1="131.33333333333331" y1="292" x2="151.33333333333331" y2="122" stroke="#6f5439" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="155.33333333333331" cy="202" rx="8" ry="11" fill="#5b7f4a"/>
  <line x1="129.33333333333331" y1="194" x2="161.33333333333331" y2="178" stroke="#b4573a" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="167" y1="192" x2="213" y2="132" stroke="#5b7f4a" stroke-width="4" stroke-linecap="round"/>
  <path d="M211 146 L213 132 L201 138" fill="none" stroke="#5b7f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="73" cy="318" r="11" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <text x="141" y="327" font-size="25" text-anchor="middle" font-weight="700" fill="#22201c">外芽の上</text>
  <text x="141" y="365" font-size="22" text-anchor="middle" fill="#5b7f4a">枝が外へ伸びる</text>
  <rect x="278.7" y="68" width="242.7" height="353" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <line x1="389.99999999999994" y1="292" x2="409.99999999999994" y2="122" stroke="#6f5439" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="387.99999999999994" cy="202" rx="8" ry="11" fill="#5b7f4a"/>
  <line x1="387.99999999999994" y1="194" x2="419.99999999999994" y2="178" stroke="#b4573a" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="378" y1="192" x2="336" y2="132" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <path d="M349 138 L336 132 L338 146" fill="none" stroke="#b4573a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="309.99999999999994" y1="112" x2="309.99999999999994" y2="302" stroke="#6b655b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="319.99999999999994" y="116" font-size="22" fill="#6b655b">幹側</text>
  <path d="M322 308 l20 20 M342 308 l-20 20" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="327" font-size="25" text-anchor="middle" font-weight="700" fill="#22201c">内芽の上</text>
  <text x="400" y="365" font-size="22" text-anchor="middle" fill="#6b655b">幹側へ伸びて</text>
  <text x="400" y="397" font-size="22" text-anchor="middle" fill="#8b6b4a">枝が混み合う</text>
  <rect x="537.3" y="68" width="242.7" height="353" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <line x1="648.6666666666666" y1="292" x2="668.6666666666666" y2="122" stroke="#6f5439" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="672.6666666666666" cy="232" rx="8" ry="11" fill="#5b7f4a"/>
  <line x1="646.6666666666666" y1="160" x2="678.6666666666666" y2="144" stroke="#b4573a" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <rect x="653.6666666666666" y="158" width="14" height="54" fill="#6b655b" fill-opacity="0.5"/>
  <path d="M568 308 l20 20 M588 308 l-20 20" stroke="#b4573a" stroke-width="4" stroke-linecap="round"/>
  <text x="659" y="327" font-size="25" text-anchor="middle" font-weight="700" fill="#22201c">芽から遠い</text>
  <text x="659" y="365" font-size="22" text-anchor="middle" fill="#6b655b">残った部分が</text>
  <text x="659" y="397" font-size="22" text-anchor="middle" fill="#8b6b4a">枯れ込む</text>
</svg>
