<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>通販で買う場合と、店や盆栽園で買う場合の比較</title>
  <rect width="800" height="390" fill="#faf7f0"/>
  <text x="24" y="44" font-size="30" font-weight="700" fill="#2c2a26">通販と店頭のちがい</text>
  <rect x="20" y="70" width="370" height="260" rx="14" fill="#fff" stroke="#b8935a" stroke-width="3"/>
  <rect x="20" y="70" width="370" height="52" rx="14" fill="#a07a42"/>
  <rect x="20" y="104" width="370" height="18" fill="#a07a42"/>
  <text x="205" y="105" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">通販</text>
  <circle cx="46" cy="152" r="6" fill="#b8935a"/>
  <text x="62" y="160" font-size="22" fill="#2c2a26">遠くの園からも選べる</text>
  <circle cx="46" cy="198" r="6" fill="#b8935a"/>
  <text x="62" y="206" font-size="22" fill="#2c2a26">時間を気にせず選べる</text>
  <circle cx="46" cy="244" r="6" fill="#b8935a"/>
  <text x="62" y="252" font-size="22" fill="#2c2a26">実物を手に取れない</text>
  <circle cx="46" cy="290" r="6" fill="#b8935a"/>
  <text x="62" y="298" font-size="22" fill="#2c2a26">配送中に傷むことも</text>
  <rect x="410" y="70" width="370" height="260" rx="14" fill="#fff" stroke="#8b6b4a" stroke-width="3"/>
  <rect x="410" y="70" width="370" height="52" rx="14" fill="#8b6b4a"/>
  <rect x="410" y="104" width="370" height="18" fill="#8b6b4a"/>
  <text x="595" y="105" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">店・盆栽園</text>
  <circle cx="436" cy="152" r="6" fill="#8b6b4a"/>
  <text x="452" y="160" font-size="22" fill="#2c2a26">実物を見て選べる</text>
  <circle cx="436" cy="198" r="6" fill="#8b6b4a"/>
  <text x="452" y="206" font-size="22" fill="#2c2a26">育て方を直接聞ける</text>
  <circle cx="436" cy="244" r="6" fill="#8b6b4a"/>
  <text x="452" y="252" font-size="22" fill="#2c2a26">選べる数に限りがある</text>
  <circle cx="436" cy="290" r="6" fill="#8b6b4a"/>
  <text x="452" y="298" font-size="22" fill="#2c2a26">持ち帰りの手間がある</text>
<text x="776" y="374" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
