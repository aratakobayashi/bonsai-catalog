<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>桑の実のつき方と冬の切り戻しの位置</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <!-- 前の年の枝 -->
  <path d="M70 340 L420 250" stroke="#6f5439" stroke-width="12" stroke-linecap="round"/>
  <text x="80" y="388" font-size="24" font-weight="700" fill="#6f5439">前の年の枝</text>
  <!-- 芽 -->
  <g fill="#6f5439"><circle cx="190" cy="309" r="8"/><circle cx="290" cy="283" r="8"/></g>
  <!-- 新しい枝 -->
  <path d="M290 283 Q330 200 420 130" stroke="#5b7f4a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M190 309 Q220 240 280 190" stroke="#5b7f4a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g fill="#5b7f4a">
    <ellipse cx="340" cy="200" rx="26" ry="13" transform="rotate(-30 340 200)"/>
    <ellipse cx="392" cy="150" rx="26" ry="13" transform="rotate(-40 392 150)"/>
    <ellipse cx="250" cy="215" rx="22" ry="11" transform="rotate(-35 250 215)"/>
  </g>
  <g fill="#7a2f3f"><circle cx="318" cy="234" r="6"/><circle cx="325" cy="239" r="6"/><circle cx="311" cy="239" r="6"/><circle cx="318" cy="244" r="6"/><circle cx="325" cy="249" r="6"/><circle cx="311" cy="249" r="6"/><circle cx="318" cy="254" r="6"/><circle cx="214" cy="262" r="6"/><circle cx="221" cy="267" r="6"/><circle cx="207" cy="267" r="6"/><circle cx="214" cy="272" r="6"/><circle cx="221" cy="277" r="6"/><circle cx="207" cy="277" r="6"/><circle cx="214" cy="282" r="6"/></g>
  <text x="440" y="120" font-size="24" font-weight="700" fill="#5b7f4a">春に伸びる新しい枝</text>
  <text x="440" y="226" font-size="24" font-weight="700" fill="#7a2f3f">実は枝の元のほう</text>
  <!-- 冬に切る位置 -->
  <line x1="342" y1="232" x2="372" y2="300" stroke="#1a365d" stroke-width="5" stroke-dasharray="10 7"/>
  <text x="440" y="306" font-size="24" font-weight="700" fill="#1a365d">冬はここで切る</text>
  <text x="440" y="338" font-size="22" fill="#1a365d">（2〜3芽を残す）</text>
  <rect x="20" y="416" width="760" height="68" rx="14" fill="#f3f0ea" stroke="#8b6b4a" stroke-width="2"/>
  <g stroke="#8b6b4a" stroke-width="5" stroke-linecap="round"><line x1="46" y1="437" x2="70" y2="461"/><line x1="70" y1="437" x2="46" y2="461"/></g>
  <text x="88" y="459" font-size="24" fill="#22201c">前の年の枝を元から全部切る → 実がつかない</text>
</svg>
