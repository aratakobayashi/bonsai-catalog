<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>挿し木の時期の目安</title>
  <rect width="800" height="340" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">挿し木の時期の目安</text>
  <g font-size="18" fill="#6b655b" text-anchor="middle">
    <text x="208" y="96">2月</text><text x="262" y="96">3月</text><text x="316" y="96">4月</text><text x="370" y="96">5月</text><text x="424" y="96">6月</text><text x="478" y="96">7月</text><text x="532" y="96">8月</text><text x="586" y="96">9月</text><text x="640" y="96">10月</text><text x="694" y="96">11月</text><text x="748" y="96">12月</text>
  </g>
  <rect x="180" y="108" width="596" height="2" fill="#d9d1c3"/>
  <text x="24" y="150" font-size="21" font-weight="700" fill="#2c2a26">春挿し</text>
  <text x="24" y="176" font-size="16" fill="#6b655b">前年の枝</text>
  <rect x="235" y="128" width="108" height="40" rx="10" fill="#6f9558"/>
  <text x="289" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3〜4月</text>
  <text x="24" y="226" font-size="21" font-weight="700" fill="#2c2a26">梅雨挿し</text>
  <text x="24" y="252" font-size="16" fill="#6b655b">今年伸びた枝</text>
  <rect x="397" y="204" width="108" height="40" rx="10" fill="#4f86b5"/>
  <text x="451" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6〜7月</text>
  <rect x="505" y="204" width="54" height="40" rx="10" fill="#efe4d6"/>
  <text x="532" y="231" text-anchor="middle" font-size="15" fill="#86683a">暑い</text>
  <rect x="22" y="272" width="756" height="44" rx="12" fill="#f3ebdd"/>
  <text x="40" y="301" font-size="19" fill="#2c2a26">初めてなら、湿度が高く挿し穂が乾きにくい梅雨挿しから</text>
  <text x="776" y="334" text-anchor="end" font-size="15" fill="#b8935a" letter-spacing="2">盆栽コレクション</text>
</svg>
