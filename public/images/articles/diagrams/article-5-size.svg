<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の大きさの呼び分けの目安。豆盆栽は樹高10cmほどまでで手のひらに乗る大きさ、ミニ盆栽・小品盆栽は20cm前後まで、それより大きいものは中品以上</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">大きさの呼び分け</text>
  <text x="780" y="44" text-anchor="end" font-size="22" fill="#6b655b">樹高の目安</text>

  <!-- 目盛り -->
  <line x1="70" y1="380" x2="780" y2="380" stroke="#22201c" stroke-width="2.5"/>
  <g stroke="#ebe7df" stroke-width="2" stroke-dasharray="6 6">
    <line x1="70" y1="300" x2="780" y2="300"/><line x1="70" y1="220" x2="780" y2="220"/><line x1="70" y1="140" x2="780" y2="140"/>
  </g>
  <g font-size="22" fill="#6b655b" text-anchor="end">
    <text x="62" y="307">10</text><text x="62" y="227">20</text><text x="62" y="147">30</text><text x="62" y="387">0</text>
  </g>
  <text x="20" y="110" font-size="22" fill="#6b655b">cm</text>

  <!-- 豆 -->
  <path d="M168 380 h56 l-6 -22 h-44 z" fill="#8b6b4a"/>
  <path d="M196 358 q-4 -30 6 -50" stroke="#6f5439" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="200" cy="312" rx="30" ry="16" fill="#5b7f4a"/>
  <!-- ミニ・小品 -->
  <path d="M370 380 h100 l-8 -26 h-84 z" fill="#8b6b4a"/>
  <path d="M418 354 q-14 -60 6 -120" stroke="#6f5439" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="400" cy="270" rx="38" ry="18" fill="#5b7f4a"/>
  <ellipse cx="440" cy="236" rx="44" ry="20" fill="#5b7f4a"/>
  <!-- 中品 -->
  <path d="M590 380 h150 l-10 -30 h-130 z" fill="#8b6b4a"/>
  <path d="M664 350 q-22 -90 4 -200" stroke="#6f5439" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="626" cy="240" rx="50" ry="22" fill="#5b7f4a"/>
  <ellipse cx="708" cy="200" rx="54" ry="22" fill="#5b7f4a"/>
  <ellipse cx="664" cy="150" rx="48" ry="22" fill="#5b7f4a"/>

  <g text-anchor="middle">
    <text x="200" y="418" font-size="26" font-weight="700" fill="#22201c">豆盆栽</text>
    <text x="200" y="450" font-size="22" fill="#5b7f4a">〜10cmほど</text>
    <text x="420" y="418" font-size="26" font-weight="700" fill="#22201c">ミニ・小品</text>
    <text x="420" y="450" font-size="22" fill="#5b7f4a">〜20cm前後</text>
    <text x="665" y="418" font-size="26" font-weight="700" fill="#22201c">中品以上</text>
    <text x="665" y="450" font-size="22" fill="#5b7f4a">それより大きい</text>
  </g>
</svg>
