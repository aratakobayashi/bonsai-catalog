<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>正月の盆栽の飾り方：主木・添え・掛け軸を三角形に配置する</title>
  <rect width="800" height="500" fill="#faf9f6"/>

  <!-- 床の間 -->
  <rect x="20" y="20" width="760" height="464" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="60" y="360" width="680" height="24" fill="#c9b48f"/>
  <rect x="60" y="384" width="680" height="10" fill="#8b6b4a"/>

  <!-- 掛け軸 -->
  <rect x="540" y="56" width="130" height="16" rx="3" fill="#6f5439"/>
  <rect x="550" y="72" width="110" height="240" fill="#f3f0ea" stroke="#c9b48f" stroke-width="2"/>
  <circle cx="605" cy="140" r="26" fill="none" stroke="#b4573a" stroke-width="5"/>
  <path d="M588 200 C 600 220, 610 240, 600 270" stroke="#22201c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="540" y="312" width="130" height="14" rx="3" fill="#6f5439"/>

  <!-- 主木（松） -->
  <rect x="140" y="336" width="220" height="24" rx="4" fill="#22201c"/>
  <path d="M170 300 h160 l-12 36 h-136 z" fill="#8b6b4a"/>
  <path d="M240 300 C 232 260, 262 230, 246 190 C 240 170, 252 150, 256 130" stroke="#6f5439" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#3f5a33">
    <ellipse cx="250" cy="120" rx="66" ry="26"/>
    <ellipse cx="190" cy="184" rx="56" ry="20"/>
    <ellipse cx="316" cy="210" rx="52" ry="18"/>
  </g>

  <!-- 添え（草もの） -->
  <rect x="430" y="340" width="70" height="20" rx="4" fill="#22201c"/>
  <path d="M440 316 h50 l-6 24 h-38 z" fill="#f3f0ea" stroke="#c9b48f" stroke-width="2"/>
  <g fill="#5b7f4a"><ellipse cx="454" cy="306" rx="12" ry="7"/><ellipse cx="474" cy="304" rx="12" ry="7"/></g>
  <g fill="#b8935a"><circle cx="460" cy="292" r="7"/><circle cx="476" cy="290" r="7"/></g>

  <!-- 三角形 -->
  <path d="M250 96 L 605 92 L 465 286 Z" fill="none" stroke="#b8935a" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- ラベル -->
  <g font-size="22">
    <text x="250" y="440" text-anchor="middle" font-weight="700" fill="#22201c" font-size="24">主木</text>
    <text x="250" y="470" text-anchor="middle" fill="#6b655b">松・梅など</text>
    <text x="465" y="440" text-anchor="middle" font-weight="700" fill="#22201c" font-size="24">添え</text>
    <text x="465" y="470" text-anchor="middle" fill="#6b655b">福寿草など</text>
    <text x="680" y="440" text-anchor="middle" font-weight="700" fill="#22201c" font-size="24">掛け軸</text>
    <text x="680" y="470" text-anchor="middle" fill="#6b655b">季節の絵や書</text>
  </g>
</svg>
