<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽風に仕立てやすいハーブと向かないハーブ</title>
  <defs><path id="nd" d="M0 0 l14 -6" /></defs>
  <rect width="800" height="480" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">根元が木のように固くなるか</text>

  <!-- 向く -->
  <rect x="20" y="70" width="370" height="390" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <circle cx="52" cy="108" r="13" fill="none" stroke="#5b7f4a" stroke-width="4"/>
  <text x="76" y="117" font-size="26" font-weight="700" fill="#22201c">向く：木になるハーブ</text>
  <!-- 木質の幹 -->
  <path d="M190 330 Q186 290 196 260 Q170 240 150 210 M196 260 Q220 236 246 214 M196 262 Q200 220 204 186" stroke="#8b6b4a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g stroke="#5b7f4a" stroke-width="4" stroke-linecap="round">
    <path d="M150 210 l-14 -10 M150 210 l-4 -16 M150 210 l10 -12 M246 214 l12 -10 M246 214 l2 -16 M246 214 l-10 -12 M204 186 l-12 -12 M204 186 l2 -18 M204 186 l14 -12"/>
    <path d="M168 232 l-14 -4 M172 238 l-6 -14 M226 232 l14 -4 M222 238 l6 -14 M202 214 l-12 -6 M204 220 l12 -6"/>
  </g>
  <path d="M130 330 h130 l-12 36 h-106 z" fill="#8b6b4a"/>
  <line x1="214" y1="292" x2="282" y2="272" stroke="#b8935a" stroke-width="2.5"/>
  <text x="288" y="270" font-size="22" fill="#8b6b4a">茶色く</text>
  <text x="288" y="298" font-size="22" fill="#8b6b4a">固い幹</text>
  <text x="44" y="404" font-size="22" fill="#22201c">ローズマリー・タイム</text>
  <text x="44" y="436" font-size="22" fill="#22201c">ギンバイカ・ゲッケイジュ</text>

  <!-- 向かない -->
  <rect x="410" y="70" width="370" height="390" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <g stroke="#b4573a" stroke-width="5" stroke-linecap="round"><line x1="430" y1="98" x2="452" y2="120"/><line x1="452" y1="98" x2="430" y2="120"/></g>
  <text x="466" y="117" font-size="26" font-weight="700" fill="#22201c">向かない：草のハーブ</text>
  <!-- 一年草 -->
  <path d="M530 330 L530 220" stroke="#8fae78" stroke-width="5" stroke-linecap="round"/>
  <g fill="#8fae78">
    <ellipse cx="510" cy="250" rx="20" ry="11"/><ellipse cx="550" cy="236" rx="20" ry="11"/><ellipse cx="514" cy="214" rx="18" ry="10"/><ellipse cx="546" cy="200" rx="18" ry="10"/>
  </g>
    <!-- 地下茎 -->
  <g stroke="#8fae78" stroke-width="5" stroke-linecap="round">
    <line x1="650" y1="330" x2="650" y2="240"/><line x1="700" y1="330" x2="700" y2="256"/><line x1="740" y1="330" x2="740" y2="264"/>
  </g>
  <g fill="#8fae78">
    <ellipse cx="636" cy="256" rx="14" ry="8"/><ellipse cx="664" cy="246" rx="14" ry="8"/><ellipse cx="686" cy="270" rx="14" ry="8"/><ellipse cx="714" cy="262" rx="14" ry="8"/><ellipse cx="728" cy="280" rx="12" ry="7"/><ellipse cx="752" cy="272" rx="12" ry="7"/>
  </g>
  <path d="M630 340 Q690 352 760 338" stroke="#8b6b4a" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
    <line x1="430" y1="330" x2="770" y2="330" stroke="#8b6b4a" stroke-width="3"/>
  <text x="434" y="404" font-size="22" fill="#22201c">バジル・パセリ（一年で枯れる）</text>
  <text x="434" y="436" font-size="22" fill="#22201c">ミント・チャイブ（草で増える）</text>
</svg>
