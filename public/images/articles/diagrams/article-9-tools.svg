<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>盆栽の基本の道具7つと役割。盆栽ばさみは枝や葉を切る、又枝切りは枝を元からえぐるように切る、ピンセットは芽摘みや草取り、針金と針金切りは枝を曲げる、根かきは植え替えで根をほぐす、土入れは鉢に土を入れる、じょうろは水やり</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <text x="20" y="44" font-size="30" font-weight="700" fill="#1a365d">基本の道具7つ</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="66" width="178" height="200" rx="14"/><rect x="214" y="66" width="178" height="200" rx="14"/>
    <rect x="408" y="66" width="178" height="200" rx="14"/><rect x="602" y="66" width="178" height="200" rx="14"/>
    <rect x="20" y="280" width="178" height="200" rx="14"/><rect x="214" y="280" width="178" height="200" rx="14"/>
    <rect x="408" y="280" width="178" height="200" rx="14"/>
  </g>
  <rect x="602" y="280" width="178" height="200" rx="14" fill="#1a365d"/>
  <g stroke="#22201c" stroke-width="5" stroke-linecap="round" fill="none">
    <!-- はさみ -->
    <path d="M90 92 L128 150 M128 92 L90 150"/><ellipse cx="80" cy="172" rx="20" ry="16"/><ellipse cx="138" cy="172" rx="20" ry="16"/>
    <!-- 又枝切り -->
    <path d="M290 96 q14 -8 26 0 L316 104 L296 150 M316 96 q-14 -8 -26 0"/><path d="M296 150 L270 192 M308 150 L334 192" stroke-width="7"/>
    <!-- ピンセット -->
    <path d="M480 92 L494 190 L508 92"/>
    <!-- 針金 -->
    <circle cx="648" cy="140" r="26" stroke="#b8935a"/><circle cx="648" cy="140" r="18" stroke="#b8935a"/>
    <path d="M708 100 L726 150 M740 100 L722 150 M724 150 L710 190 M724 150 L738 190"/>
    <!-- 根かき -->
    <path d="M110 320 V380"/><path d="M86 386 h48 M90 386 l-4 22 M110 386 v22 M130 386 l4 22" stroke-width="4"/>
    <!-- 土入れ -->
    <path d="M262 340 h80 l-10 46 h-60 z" fill="#ebe7df"/><path d="M302 386 v26"/>
    <!-- じょうろ -->
    <path d="M440 336 h70 v60 h-70 z" fill="#ebe7df"/><path d="M510 346 L556 318"/><circle cx="560" cy="314" r="8" fill="#22201c"/><path d="M440 346 q-24 10 0 40"/>
  </g>
  <g text-anchor="middle">
    <text x="109" y="226" font-size="24" font-weight="700" fill="#22201c">盆栽ばさみ</text>
    <text x="109" y="254" font-size="22" fill="#6b655b">枝・葉を切る</text>
    <text x="303" y="226" font-size="24" font-weight="700" fill="#22201c">又枝切り</text>
    <text x="303" y="254" font-size="22" fill="#6b655b">枝を元から</text>
    <text x="497" y="226" font-size="24" font-weight="700" fill="#22201c">ピンセット</text>
    <text x="497" y="254" font-size="22" fill="#6b655b">芽摘み・草取り</text>
    <text x="691" y="226" font-size="22" font-weight="700" fill="#22201c">針金と針金切り</text>
    <text x="691" y="254" font-size="22" fill="#6b655b">枝を曲げる</text>
    <text x="109" y="440" font-size="24" font-weight="700" fill="#22201c">根かき</text>
    <text x="109" y="468" font-size="22" fill="#6b655b">根をほぐす</text>
    <text x="303" y="440" font-size="24" font-weight="700" fill="#22201c">土入れ</text>
    <text x="303" y="468" font-size="22" fill="#6b655b">鉢に土を入れる</text>
    <text x="497" y="440" font-size="24" font-weight="700" fill="#22201c">じょうろ</text>
    <text x="497" y="468" font-size="22" fill="#6b655b">ハス口つき</text>
    <text x="691" y="350" font-size="24" font-weight="700" fill="#faf9f6">まず3つ</text>
    <text x="691" y="390" font-size="22" fill="#faf9f6">はさみ</text>
    <text x="691" y="422" font-size="22" fill="#faf9f6">じょうろ</text>
    <text x="691" y="454" font-size="22" fill="#faf9f6">ピンセット</text>
  </g>
</svg>
