<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>もみじの芽摘み：最初の1〜2対の葉を残して先を摘む</title>
  <defs>
    <path id="mp" d="M0 0 L-4 -10 L-20 -12 L-10 -18 L-18 -32 L-6 -26 L0 -42 L6 -26 L18 -32 L10 -18 L20 -12 L4 -10 Z"/>
  </defs>
  <rect width="800" height="480" fill="#faf9f6"/>

  <!-- ① 新芽が伸びる -->
  <rect x="20" y="20" width="244" height="440" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="142" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">① 新芽が伸びる</text>
  <line x1="142" y1="400" x2="142" y2="150" stroke="#6f5439" stroke-width="5" stroke-linecap="round"/>
  <g fill="#5b7f4a">
    <use href="#mp" transform="translate(142 340) rotate(-65)"/><use href="#mp" transform="translate(142 340) rotate(65)"/>
    <use href="#mp" transform="translate(142 270) rotate(-65)"/><use href="#mp" transform="translate(142 270) rotate(65)"/>
  </g>
  <g fill="#b4573a">
    <use href="#mp" transform="translate(142 205) rotate(-60) scale(0.75)"/><use href="#mp" transform="translate(142 205) rotate(60) scale(0.75)"/>
    <use href="#mp" transform="translate(142 155) scale(0.55)"/>
  </g>
  <text x="142" y="438" text-anchor="middle" font-size="22" fill="#6b655b">先へ次々に葉が増える</text>

  <!-- ② 1〜2対を残して摘む -->
  <rect x="278" y="20" width="244" height="440" rx="14" fill="#fff" stroke="#b8935a" stroke-width="3"/>
  <text x="400" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">② 先を摘む</text>
  <line x1="400" y1="400" x2="400" y2="244" stroke="#6f5439" stroke-width="5" stroke-linecap="round"/>
  <line x1="400" y1="232" x2="400" y2="150" stroke="#6f5439" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
  <g fill="#5b7f4a">
    <use href="#mp" transform="translate(400 340) rotate(-65)"/><use href="#mp" transform="translate(400 340) rotate(65)"/>
    <use href="#mp" transform="translate(400 270) rotate(-65)"/><use href="#mp" transform="translate(400 270) rotate(65)"/>
  </g>
  <g fill="#b4573a" opacity="0.3">
    <use href="#mp" transform="translate(400 205) rotate(-60) scale(0.75)"/><use href="#mp" transform="translate(400 205) rotate(60) scale(0.75)"/>
    <use href="#mp" transform="translate(400 155) scale(0.55)"/>
  </g>
  <line x1="330" y1="238" x2="470" y2="238" stroke="#b8935a" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="400" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#b8935a">ここで摘む</text>
  <!-- 残す対の目印 -->
  <path d="M482 262 v86" stroke="#1a365d" stroke-width="3" fill="none"/>
  <path d="M476 262 h12 M476 348 h12" stroke="#1a365d" stroke-width="3"/>
  <text x="400" y="438" text-anchor="middle" font-size="22" fill="#1a365d">1〜2対を残す</text>

  <!-- ③ 枝が増える -->
  <rect x="536" y="20" width="244" height="440" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="658" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">③ 枝が増える</text>
  <line x1="658" y1="400" x2="658" y2="244" stroke="#6f5439" stroke-width="5" stroke-linecap="round"/>
  <g fill="#5b7f4a">
    <use href="#mp" transform="translate(658 340) rotate(-65)"/><use href="#mp" transform="translate(658 340) rotate(65)"/>
    <use href="#mp" transform="translate(658 270) rotate(-65)"/><use href="#mp" transform="translate(658 270) rotate(65)"/>
  </g>
  <g stroke="#6f5439" stroke-width="3.5" stroke-linecap="round">
    <line x1="658" y1="250" x2="618" y2="176"/><line x1="658" y1="250" x2="698" y2="176"/>
  </g>
  <g fill="#b4573a">
    <use href="#mp" transform="translate(618 176) rotate(-20) scale(0.6)"/>
    <use href="#mp" transform="translate(698 176) rotate(20) scale(0.6)"/>
    <use href="#mp" transform="translate(632 202) rotate(-80) scale(0.5)"/>
    <use href="#mp" transform="translate(684 202) rotate(80) scale(0.5)"/>
  </g>
  <text x="658" y="438" text-anchor="middle" font-size="22" fill="#6b655b">節が詰まり細かい枝に</text>
</svg>
