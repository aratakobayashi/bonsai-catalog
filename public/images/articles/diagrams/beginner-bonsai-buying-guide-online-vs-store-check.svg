<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>買う前に見る5つの点</title>
  <rect width="800" height="500" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">買う前に見る5つの点</text>
  <g transform="translate(-80,0)">
  <path d="M250 380 h220 l-18 70 h-184 z" fill="#8b6b4a"/>
  <rect x="244" y="372" width="232" height="12" rx="3" fill="#6f5439"/>
  <path d="M352 372 C 345 330, 330 300, 345 260 C 355 230, 372 220, 368 190" stroke="#6f5439" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M330 372 C 336 362, 346 360, 352 372 M372 372 C 378 360, 390 362, 396 372" stroke="#6f5439" stroke-width="8" fill="none"/>
  <path d="M348 270 L280 240 M362 225 L440 200" stroke="#6f5439" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="270" cy="228" rx="62" ry="30" fill="#5b7f4a"/>
  <ellipse cx="450" cy="190" rx="66" ry="32" fill="#5b7f4a"/>
  <ellipse cx="370" cy="150" rx="72" ry="40" fill="#5b7f4a"/>
  </g>
  <!-- labels -->
  <g font-size="23" fill="#22201c">
    <circle cx="520" cy="120" r="18" fill="#1a365d"/><text x="520" y="128" text-anchor="middle" fill="#faf9f6" font-weight="700">1</text>
    <text x="548" y="128">葉の色・つや</text>
    <circle cx="520" cy="200" r="18" fill="#1a365d"/><text x="520" y="208" text-anchor="middle" fill="#faf9f6" font-weight="700">2</text>
    <text x="548" y="208">枝先が枯れていない</text>
    <circle cx="520" cy="280" r="18" fill="#1a365d"/><text x="520" y="288" text-anchor="middle" fill="#faf9f6" font-weight="700">3</text>
    <text x="548" y="288">幹に傷・虫がない</text>
    <circle cx="520" cy="360" r="18" fill="#1a365d"/><text x="520" y="368" text-anchor="middle" fill="#faf9f6" font-weight="700">4</text>
    <text x="548" y="368">根元がぐらつかない</text>
    <circle cx="520" cy="440" r="18" fill="#1a365d"/><text x="520" y="448" text-anchor="middle" fill="#faf9f6" font-weight="700">5</text>
    <text x="548" y="448">土が乾ききっていない</text>
  </g>
  <g stroke="#6b655b" stroke-width="2">
    <line x1="500" y1="120" x2="360" y2="150"/>
    <line x1="500" y1="200" x2="435" y2="195"/>
    <line x1="500" y1="280" x2="282" y2="290"/>
    <line x1="500" y1="360" x2="320" y2="366"/>
    <line x1="500" y1="440" x2="375" y2="410"/>
  </g>
  <text x="30" y="480" font-size="22" fill="#6b655b">ネットでは写真と説明で確かめる</text>
</svg>
