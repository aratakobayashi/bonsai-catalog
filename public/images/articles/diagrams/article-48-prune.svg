<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>ニレケヤキの切り戻し：伸びた枝を2〜3節残して切ると、その下から小枝が出る</title>
  <defs>
    <ellipse id="lf" cx="13" cy="0" rx="13" ry="6.5"/>
  </defs>
  <rect width="800" height="470" fill="#faf9f6"/>

  <!-- ① 伸びる -->
  <rect x="20" y="20" width="244" height="430" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="142" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">① 枝が伸びる</text>
  <path d="M60 390 Q100 380 120 340 Q150 270 150 110" stroke="#6f5439" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#5b7f4a">
    <use href="#lf" transform="translate(126 320) rotate(-150)"/><use href="#lf" transform="translate(131 300) rotate(-20)"/>
    <use href="#lf" transform="translate(142 265) rotate(-160)"/><use href="#lf" transform="translate(146 235) rotate(-15)"/>
    <use href="#lf" transform="translate(149 200) rotate(-165)"/><use href="#lf" transform="translate(150 170) rotate(-15)"/>
    <use href="#lf" transform="translate(150 140) rotate(-165)"/><use href="#lf" transform="translate(150 115) rotate(-30)"/>
  </g>
  <text x="142" y="428" text-anchor="middle" font-size="22" fill="#6b655b">節の間が長くなる</text>

  <!-- ② 切る -->
  <rect x="278" y="20" width="244" height="430" rx="14" fill="#fff" stroke="#b8935a" stroke-width="3"/>
  <text x="400" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">② 2〜3節で切る</text>
  <path d="M318 390 Q358 380 378 340 Q404 280 406 250" stroke="#6f5439" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M406 250 Q408 200 408 110" stroke="#6f5439" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.25"/>
  <g fill="#5b7f4a">
    <use href="#lf" transform="translate(384 320) rotate(-150)"/><use href="#lf" transform="translate(389 300) rotate(-20)"/>
    <use href="#lf" transform="translate(400 265) rotate(-160)"/>
  </g>
  <g fill="#5b7f4a" opacity="0.25">
    <use href="#lf" transform="translate(404 235) rotate(-15)"/><use href="#lf" transform="translate(407 200) rotate(-165)"/>
    <use href="#lf" transform="translate(408 170) rotate(-15)"/><use href="#lf" transform="translate(408 140) rotate(-165)"/>
  </g>
  <line x1="350" y1="248" x2="462" y2="248" stroke="#b8935a" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="470" y="256" font-size="22" font-weight="700" fill="#b8935a">切る</text>
  <text x="400" y="428" text-anchor="middle" font-size="22" fill="#1a365d">芽の少し上で切る</text>

  <!-- ③ 小枝 -->
  <rect x="536" y="20" width="244" height="430" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="658" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#22201c">③ 小枝が増える</text>
  <path d="M576 390 Q616 380 636 340 Q662 280 664 250" stroke="#6f5439" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g stroke="#6f5439" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M664 252 Q690 220 712 196"/><path d="M660 262 Q630 230 612 206"/><path d="M646 312 Q690 300 716 286"/>
  </g>
  <g fill="#5b7f4a">
    <use href="#lf" transform="translate(642 320) rotate(-150)"/><use href="#lf" transform="translate(658 265) rotate(-160)"/>
    <use href="#lf" transform="translate(712 196) rotate(-40)"/><use href="#lf" transform="translate(694 216) rotate(-120)"/>
    <use href="#lf" transform="translate(612 206) rotate(-140)"/><use href="#lf" transform="translate(630 228) rotate(-60)"/>
    <use href="#lf" transform="translate(716 286) rotate(-20)"/><use href="#lf" transform="translate(690 300) rotate(-110)"/>
  </g>
  <text x="658" y="428" text-anchor="middle" font-size="22" fill="#6b655b">枝先が細かくなる</text>
</svg>
