<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>不調を相談するときに撮る4枚の写真</title>
  <rect width="800" height="470" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">相談するときに撮る4枚</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="70" width="178" height="300" rx="14"/>
    <rect x="214" y="70" width="178" height="300" rx="14"/>
    <rect x="408" y="70" width="178" height="300" rx="14"/>
    <rect x="602" y="70" width="178" height="300" rx="14"/>
  </g>
  <!-- 1 whole tree -->
  <path d="M69 230 h80 l-10 24 h-60 z" fill="#8b6b4a"/>
  <path d="M109 230 v-36" stroke="#6f5439" stroke-width="7"/>
  <ellipse cx="109" cy="180" rx="50" ry="30" fill="#5b7f4a"/>
  <!-- 2 leaf closeup with spots -->
  <path d="M303 120 q60 50 0 130 q-60 -80 0 -130 z" fill="#5b7f4a"/>
  <circle cx="290" cy="180" r="7" fill="#8b6b4a"/><circle cx="312" cy="206" r="6" fill="#8b6b4a"/><circle cx="300" cy="150" r="5" fill="#8b6b4a"/>
  <!-- 3 leaf underside -->
  <path d="M497 120 q60 50 0 130 q-60 -80 0 -130 z" fill="#9bbf6a"/>
  <line x1="497" y1="128" x2="497" y2="244" stroke="#5b7f4a" stroke-width="3"/>
  <g fill="#faf9f6" stroke="#22201c" stroke-width="1.5"><circle cx="486" cy="190" r="4"/><circle cx="508" cy="176" r="4"/><circle cx="504" cy="210" r="4"/></g>
  <!-- 4 trunk and soil -->
  <rect x="636" y="196" width="110" height="60" fill="#8b6b4a"/>
  <rect x="636" y="190" width="110" height="10" fill="#e3d2b4"/>
  <rect x="682" y="120" width="18" height="74" fill="#6f5439"/>
  <g font-size="24" font-weight="700" fill="#22201c" text-anchor="middle">
    <text x="109" y="300">樹の全体</text>
    <text x="303" y="300">症状のアップ</text>
    <text x="497" y="300">葉の裏</text>
    <text x="691" y="300">幹と土</text>
  </g>
  <g font-size="22" fill="#6b655b" text-anchor="middle">
    <text x="109" y="338">正面から</text>
    <text x="303" y="338">近づいて撮る</text>
    <text x="497" y="338">虫を探す</text>
    <text x="691" y="338">乾き具合</text>
  </g>
  <rect x="20" y="390" width="760" height="62" rx="14" fill="#1a365d"/>
  <text x="400" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#faf9f6">明るい日陰の自然光で。水やりの頻度もメモしておく</text>
</svg>
