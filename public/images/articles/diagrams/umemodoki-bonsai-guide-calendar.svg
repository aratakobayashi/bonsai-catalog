  <rect x="254.5" y="119" width="52.5" height="28" rx="6" fill="#8b6b4a"/>
  <text x="34" y="197" font-size="24" font-weight="700" fill="#22201c">剪定</text>
  <rect x="212.5" y="175" width="78.8" height="28" rx="6" fill="#1a365d"/>
  <rect x="475.0" y="175" width="42.0" height="28" rx="6" fill="#1a365d" fill-opacity="0.4"/>
