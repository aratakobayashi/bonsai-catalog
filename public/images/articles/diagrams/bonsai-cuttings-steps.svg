<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>挿し木の流れ</title>
  <rect width="800" height="400" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">挿し木の手順</text>
  <g font-size="20">
    <rect x="22" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="92" cy="114" r="20" fill="#5b7f4a"/><text x="92" y="122" text-anchor="middle" font-weight="700" fill="#fff">1</text>
    <path d="M92 214 v-62" stroke="#7a5236" stroke-width="5" stroke-linecap="round"/><ellipse cx="80" cy="160" rx="12" ry="6" fill="#6f9558" transform="rotate(-30 80 160)"/><ellipse cx="104" cy="152" rx="12" ry="6" fill="#5b7f4a" transform="rotate(30 104 152)"/><ellipse cx="82" cy="186" rx="11" ry="6" fill="#6f9558" transform="rotate(-30 82 186)"/>
    <path d="M120 152 v62" stroke="#b8935a" stroke-width="2"/><path d="M114 152 h12 M114 214 h12" stroke="#b8935a" stroke-width="2"/>
    <text x="92" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">5〜10cmの</text><text x="92" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">挿し穂を作る</text>
    <path d="M164 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M168 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="178" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="248" cy="114" r="20" fill="#5b7f4a"/><text x="248" y="122" text-anchor="middle" font-weight="700" fill="#fff">2</text>
    <path d="M248 206 v-54" stroke="#7a5236" stroke-width="5" stroke-linecap="round"/><path d="M243 206 l10 14 l0 -14 z" fill="#7a5236"/><ellipse cx="236" cy="158" rx="12" ry="6" fill="#6f9558" transform="rotate(-30 236 158)"/><ellipse cx="260" cy="152" rx="12" ry="6" fill="#5b7f4a" transform="rotate(30 260 152)"/>
    <text x="248" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">下葉を取り</text><text x="248" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">斜めに切る</text>
    <path d="M320 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M324 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="334" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="404" cy="114" r="20" fill="#5b7f4a"/><text x="404" y="122" text-anchor="middle" font-weight="700" fill="#fff">3</text>
    <path d="M376 176 h56 l-6 46 h-44 z" fill="#d9e6ef"/><path d="M404 214 v-62" stroke="#7a5236" stroke-width="5" stroke-linecap="round"/><ellipse cx="392" cy="158" rx="11" ry="6" fill="#6f9558" transform="rotate(-30 392 158)"/><ellipse cx="416" cy="152" rx="11" ry="6" fill="#5b7f4a" transform="rotate(30 416 152)"/>
    <text x="404" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">水を</text><text x="404" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">吸わせる</text>
    <path d="M476 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M480 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="490" y="78" width="140" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="560" cy="114" r="20" fill="#5b7f4a"/><text x="560" y="122" text-anchor="middle" font-weight="700" fill="#fff">4</text>
    <path d="M512 186 h96 l-6 40 h-84 z" fill="#3a3731"/><rect x="512" y="186" width="96" height="10" fill="#b9774a"/><path d="M540 196 v-40 M580 196 v-40" stroke="#7a5236" stroke-width="4" stroke-linecap="round"/><ellipse cx="534" cy="160" rx="9" ry="5" fill="#6f9558"/><ellipse cx="586" cy="160" rx="9" ry="5" fill="#6f9558"/>
    <text x="560" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">用土に</text><text x="560" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">挿す</text>
    <path d="M632 176 h10" stroke="#b8935a" stroke-width="5" stroke-linecap="round"/><path d="M636 168 l8 8 l-8 8" fill="none" stroke="#b8935a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="646" y="78" width="132" height="196" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
    <circle cx="712" cy="114" r="20" fill="#5b7f4a"/><text x="712" y="122" text-anchor="middle" font-weight="700" fill="#fff">5</text>
    <rect x="666" y="140" width="92" height="20" rx="4" fill="#e8e1d3"/><path d="M670 160 v60 M754 160 v60" stroke="#d9d1c3" stroke-width="3"/><path d="M680 190 h64 l-6 30 h-52 z" fill="#3a3731"/><path d="M712 190 v-22" stroke="#7a5236" stroke-width="4"/><ellipse cx="712" cy="168" rx="10" ry="5" fill="#6f9558"/>
    <text x="712" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">明るい日陰で</text><text x="712" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2a26">乾かさない</text>
  </g>
  <rect x="22" y="292" width="756" height="78" rx="14" fill="#f3ebdd"/>
  <text x="40" y="324" font-size="20" font-weight="700" fill="#2c2a26">用土は肥料分のない清潔なものを。</text>
  <text x="40" y="354" font-size="19" fill="#2c2a26">挿す深さは挿し穂の3分の1〜半分。根が出るまで肥料は与えません</text>
  <text x="776" y="390" text-anchor="end" font-size="15" fill="#b8935a" letter-spacing="2">盆栽コレクション</text>
</svg>
