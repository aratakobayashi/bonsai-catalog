<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>中国の盆景と日本の盆栽の見どころの違い</title>
  <rect width="800" height="440" fill="#faf9f6"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1a365d">盆景と盆栽の見どころ</text>
  <g fill="#fff" stroke="#ebe7df" stroke-width="2">
    <rect x="20" y="70" width="370" height="350" rx="14"/>
    <rect x="410" y="70" width="370" height="350" rx="14"/>
  </g>
  <text x="205" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">盆景（中国）</text>
  <text x="595" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#22201c">盆栽（日本）</text>
  <!-- penjing: wide tray with rocks and small trees -->
  <path d="M60 280 h290 l-14 22 h-262 z" fill="#8b6b4a"/>
  <path d="M90 280 l40 -90 l30 50 l24 -30 l36 70 z" fill="#6b655b"/>
  <path d="M240 280 v-46" stroke="#6f5439" stroke-width="5"/>
  <ellipse cx="240" cy="228" rx="30" ry="16" fill="#5b7f4a"/>
  <path d="M290 280 v-30" stroke="#6f5439" stroke-width="4"/>
  <ellipse cx="290" cy="246" rx="20" ry="11" fill="#5b7f4a"/>
  <rect x="200" y="272" width="60" height="8" fill="#9db7c9"/>
  <!-- bonsai -->
  <path d="M520 280 h150 l-14 26 h-122 z" fill="#8b6b4a"/>
  <path d="M595 280 q-20 -40 10 -70 q20 -20 -6 -50" fill="none" stroke="#6f5439" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="560" cy="200" rx="44" ry="18" fill="#5b7f4a"/>
  <ellipse cx="640" cy="176" rx="48" ry="18" fill="#5b7f4a"/>
  <ellipse cx="598" cy="146" rx="36" ry="16" fill="#5b7f4a"/>
  <g font-size="22" fill="#22201c" text-anchor="middle">
    <text x="205" y="350">石や水も使い</text>
    <text x="205" y="384">風景を鉢に描く</text>
    <text x="595" y="350">一本の樹の姿で</text>
    <text x="595" y="384">自然の景色を表す</text>
  </g>
</svg>
