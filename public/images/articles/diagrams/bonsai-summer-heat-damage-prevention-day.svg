<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>夏の1日の管理</title>
  <rect width="800" height="460" fill="#faf7f0"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#2c2a26">夏の1日の管理</text>
  <rect x="20" y="76" width="240" height="320" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="20" y="76" width="240" height="56" rx="14" fill="#b8935a"/><rect x="20" y="114" width="240" height="18" fill="#b8935a"/>
  <text x="140" y="114" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">朝</text>
  <text x="140" y="190" text-anchor="middle" font-size="23" fill="#2c2a26">鉢底から</text>
  <text x="140" y="222" text-anchor="middle" font-size="23" fill="#2c2a26">流れるまで</text>
  <text x="140" y="254" text-anchor="middle" font-size="23" fill="#2c2a26">たっぷり</text>
  <text x="140" y="346" text-anchor="middle" font-size="22" fill="#5b7f4a" font-weight="700">毎日の基本</text>

  <rect x="280" y="76" width="240" height="320" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="280" y="76" width="240" height="56" rx="14" fill="#8b6b4a"/><rect x="280" y="114" width="240" height="18" fill="#8b6b4a"/>
  <text x="400" y="114" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">昼</text>
  <text x="400" y="190" text-anchor="middle" font-size="23" fill="#2c2a26">午後の日差しを</text>
  <text x="400" y="222" text-anchor="middle" font-size="23" fill="#2c2a26">遮る</text>
  <text x="400" y="286" text-anchor="middle" font-size="22" fill="#2c2a26">熱い水は与えない</text>
  <text x="400" y="346" text-anchor="middle" font-size="22" fill="#8b6b4a" font-weight="700">ミニ盆栽は確認</text>

  <rect x="540" y="76" width="240" height="320" rx="14" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="540" y="76" width="240" height="56" rx="14" fill="#4f86b5"/><rect x="540" y="114" width="240" height="18" fill="#4f86b5"/>
  <text x="660" y="114" text-anchor="middle" font-size="26" font-weight="700" fill="#faf7f0">夕方</text>
  <text x="660" y="190" text-anchor="middle" font-size="23" fill="#2c2a26">乾いていれば</text>
  <text x="660" y="222" text-anchor="middle" font-size="23" fill="#2c2a26">もう一度</text>
  <text x="660" y="286" text-anchor="middle" font-size="22" fill="#2c2a26">葉水・打ち水</text>
  <text x="660" y="346" text-anchor="middle" font-size="22" fill="#2c2a26" font-weight="700">夜の温度を下げる</text>
<text x="776" y="444" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
