<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>オフィスの盆栽の一週間の水やり</title>
  <rect width="800" height="330" fill="#faf9f6"/>
  <rect x="20" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="20" y="20" width="172" height="70" rx="16" fill="#1a365d"/><rect x="20" y="70" width="172" height="20" fill="#1a365d"/>
  <text x="106" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">月</text>
  <path d="M106 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#1a365d" fill-opacity="0.25" stroke="#1a365d" stroke-width="3"/>
  <text x="106" y="244" text-anchor="middle" font-size="22" fill="#22201c">乾き具合を</text>
  <text x="106" y="276" text-anchor="middle" font-size="22" fill="#22201c">確かめる</text>
  <rect x="216" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="216" y="20" width="172" height="70" rx="16" fill="#5b7f4a"/><rect x="216" y="70" width="172" height="20" fill="#5b7f4a"/>
  <text x="302" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">火〜木</text>
  <path d="M302 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#5b7f4a" fill-opacity="0.25" stroke="#5b7f4a" stroke-width="3"/>
  <text x="302" y="244" text-anchor="middle" font-size="22" fill="#22201c">乾いたら</text>
  <text x="302" y="276" text-anchor="middle" font-size="22" fill="#22201c">たっぷり</text>
  <rect x="412" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="412" y="20" width="172" height="70" rx="16" fill="#b8935a"/><rect x="412" y="70" width="172" height="20" fill="#b8935a"/>
  <text x="498" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">金</text>
  <path d="M498 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#b8935a" fill-opacity="0.25" stroke="#b8935a" stroke-width="3"/>
  <text x="498" y="244" text-anchor="middle" font-size="22" fill="#22201c">水をやり</text>
  <text x="498" y="276" text-anchor="middle" font-size="22" fill="#22201c">窓から離す</text>
  <rect x="608" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <rect x="608" y="20" width="172" height="70" rx="16" fill="#8b6b4a"/><rect x="608" y="70" width="172" height="20" fill="#8b6b4a"/>
  <text x="694" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">連休</text>
  <path d="M694 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#8b6b4a" fill-opacity="0.25" stroke="#8b6b4a" stroke-width="3"/>
  <text x="694" y="244" text-anchor="middle" font-size="22" fill="#22201c">持ち帰るか</text>
  <text x="694" y="276" text-anchor="middle" font-size="22" fill="#22201c">腰水にする</text>
</svg>
