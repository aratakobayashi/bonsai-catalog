<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>オフィスの盆栽の一週間の水やり</title>
  <rect width="800" height="370" fill="#faf7f0"/>
  <rect x="20" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="20" y="20" width="172" height="70" rx="16" fill="#4f86b5"/><rect x="20" y="70" width="172" height="20" fill="#4f86b5"/>
  <text x="24" y="66" font-size="28" font-weight="700" fill="#fff">月</text>
  <path d="M106 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#b8935a" fill-opacity="0.25" stroke="#b8935a" stroke-width="3"/>
  <text x="106" y="244" text-anchor="middle" font-size="22" fill="#2c2a26">乾き具合を</text>
  <text x="106" y="276" text-anchor="middle" font-size="22" fill="#2c2a26">確かめる</text>
  <rect x="216" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="216" y="20" width="172" height="70" rx="16" fill="#5b7f4a"/><rect x="216" y="70" width="172" height="20" fill="#5b7f4a"/>
  <text x="302" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">火〜木</text>
  <path d="M302 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#5b7f4a" fill-opacity="0.25" stroke="#5b7f4a" stroke-width="3"/>
  <text x="302" y="244" text-anchor="middle" font-size="22" fill="#2c2a26">乾いたら</text>
  <text x="302" y="276" text-anchor="middle" font-size="22" fill="#2c2a26">たっぷり</text>
  <rect x="412" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="412" y="20" width="172" height="70" rx="16" fill="#b8935a"/><rect x="412" y="70" width="172" height="20" fill="#b8935a"/>
  <text x="498" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">金</text>
  <path d="M498 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#b8935a" fill-opacity="0.25" stroke="#b8935a" stroke-width="3"/>
  <text x="498" y="244" text-anchor="middle" font-size="22" fill="#2c2a26">水をやり</text>
  <text x="498" y="276" text-anchor="middle" font-size="22" fill="#2c2a26">窓から離す</text>
  <rect x="608" y="20" width="172" height="290" rx="16" fill="#fff" stroke="#d9d1c3" stroke-width="2"/>
  <rect x="608" y="20" width="172" height="70" rx="16" fill="#8b6b4a"/><rect x="608" y="70" width="172" height="20" fill="#8b6b4a"/>
  <text x="694" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">連休</text>
  <path d="M694 120 q-24 34 -24 52 a24 24 0 0 0 48 0 q0 -18 -24 -52 z" fill="#8b6b4a" fill-opacity="0.25" stroke="#8b6b4a" stroke-width="3"/>
  <text x="694" y="244" text-anchor="middle" font-size="22" fill="#2c2a26">持ち帰るか</text>
  <text x="694" y="276" text-anchor="middle" font-size="22" fill="#2c2a26">腰水にする</text>
<text x="776" y="354" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
