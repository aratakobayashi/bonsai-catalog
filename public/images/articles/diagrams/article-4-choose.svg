<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" data-restyled="1" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>ミニ盆栽の最初の一鉢を選ぶときに見るところ。葉の色とつや、幹がぐらつかないか、虫や白い粉がないか、鉢底から根が出すぎていないか</title>
  <rect width="800" height="510" fill="#faf7f0"/>
  <text x="24" y="44" font-size="30" font-weight="700" fill="#2c2a26">最初の一鉢で見るところ</text>
  <rect x="319.0" y="324" width="162.0" height="9" rx="3" fill="#8b6b4a"/>
  <path d="M325.0 330 L475.0 330 L458.5 367.5 L341.5 367.5 Z" fill="#8b6b4a"/>
  <path d="M400 330 C392.5 280.0 422.5 255.0 405.0 205.0" stroke="#6f5439" stroke-width="11.25" fill="none" stroke-linecap="round"/>
  <ellipse cx="362.5" cy="211.25" rx="52.5" ry="32.5" fill="#5b7f4a"/>
  <ellipse cx="442.5" cy="192.5" rx="50.0" ry="30.0" fill="#5b7f4a"/>
  <ellipse cx="405.0" cy="161.25" rx="55.0" ry="32.5" fill="#5b7f4a"/>
  <circle cx="300" cy="200" r="7" fill="#b8935a"/>
  <path d="M300 200 L260 122" stroke="#b8935a" stroke-width="2.5" fill="none"/>
  <text x="250" y="130" text-anchor="end" font-size="24" font-weight="700" fill="#2c2a26">葉の色とつや</text>
  <text x="250" y="162" text-anchor="end" font-size="21" fill="#6b655b">黄ばみや斑点がない</text>
  <circle cx="350" cy="300" r="7" fill="#b8935a"/>
  <path d="M350 300 L260 292" stroke="#b8935a" stroke-width="2.5" fill="none"/>
  <text x="250" y="300" text-anchor="end" font-size="24" font-weight="700" fill="#2c2a26">幹がぐらつかない</text>
  <text x="250" y="332" text-anchor="end" font-size="21" fill="#6b655b">根元を軽く押して確認</text>
  <circle cx="480" cy="180" r="7" fill="#b8935a"/>
  <path d="M480 180 L540 122" stroke="#b8935a" stroke-width="2.5" fill="none"/>
  <text x="550" y="130" font-size="24" font-weight="700" fill="#2c2a26">虫や白い粉がない</text>
  <text x="550" y="162" font-size="21" fill="#6b655b">葉の裏と枝の分かれ目</text>
  <circle cx="450" cy="360" r="7" fill="#b8935a"/>
  <path d="M450 360 L540 322" stroke="#b8935a" stroke-width="2.5" fill="none"/>
  <text x="550" y="330" font-size="24" font-weight="700" fill="#2c2a26">鉢底の根</text>
  <text x="550" y="362" font-size="21" fill="#6b655b">根が出すぎていない</text>
  <text x="400" y="440" text-anchor="middle" font-size="22" fill="#2c2a26">名札で樹種名と育て方を確かめる</text>
<text x="776" y="494" font-size="18" font-weight="500" fill="#b8935a" text-anchor="end" letter-spacing="2">盆栽コレクション</text></svg>
