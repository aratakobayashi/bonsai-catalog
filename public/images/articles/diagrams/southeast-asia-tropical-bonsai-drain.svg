<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <title>雨の多い時期の鉢：水が抜ける鉢と、水がたまる鉢</title>
  <rect width="800" height="480" fill="#faf9f6"/>

  <!-- 左：水が抜ける -->
  <rect x="20" y="20" width="370" height="440" rx="14" fill="#fff" stroke="#5b7f4a" stroke-width="3"/>
  <text x="205" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="#5b7f4a">○ 水がすっと抜ける</text>
  <!-- 雨 -->
  <g stroke="#1a365d" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="88" x2="112" y2="110"/><line x1="170" y1="84" x2="162" y2="106"/>
    <line x1="220" y1="88" x2="212" y2="110"/><line x1="270" y1="84" x2="262" y2="106"/>
  </g>
  <!-- 鉢 -->
  <path d="M90 150 h230 l-22 120 h-186 z" fill="#8b6b4a"/>
  <rect x="86" y="142" width="238" height="14" rx="4" fill="#6f5439"/>
  <!-- 粒の大きい土 -->
  <g fill="#e3d2b4" stroke="#c9b48f" stroke-width="1.5">
    <circle cx="118" cy="176" r="11"/><circle cx="146" cy="180" r="11"/><circle cx="174" cy="176" r="11"/>
    <circle cx="202" cy="180" r="11"/><circle cx="230" cy="176" r="11"/><circle cx="258" cy="180" r="11"/><circle cx="286" cy="176" r="11"/>
    <circle cx="128" cy="204" r="11"/><circle cx="156" cy="208" r="11"/><circle cx="184" cy="204" r="11"/>
    <circle cx="212" cy="208" r="11"/><circle cx="240" cy="204" r="11"/><circle cx="268" cy="208" r="11"/>
  </g>
  <g fill="#b8935a">
    <circle cx="132" cy="240" r="14"/><circle cx="166" cy="244" r="14"/><circle cx="200" cy="240" r="14"/>
    <circle cx="234" cy="244" r="14"/><circle cx="268" cy="240" r="14"/>
  </g>
  <!-- 台 -->
  <rect x="120" y="292" width="40" height="44" fill="#6b655b"/>
  <rect x="250" y="292" width="40" height="44" fill="#6b655b"/>
  <rect x="80" y="336" width="250" height="10" rx="3" fill="#6b655b"/>
  <!-- 抜ける水 -->
  <g stroke="#1a365d" stroke-width="4" stroke-linecap="round">
    <line x1="205" y1="276" x2="205" y2="300"/><line x1="190" y1="282" x2="186" y2="304"/><line x1="220" y1="282" x2="224" y2="304"/>
  </g>
  <text x="205" y="392" text-anchor="middle" font-size="22" fill="#22201c">粒の大きい土・鉢底に大粒</text>
  <text x="205" y="428" text-anchor="middle" font-size="22" fill="#22201c">台に載せて鉢底を浮かす</text>

  <!-- 右：水がたまる -->
  <rect x="410" y="20" width="370" height="440" rx="14" fill="#fff" stroke="#ebe7df" stroke-width="2"/>
  <text x="595" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="#b4573a">× 水がたまる</text>
  <g stroke="#1a365d" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="510" y1="88" x2="502" y2="110"/><line x1="560" y1="84" x2="552" y2="106"/>
    <line x1="610" y1="88" x2="602" y2="110"/><line x1="660" y1="84" x2="652" y2="106"/>
  </g>
  <path d="M480 150 h230 l-22 120 h-186 z" fill="#8b6b4a"/>
  <rect x="476" y="142" width="238" height="14" rx="4" fill="#6f5439"/>
  <!-- 細かく詰まった土＋たまった水 -->
  <path d="M488 160 h214 l-6 34 h-202 z" fill="#8b6b4a" opacity="0.55"/>
  <path d="M494 194 h202 l-12 70 h-178 z" fill="#1a365d" opacity="0.35"/>
  <g fill="#6f5439" opacity="0.6">
    <circle cx="520" cy="176" r="3"/><circle cx="560" cy="182" r="3"/><circle cx="600" cy="174" r="3"/><circle cx="640" cy="182" r="3"/><circle cx="676" cy="176" r="3"/>
  </g>
  <!-- 受け皿 -->
  <path d="M470 274 h250 l-14 26 h-222 z" fill="#ebe7df" stroke="#6b655b" stroke-width="2"/>
  <rect x="490" y="278" width="210" height="10" fill="#1a365d" opacity="0.45"/>
  <text x="595" y="392" text-anchor="middle" font-size="22" fill="#22201c">細かい土が詰まっている</text>
  <text x="595" y="428" text-anchor="middle" font-size="22" fill="#22201c">受け皿に水がたまったまま</text>
</svg>
